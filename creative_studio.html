<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creative Studio • Marketing Hub</title>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/hqv8hwr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="description" content="Creative Studio - Drag-and-drop HTML email builder for property marketing teams." />
  <style>
    :root{ --brand-primary:#446472; --brand-accent:#ffb732; --brand-accent-2:#52d5ff; --brand-gray:#929497; --page-bg:#f8fafc; --bg:#ffffff; --panel:#ffffff; --muted:#ffffff; --text:#1e293b; --subtext:#64748b; --accent:var(--brand-accent-2); --accent-2:var(--brand-accent); --border:#e2e8f0; }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{margin:0; font-family:'Open Sans',system-ui,-apple-system,sans-serif; background:var(--page-bg); color:var(--text);font-size:14px;line-height:1.5}

    /* Header */
    header{padding:12px 24px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .brand .logo-img{height:28px;width:auto}
    .brand .title{color:#ffb732;font-family:zooja-pro,Arial,sans-serif;font-size:clamp(32px,4vw,48px);line-height:1}
    .header-controls{display:flex;align-items:center;gap:12px;margin-left:auto}
    .header-controls select{background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--text);min-width:200px;cursor:pointer}
    .header-controls select:focus{outline:none;border-color:var(--brand-accent-2);box-shadow:0 0 0 3px rgba(82,213,255,0.15)}
    .company-name{font-size:12px;color:var(--subtext);font-weight:500}

    /* Creative Studio Container - full viewport minus header */
    #email-shop-root {
      position: fixed;
      top: 49px; /* header height */
      left: 0;
      right: 0;
      bottom: 0;
      overflow: hidden;
    }

    /* Hide the sidebar nav for Creative Studio - it uses its own full-screen UI */
    .sidebar-nav, .nav-toggle { display: none !important; }
    .main-content { margin-left: 0 !important; padding: 0 !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo-main.svg" alt="CMP Marketing Hub" class="logo-img" onerror="this.style.display='none'">
      <span class="title">MarketingHub</span>
    </div>
    <div class="header-controls">
      <span class="company-name" id="userLabel"></span>
    </div>
  </header>

  <!-- React app mounts here -->
  <div id="email-shop-root"></div>

  <!-- Standard nav (will be hidden via CSS above but still injects properly) -->
  <script src="standard-nav.js"></script>

  <script>
    // ---- Auth — User-centric Creative Studio ----
    (function() {
      'use strict';

      // Show loading state
      document.getElementById('email-shop-root').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 60px);color:#64748b;font-size:16px">Loading Creative Studio...</div>';

      // Use /api/me to verify auth (cookie is HttpOnly, can't read via JS)
      fetch('/.netlify/functions/me', { credentials: 'include' })
        .then(function(r) {
          if (!r.ok) throw new Error('Not authenticated');
          return r.json();
        })
        .then(function(userData) {
          var user = {
            username: userData.username || '',
            role: userData.role || 'user',
            properties: Array.isArray(userData.properties) ? userData.properties
              : userData.properties === '*' ? ['*'] : []
          };

          // Expose user info for the React app
          window.__EMAIL_SHOP_USER__ = user;

          // Show username in header
          document.getElementById('userLabel').textContent = user.username;

          // Clear loading state and load the React app immediately
          document.getElementById('email-shop-root').innerHTML = '';

          // Load the CSS
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '/email-shop/dist/assets/email-shop-index.css';
          document.head.appendChild(link);

          // Load the JS
          var script = document.createElement('script');
          script.id = 'email-shop-script';
          script.type = 'module';
          script.src = '/email-shop/dist/assets/email-shop.js';
          document.body.appendChild(script);
        })
        .catch(function() {
          window.location.href = 'index.html';
        });
    })();
  </script>
</body>
</html>
