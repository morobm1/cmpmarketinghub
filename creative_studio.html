<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Creative Studio • Marketing Hub</title>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/hqv8hwr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <meta name="description" content="Creative Studio - Drag-and-drop HTML email builder for property marketing teams." />
  <style>
    :root{ --brand-primary:#446472; --brand-accent:#ffb732; --brand-accent-2:#52d5ff; --brand-gray:#929497; --page-bg:#f8fafc; --bg:#ffffff; --panel:#ffffff; --muted:#ffffff; --text:#1e293b; --subtext:#64748b; --accent:var(--brand-accent-2); --accent-2:var(--brand-accent); --border:#e2e8f0; }
    *{box-sizing:border-box;margin:0;padding:0}
    html,body{height:100%;overflow:hidden}
    body{margin:0; font-family:'Open Sans',system-ui,-apple-system,sans-serif; background:var(--page-bg); color:var(--text);font-size:14px;line-height:1.5}

    /* Header */
    header{padding:12px 24px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .brand .logo-img{height:28px;width:auto}
    .brand .title{color:#ffb732;font-family:zooja-pro,Arial,sans-serif;font-size:clamp(32px,4vw,48px);line-height:1}
    .header-controls{display:flex;align-items:center;gap:12px;margin-left:auto}
    .header-controls select{background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 12px;font-size:13px;color:var(--text);min-width:200px;cursor:pointer}
    .header-controls select:focus{outline:none;border-color:var(--brand-accent-2);box-shadow:0 0 0 3px rgba(82,213,255,0.15)}
    .company-name{font-size:12px;color:var(--subtext);font-weight:500}

    /* Email Shop Container - full viewport minus header */
    #email-shop-root {
      height: calc(100vh - 60px);
      width: 100%;
      overflow: hidden;
    }

    /* Property selector overlay */
    .property-selector-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .property-selector-modal {
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    }
    .property-selector-modal h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #1e293b;
    }
    .property-selector-modal p {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 20px;
    }
    .property-btn {
      display: block;
      width: 100%;
      padding: 14px 16px;
      margin-bottom: 8px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      color: #1e293b;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }
    .property-btn:hover {
      background: #eff6ff;
      border-color: #52d5ff;
    }

    /* Hide the sidebar nav for Email Shop - it uses its own full-screen UI */
    .sidebar-nav, .nav-toggle { display: none !important; }
    .main-content { margin-left: 0 !important; }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo-main.svg" alt="CMP Marketing Hub" class="logo-img" onerror="this.style.display='none'">
      <span class="title">MarketingHub</span>
    </div>
    <div class="header-controls">
      <span class="company-name" id="propertyLabel"></span>
      <select id="propertySelect" style="display:none" onchange="switchProperty(this.value)"></select>
    </div>
  </header>

  <!-- Property selector shown if user has multiple properties -->
  <div id="propertySelectorOverlay" class="property-selector-overlay" style="display:none">
    <div class="property-selector-modal">
      <h2>🎨 Creative Studio</h2>
      <p>Select a property to get started with email creation.</p>
      <div id="propertyList"></div>
    </div>
  </div>

  <!-- React app mounts here -->
  <div id="email-shop-root"></div>

  <!-- Standard nav (will be hidden via CSS above but still injects properly) -->
  <script src="standard-nav.js"></script>

  <script>
    // ---- Auth & Property Selection ----
    (function() {
      'use strict';

      // Use /api/me to verify auth (cookie is HttpOnly, can't read via JS)
      function fetchUser() {
        return fetch('/.netlify/functions/me', { credentials: 'include' })
          .then(function(r) {
            if (!r.ok) return null;
            return r.json();
          })
          .catch(function() { return null; });
      }

      // Show loading state
      document.getElementById('email-shop-root').innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:calc(100vh - 60px);color:#64748b;font-size:16px">Loading Creative Studio...</div>';

      fetchUser().then(function(userData) {
        if (!userData) {
          window.location.href = 'index.html';
          return;
        }

        var user = {
          username: userData.username || '',
          role: userData.role || 'user',
          properties: Array.isArray(userData.properties) ? userData.properties
            : userData.properties === '*' ? ['*'] : []
        };

        // Expose user info for the React app
        window.__EMAIL_SHOP_USER__ = user;

        // Fetch properties for names
        var propertyNames = {};
        function loadProperties() {
          return fetch('/.netlify/functions/properties', { credentials: 'include' })
            .then(function(r) { return r.json(); })
            .then(function(props) {
              if (Array.isArray(props)) {
                props.forEach(function(p) {
                  propertyNames[p.id || p._id] = p.name || p.id || p._id;
                });
              }
              return propertyNames;
            })
            .catch(function() { return propertyNames; });
        }

        function startApp(propertyId, propertyName) {
          document.getElementById('propertySelectorOverlay').style.display = 'none';
          document.getElementById('email-shop-root').innerHTML = '';
          document.getElementById('propertyLabel').textContent = propertyName || propertyId;
          window.__EMAIL_SHOP_PROPERTY__ = { id: propertyId, name: propertyName || propertyId };

          // Show property switcher if multiple
          if (user.properties.length > 1 || user.properties[0] === '*') {
            var sel = document.getElementById('propertySelect');
            sel.style.display = '';
            sel.innerHTML = '';
            var ids = user.properties[0] === '*' ? Object.keys(propertyNames) : user.properties;
            ids.forEach(function(pid) {
              var opt = document.createElement('option');
              opt.value = pid;
              opt.textContent = propertyNames[pid] || pid;
              if (pid === propertyId) opt.selected = true;
              sel.appendChild(opt);
            });
          }

          // Load the React app bundle
          loadReactApp();
        }

        window.switchProperty = function(newId) {
          startApp(newId, propertyNames[newId] || newId);
        };

        function showPropertySelector(ids) {
          var overlay = document.getElementById('propertySelectorOverlay');
          var list = document.getElementById('propertyList');
          list.innerHTML = '';
          ids.forEach(function(pid) {
            var btn = document.createElement('button');
            btn.className = 'property-btn';
            btn.textContent = propertyNames[pid] || pid;
            btn.onclick = function() { startApp(pid, propertyNames[pid] || pid); };
            list.appendChild(btn);
          });
          overlay.style.display = 'flex';
        }

        loadProperties().then(function() {
          var props = user.properties;
          if (props[0] === '*') {
            props = Object.keys(propertyNames);
          }
          if (props.length === 0) {
            document.getElementById('email-shop-root').innerHTML = '<div style="padding:40px;text-align:center;color:#64748b"><h2>No Properties Assigned</h2><p>Contact your admin to get access to properties.</p></div>';
          } else if (props.length === 1) {
            startApp(props[0], propertyNames[props[0]] || props[0]);
          } else {
            showPropertySelector(props);
          }
        });

        function loadReactApp() {
          // Check if already loaded
          if (document.getElementById('email-shop-script')) return;

          // Load the CSS
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = '/email-shop/dist/assets/email-shop-index.css';
          document.head.appendChild(link);

          // Load the JS
          var script = document.createElement('script');
          script.id = 'email-shop-script';
          script.type = 'module';
          script.src = '/email-shop/dist/assets/email-shop.js';
          document.body.appendChild(script);
        }
      }); // end fetchUser().then()
    })();
  </script>
</body>
</html>
