<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Font Text to Image Generator</title>
  <link rel="stylesheet" href="https://use.typekit.net/iol5fuu.css">
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f5;
      --card: #fff;
      --border: #ddd;
      --text: #222;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1a1a;
        --card: #2a2a2a;
        --border: #444;
        --text: #eee;
      }
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 2rem;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    h1 { margin-top: 0; font-size: 1.5rem; }
    .container { max-width: 900px; margin: 0 auto; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    input[type="text"], input[type="number"], input[type="color"], select {
      padding: 0.6rem 0.8rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    input[type="text"] { width: 100%; font-size: 1.1rem; }
    input[type="color"] { width: 60px; height: 40px; padding: 2px; cursor: pointer; }
    .row { display: flex; gap: 1rem; flex-wrap: wrap; align-items: flex-end; margin-bottom: 1rem; }
    .row > div { flex: 1; min-width: 120px; }
    button {
      padding: 0.7rem 1.5rem;
      border-radius: 8px;
      border: none;
      background: #155eef;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #1249c4; }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .preview-area {
      background: repeating-conic-gradient(#ccc 0% 25%, #fff 0% 50%) 50% / 20px 20px;
      border-radius: 8px;
      min-height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: auto;
      padding: 1rem;
    }
    @media (prefers-color-scheme: dark) {
      .preview-area {
        background: repeating-conic-gradient(#444 0% 25%, #333 0% 50%) 50% / 20px 20px;
      }
    }
    #previewText {
      font-family: "zooja-pro", cursive;
      white-space: nowrap;
      user-select: none;
    }
    .actions { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
    .note { font-size: 0.85rem; color: #888; margin-top: 0.5rem; }
    canvas { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Font Text to Transparent PNG</h1>
    <p>Type your text, customize the style, then export as a transparent PNG for Canva.</p>

    <div class="card">
      <label for="textInput">Your Text</label>
      <input type="text" id="textInput" value="Hello World" placeholder="Enter text here...">
    </div>

    <div class="card">
      <div class="row">
        <div>
          <label for="fontSize">Font Size (px)</label>
          <input type="number" id="fontSize" value="120" min="12" max="500">
        </div>
        <div>
          <label for="fontColor">Text Color</label>
          <div style="display:flex;gap:0.5rem;align-items:center;">
            <input type="color" id="fontColorPicker" value="#000000">
            <input type="text" id="fontColor" value="#000000" style="width:100px;">
          </div>
        </div>
        <div>
          <label for="fontWeight">Weight</label>
          <select id="fontWeight">
            <option value="400">Normal (400)</option>
            <option value="700">Bold (700)</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div>
          <label for="letterSpacing">Letter Spacing (px)</label>
          <input type="number" id="letterSpacing" value="0" min="-20" max="50">
        </div>
        <div>
          <label for="scale">Export Scale</label>
          <select id="scale">
            <option value="1">1x</option>
            <option value="2" selected>2x (Recommended)</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </div>
      </div>
    </div>

    <div class="card">
      <label>Preview (transparent background)</label>
      <div class="preview-area">
        <span id="previewText">Hello World</span>
      </div>
      <div class="actions">
        <button id="downloadBtn">Download PNG</button>
      </div>
      <p class="note">The checkerboard pattern indicates transparency. Your exported image will have no background.</p>
    </div>
  </div>

  <canvas id="canvas"></canvas>

  <script>
    const textInput = document.getElementById('textInput');
    const fontSize = document.getElementById('fontSize');
    const fontColor = document.getElementById('fontColor');
    const fontColorPicker = document.getElementById('fontColorPicker');
    const fontWeight = document.getElementById('fontWeight');
    const letterSpacing = document.getElementById('letterSpacing');
    const scale = document.getElementById('scale');
    const previewText = document.getElementById('previewText');
    const downloadBtn = document.getElementById('downloadBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    fontColorPicker.addEventListener('input', () => {
      fontColor.value = fontColorPicker.value.toUpperCase();
      updatePreview();
    });

    fontColor.addEventListener('input', () => {
      let val = fontColor.value.trim();
      if (val && !val.startsWith('#')) val = '#' + val;
      if (/^#[0-9A-Fa-f]{6}$/.test(val)) {
        fontColorPicker.value = val;
        fontColor.value = val.toUpperCase();
        updatePreview();
      }
    });

    fontColor.addEventListener('blur', () => {
      fontColor.value = fontColor.value.toUpperCase();
    });

    function updatePreview() {
      const text = textInput.value || ' ';
      previewText.textContent = text;
      previewText.style.fontSize = fontSize.value + 'px';
      previewText.style.color = fontColor.value;
      previewText.style.fontWeight = fontWeight.value;
      previewText.style.letterSpacing = letterSpacing.value + 'px';
    }

    function downloadPNG() {
      const text = textInput.value || ' ';
      const size = parseInt(fontSize.value, 10);
      const color = fontColor.value;
      const weight = fontWeight.value;
      const spacing = parseInt(letterSpacing.value, 10);
      const scaleVal = parseInt(scale.value, 10);

      const fontStr = `${weight} ${size * scaleVal}px "zooja-pro", cursive`;
      ctx.font = fontStr;
      ctx.textBaseline = 'top';

      let totalWidth = 0;
      for (let i = 0; i < text.length; i++) {
        totalWidth += ctx.measureText(text[i]).width;
        if (i < text.length - 1) totalWidth += spacing * scaleVal;
      }

      const metrics = ctx.measureText(text);
      const height = (metrics.actualBoundingBoxAscent + metrics.actualBoundingBoxDescent) || size * scaleVal * 1.2;

      canvas.width = Math.ceil(totalWidth) + 20;
      canvas.height = Math.ceil(height) + 20;

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.font = fontStr;
      ctx.fillStyle = color;
      ctx.textBaseline = 'top';

      let x = 10;
      for (let i = 0; i < text.length; i++) {
        ctx.fillText(text[i], x, 10);
        x += ctx.measureText(text[i]).width + spacing * scaleVal;
      }

      const link = document.createElement('a');
      link.download = 'text-image.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    downloadBtn.addEventListener('click', downloadPNG);
    [textInput, fontSize, fontWeight, letterSpacing].forEach(el => el.addEventListener('input', updatePreview));

    document.fonts.ready.then(() => {
      updatePreview();
    });
  </script>
</body>
</html>
