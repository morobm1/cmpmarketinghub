<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CMP Font • Marketing Hub</title>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="preconnect" href="https://p.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/hqv8hwr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand-primary: #446472;
      --brand-accent: #ffb732;
      --brand-accent-2: #52d5ff;
      --page-bg: #f8fafc;
      --text: #1e293b;
      --subtext: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Open Sans', system-ui, sans-serif;
      background: var(--page-bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 12px 24px;
      border-bottom: 1px solid var(--border);
      background: #fff;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand .logo-img {
      height: 28px;
      width: auto;
    }
    .brand .title {
      color: #ffb732;
      font-family: zooja-pro, Arial, sans-serif;
      font-size: clamp(32px, 4vw, 48px);
      line-height: 1;
    }
    .header-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }
    .header-btn {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      transition: all .15s;
      text-decoration: none;
    }
    .header-btn:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }
    .header-btn.back {
      background: #dcfce7;
      border-color: #86efac;
      color: #166534;
    }
    .main-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 16px;
    }
    p {
      color: var(--subtext);
      font-size: 16px;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <img src="logo-main.svg" class="logo-img" alt="Capstone" onerror="this.style.display='none'">
      <div class="title">Marketing Hub</div>
    </div>
    <div class="header-controls">
      <a href="mmp_admin.html" class="header-btn back">← Back to Admin</a>
    </div>
  </header>

  <div class="main-container">
    <h1>CMP Font</h1>
    <p>This page is under construction.</p>
  </div>
</body>
</html>
