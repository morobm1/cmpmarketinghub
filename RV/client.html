<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admit Radius Report — Client Portal</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f8fafc;--panel:#ffffff;--text:#0f172a;--subtext:#64748b;
  --border:#e2e8f0;--brand:#4b2e83;--brand-light:#e8e0f0;
  --green:#22c55e;--orange:#f97316;--red:#ef4444;--purple:#8b5cf6;
  --shadow-md:0 4px 12px rgba(0,0,0,0.08);--shadow-lg:0 10px 25px rgba(0,0,0,0.12);
  --radius:10px;--radius-lg:14px;
}
html,body{height:100%;font-family:'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

/* Header */
.portal-header{background:linear-gradient(135deg,#4b2e83 0%,#32174f 100%);color:#fff;padding:16px 28px;display:flex;justify-content:space-between;align-items:center}
.portal-header h1{font-size:17px;font-weight:800}
.portal-header .sub{font-size:12px;opacity:0.7;font-weight:500;margin-top:1px}
.logout-btn{background:rgba(255,255,255,0.12);border:1px solid rgba(255,255,255,0.2);color:#fff;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.logout-btn:hover{background:rgba(255,255,255,0.22)}

/* Login screen */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:32px;max-width:380px;width:100%}
.login-card h1{font-size:20px;font-weight:800;margin-bottom:6px;color:var(--brand)}
.login-card p{font-size:13px;color:var(--subtext);margin-bottom:20px}
.login-card label{font-size:12px;font-weight:600;display:block;margin-bottom:5px;margin-top:14px}
.login-card input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px}
.login-card input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(75,46,131,0.12)}
.login-card button{width:100%;margin-top:20px;padding:11px;border:none;border-radius:8px;background:var(--brand);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.login-card button:hover{background:#3d2569}
.login-card button:disabled{opacity:0.6;cursor:default}
.login-error{margin-top:14px;padding:10px 12px;background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;font-size:12px;font-weight:500;display:none}
.login-error.show{display:block}

/* Loading */
.loading-screen{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--brand);font-weight:600}
.spinner{width:36px;height:36px;border:4px solid var(--border);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Dashboard */
.dashboard{padding:24px 28px;max-width:1400px;margin:0 auto}
.section-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--subtext);margin-bottom:12px}
.kpi-row{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.kpi-card .v{font-size:24px;font-weight:800;color:var(--text)}
.kpi-card .l{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--subtext);margin-top:2px}
.kpi-card.band-green{border-left:3px solid var(--green)} .kpi-card.band-green .v{color:var(--green)}
.kpi-card.band-orange{border-left:3px solid var(--orange)} .kpi-card.band-orange .v{color:var(--orange)}
.kpi-card.band-red{border-left:3px solid var(--red)} .kpi-card.band-red .v{color:var(--red)}
.kpi-card.band-purple{border-left:3px solid var(--purple)} .kpi-card.band-purple .v{color:var(--purple)}

.main-grid{display:flex;gap:16px;margin-bottom:24px}
.map-panel{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.map-el{height:520px;width:100%}
.side-panel{width:300px;flex-shrink:0;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;display:flex;flex-direction:column;gap:18px}
.stat-card{}
.stat-card:not(:first-child){border-top:1px solid var(--border);padding-top:18px}
.stat-card .title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--subtext);margin-bottom:10px}
.stat-row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;font-size:13px}
.stat-row .dot{width:10px;height:10px;border-radius:50%;display:inline-block;margin-right:7px}
.stat-row .lbl{color:#334155;font-weight:500}
.stat-row .val{font-weight:700;color:#0f172a}
.stat-row .pct{color:#94a3b8;font-weight:400}
.stat-big{font-size:28px;font-weight:800;color:var(--brand)}

.export-row{display:flex;gap:10px;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 16px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;text-decoration:none;transition:all .15s}
.btn:hover{background:#f8fafc;border-color:#cbd5e1}
.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn.primary:hover{background:#3d2569}

.compare-section{margin-top:12px;padding-top:24px;border-top:1px solid var(--border)}
.compare-section h2{font-size:16px;font-weight:800;margin-bottom:16px}
.compare-kpi-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.compare-kpi-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px}
.compare-kpi-card .ck-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--subtext);margin-bottom:10px}
.compare-kpi-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.compare-kpi-val{text-align:center;flex:1}
.compare-kpi-val .v{font-size:20px;font-weight:800}
.compare-kpi-val .l{font-size:10px;font-weight:700;color:var(--subtext);text-transform:uppercase;margin-top:1px}
.compare-kpi-delta{text-align:center;flex-shrink:0;min-width:60px}
.compare-kpi-delta .d{font-size:13px;font-weight:800}
.compare-kpi-delta .d.up{color:#22c55e} .compare-kpi-delta .d.down{color:#ef4444} .compare-kpi-delta .d.flat{color:#94a3b8}
.compare-table-wrap{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;margin-bottom:18px}
.compare-table-title{padding:11px 18px;font-size:13px;font-weight:700;border-bottom:1px solid var(--border);background:#f8fafc}
.compare-table{width:100%;border-collapse:collapse;font-size:13px}
.compare-table th{text-align:right;padding:7px 18px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--subtext);border-bottom:1px solid var(--border)}
.compare-table th:first-child{text-align:left}
.compare-table td{padding:7px 18px;border-bottom:1px solid #f1f5f9;text-align:right;font-weight:600}
.compare-table td:first-child{text-align:left;font-weight:500;color:var(--text)}
.compare-table .delta-up{color:#22c55e} .compare-table .delta-down{color:#ef4444} .compare-table .delta-flat{color:#94a3b8}
.compare-maps{display:flex;gap:16px}
.compare-map-panel{flex:1;background:var(--panel);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden}
.compare-map-panel-header{padding:10px 16px;font-size:12px;font-weight:700;border-bottom:1px solid var(--border);background:#f8fafc}
.compare-map-el{height:380px;width:100%}

.origin-marker{background:var(--brand);width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(75,46,131,0.5)}
.custom-marker{border-radius:50%;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,0.3);width:10px;height:10px}

@media(max-width:900px){
  .main-grid{flex-direction:column}
  .side-panel{width:100%}
  .kpi-row{grid-template-columns:repeat(2,1fr)}
  .compare-maps{flex-direction:column}
}
</style>
</head>
<body>

<div id="loadingScreen" class="loading-screen">
  <div class="spinner"></div>
  <div>Loading report…</div>
</div>

<div id="loginWrap" class="login-wrap" style="display:none">
  <div class="login-card">
    <h1>Client Portal</h1>
    <p>Sign in to view your admit radius report.</p>
    <form id="loginForm">
      <label>Username</label>
      <input type="text" id="loginUsername" autocomplete="username" required>
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password" required>
      <button type="submit" id="loginBtn">Sign In</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="appWrap" style="display:none">
  <div class="portal-header">
    <div>
      <h1 id="headerClientName">Client Report</h1>
      <div class="sub">Admit Radius Analysis · University of Washington Bothell</div>
    </div>
    <button class="logout-btn" id="logoutBtn">Log Out</button>
  </div>

  <div class="dashboard">
    <div class="section-label">Summary</div>
    <div class="kpi-row" id="kpiRow"></div>

    <div class="main-grid">
      <div class="map-panel"><div id="primaryMap" class="map-el"></div></div>
      <div class="side-panel" id="sidePanel"></div>
    </div>

    <div class="export-row" id="exportRow" style="display:none">
      <button class="btn primary" id="exportPdfBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download Report (PDF)
      </button>
      <a class="btn" id="exportCsvLink" href="#">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
        Download Summary (CSV)
      </a>
    </div>

    <div class="compare-section" id="compareSection" style="display:none"></div>
  </div>
</div>

<div id="execExportCanvas" style="position:fixed;left:-9999px;top:0;z-index:-1;pointer-events:none"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

<script>
(function() {
'use strict';

const API = '/.netlify/functions/rv-client-portal';
const ORIGIN = { lat: 47.7596, lng: -122.1892 };
const BANDS = [
  { min: 0, max: 10, label: '0–10 mi', color: '#22c55e', cssClass: 'green' },
  { min: 10, max: 50, label: '10–50 mi', color: '#f97316', cssClass: 'orange' },
  { min: 50, max: 100, label: '50–100 mi', color: '#ef4444', cssClass: 'red' },
  { min: 100, max: Infinity, label: '100+ mi', color: '#8b5cf6', cssClass: 'purple' }
];
const RADIUS_MILES = [10, 50, 100];
const MILES_TO_METERS = 1609.344;

const slug = new URLSearchParams(window.location.search).get('p') || '';

function escHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function formatNum(n) { return (n || 0).toLocaleString(); }
function slugify(str) { return String(str || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }

function addBasemap(map) {
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Esri, HERE, Garmin, &copy; OpenStreetMap contributors',
    maxZoom: 19, maxNativeZoom: 16
  }).addTo(map);
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
    attribution: '', maxZoom: 19, maxNativeZoom: 16
  }).addTo(map);
}

function getBandForDistance(dist) {
  if (dist == null) return null;
  for (const b of BANDS) { if (dist >= b.min && dist < b.max) return b; }
  return BANDS[BANDS.length - 1];
}

function createMarkerIcon(color) {
  return L.divIcon({ className: '', html: `<div class="custom-marker" style="background:${color}"></div>`, iconSize: [10, 10], iconAnchor: [5, 5] });
}

function computeStats(records) {
  const total = records.length;
  const bandCounts = {}; BANDS.forEach(b => bandCounts[b.label] = 0);
  records.forEach(r => { if (bandCounts[r.band] !== undefined) bandCounts[r.band]++; });

  const appTypeCounts = {};
  records.forEach(r => { const k = r.appType || 'Unknown'; appTypeCounts[k] = (appTypeCounts[k] || 0) + 1; });

  const statusCounts = {};
  records.forEach(r => { const k = r.status || 'Unknown'; statusCounts[k] = (statusCounts[k] || 0) + 1; });

  const housingCounts = { Yes: 0, No: 0, Unknown: 0 };
  records.forEach(r => {
    if (r.housing === 'Yes') housingCounts.Yes++;
    else if (r.housing === 'No') housingCounts.No++;
    else housingCounts.Unknown++;
  });

  const depositsPaid = records.filter(r => (r.status || '').includes('Paid')).length;

  return { total, bandCounts, appTypeCounts, statusCounts, housingCounts, depositsPaid };
}

function buildBandMarkerCluster(records) {
  const cluster = L.markerClusterGroup({
    maxClusterRadius: 50, showCoverageOnHover: false, zoomToBoundsOnClick: true,
    iconCreateFunction: function(c) {
      const count = c.getChildCount();
      let dim = 36; if (count > 100) dim = 50; else if (count > 30) dim = 42;
      const children = c.getAllChildMarkers();
      const bc = {}; children.forEach(m => { const b = m.options.bandColor || '#8b5cf6'; bc[b] = (bc[b] || 0) + 1; });
      const dominant = Object.entries(bc).sort((a, b) => b[1] - a[1])[0][0];
      return L.divIcon({
        html: `<div style="background:${dominant};color:#fff;width:${dim}px;height:${dim}px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${count > 999 ? 11 : 13}px;font-family:Inter,sans-serif;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,0.3)">${count > 999 ? Math.round(count / 100) / 10 + 'k' : count}</div>`,
        className: '', iconSize: [dim, dim], iconAnchor: [dim / 2, dim / 2]
      });
    }
  });

  const markers = [];
  records.forEach(r => {
    if (!r.lat || !r.lng) return;
    const band = getBandForDistance(r.distance);
    if (!band) return;
    markers.push(L.marker([r.lat, r.lng], { icon: createMarkerIcon(band.color), bandColor: band.color }));
  });
  cluster.addLayers(markers);
  return cluster;
}

function buildMap(containerId, records) {
  const map = L.map(containerId, { center: [ORIGIN.lat, ORIGIN.lng], zoom: 7, zoomControl: true, maxZoom: 18, minZoom: 2 });
  addBasemap(map);

  const originIcon = L.divIcon({ className: '', html: '<div style="position:relative"><div class="origin-marker"></div></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  L.marker([ORIGIN.lat, ORIGIN.lng], { icon: originIcon, zIndexOffset: 1000 }).addTo(map);

  RADIUS_MILES.forEach(miles => {
    L.circle([ORIGIN.lat, ORIGIN.lng], {
      radius: miles * MILES_TO_METERS, color: 'rgba(75,46,131,0.25)', weight: 1.5,
      fillColor: 'rgba(75,46,131,0.03)', fillOpacity: 1, dashArray: '6,4', interactive: false
    }).addTo(map);
  });

  const cluster = buildBandMarkerCluster(records);
  map.addLayer(cluster);

  const geocoded = records.filter(r => r.lat && r.lng);
  if (geocoded.length) {
    const bounds = L.latLngBounds(geocoded.map(r => [r.lat, r.lng])).extend([ORIGIN.lat, ORIGIN.lng]);
    map.fitBounds(bounds, { padding: [24, 24] });
  }
  map.invalidateSize();
  return map;
}

// Builds a map locked to one of the three report zoom tiers (Washington,
// USA, Global) — mirrors the internal admin dashboard's report maps.
const WA_BOUNDS = [[45.4, -124.9], [49.1, -116.7]];
const USA_BOUNDS = [[24.2, -125.2], [49.6, -66.5]];

function buildScopedMap(containerId, records, scope) {
  const map = L.map(containerId, { zoomControl: false, attributionControl: false });
  addBasemap(map);

  const originIcon = L.divIcon({ className: '', html: '<div style="position:relative"><div class="origin-marker"></div></div>', iconSize: [16, 16], iconAnchor: [8, 8] });
  L.marker([ORIGIN.lat, ORIGIN.lng], { icon: originIcon, zIndexOffset: 1000 }).addTo(map);

  if (scope === 'wa') {
    RADIUS_MILES.forEach(miles => {
      L.circle([ORIGIN.lat, ORIGIN.lng], {
        radius: miles * MILES_TO_METERS, color: 'rgba(75,46,131,0.25)', weight: 1.5,
        fillColor: 'rgba(75,46,131,0.03)', fillOpacity: 1, dashArray: '6,4', interactive: false
      }).addTo(map);
    });
  }

  const cluster = buildBandMarkerCluster(records);
  map.addLayer(cluster);

  if (scope === 'wa') {
    map.fitBounds(WA_BOUNDS);
  } else if (scope === 'usa') {
    map.fitBounds(USA_BOUNDS);
  } else {
    const geocoded = records.filter(r => r.lat && r.lng);
    if (geocoded.length) {
      const bounds = L.latLngBounds(geocoded.map(r => [r.lat, r.lng])).extend([ORIGIN.lat, ORIGIN.lng]);
      map.fitBounds(bounds, { padding: [40, 40] });
    } else {
      map.setView([ORIGIN.lat, ORIGIN.lng], 3);
    }
  }
  map.invalidateSize();
  return map;
}

async function captureScopedMap(records, scope) {
  const tempContainer = document.createElement('div');
  tempContainer.style.cssText = 'position:fixed;left:-9999px;top:0;width:1400px;height:900px';
  document.body.appendChild(tempContainer);

  const map = buildScopedMap(tempContainer, records, scope);
  await waitForMapTilesLoaded(map, 4500);
  await new Promise(r => setTimeout(r, 250));

  let canvas = null;
  try {
    canvas = await html2canvas(tempContainer, { useCORS: true, scale: 2, logging: false, backgroundColor: '#f1f5f9' });
  } catch (e) {
    console.warn(`Map capture failed for scope "${scope}":`, e);
  }
  map.remove();
  tempContainer.remove();
  return canvas;
}

let _waCountyLookup = null;
async function loadWaCountyLookup() {
  if (_waCountyLookup) return _waCountyLookup;
  try {
    const resp = await fetch('wa-county-lookup.json');
    _waCountyLookup = resp.ok ? await resp.json() : {};
  } catch (e) {
    console.warn('Could not load WA county lookup:', e);
    _waCountyLookup = {};
  }
  return _waCountyLookup;
}

function computeGeoAnalysis(records, countyLookup) {
  const geocoded = records.filter(r => r.lat && r.lng);
  const waRecords = geocoded.filter(r => r.state === 'WA');

  const waCountyCounts = {};
  waRecords.forEach(r => {
    const county = (countyLookup && countyLookup[r.zip]) || 'Unknown County';
    waCountyCounts[county] = (waCountyCounts[county] || 0) + 1;
  });

  const waCityCounts = {};
  waRecords.forEach(r => {
    const key = r.city || 'Unknown';
    waCityCounts[key] = (waCityCounts[key] || 0) + 1;
  });

  const stateCounts = {};
  geocoded.forEach(r => {
    const key = r.state || 'Unknown';
    stateCounts[key] = (stateCounts[key] || 0) + 1;
  });

  const cityStateMap = {};
  geocoded.forEach(r => {
    const key = `${r.city || 'Unknown'}, ${r.state || '—'}`;
    if (!cityStateMap[key]) cityStateMap[key] = { count: 0, distSum: 0 };
    cityStateMap[key].count++;
    cityStateMap[key].distSum += (r.distance || 0);
  });

  const toRanked = (obj) => Object.entries(obj).map(([label, count]) => ({ label, count })).sort((a, b) => b.count - a.count);
  const cityStateRanked = Object.entries(cityStateMap)
    .map(([label, v]) => ({ label, count: v.count, extra: `${Math.round(v.distSum / v.count)} mi` }))
    .sort((a, b) => b.count - a.count);

  const farthest = geocoded.reduce((max, r) => (r.distance != null && r.distance > max ? r.distance : max), 0);

  return {
    totalGeocoded: geocoded.length,
    waTotal: waRecords.length,
    waCountyRanked: toRanked(waCountyCounts),
    waCityRanked: toRanked(waCityCounts),
    stateRanked: toRanked(stateCounts),
    statesRepresented: Object.keys(stateCounts).length,
    cityStateRanked,
    farthestDistance: farthest
  };
}

function statRow(label, count, total, color) {
  const pct = total ? Math.round(count / total * 100) : 0;
  return `<div class="stat-row">
    <span class="lbl">${color ? `<span class="dot" style="background:${color}"></span>` : ''}${escHtml(label)}</span>
    <span class="val">${formatNum(count)} <span class="pct">(${pct}%)</span></span>

}

const RESIDENTIAL_VILLAGE_ADDRESS = '18612 Beardslee Blvd, Bothell, WA 98011';
const DISTANCE_CHART_COLORS = ['#4b2e83', '#6d4aa3', '#8b5cf6', '#38bdf8', '#22c55e'];
const RESIDENT_DISTANCE_BINS = [
  { label: '0–50 mi', min: 0, max: 50 },
  { label: '51–200 mi', min: 51, max: 200 },
  { label: '201–500 mi', min: 201, max: 500 },
  { label: '501–1,000 mi', min: 501, max: 1000 },
  { label: '1,000+ mi', min: 1001, max: Infinity }
];

const US_STATE_WHITELIST = {
  AL: 'Alabama', AK: 'Alaska', AZ: 'Arizona', AR: 'Arkansas', CA: 'California', CO: 'Colorado', CT: 'Connecticut',
  DE: 'Delaware', FL: 'Florida', GA: 'Georgia', HI: 'Hawaii', ID: 'Idaho', IL: 'Illinois', IN: 'Indiana', IA: 'Iowa',
  KS: 'Kansas', KY: 'Kentucky', LA: 'Louisiana', ME: 'Maine', MD: 'Maryland', MA: 'Massachusetts', MI: 'Michigan',
  MN: 'Minnesota', MS: 'Mississippi', MO: 'Missouri', MT: 'Montana', NE: 'Nebraska', NV: 'Nevada', NH: 'New Hampshire',
  NJ: 'New Jersey', NM: 'New Mexico', NY: 'New York', NC: 'North Carolina', ND: 'North Dakota', OH: 'Ohio',
  OK: 'Oklahoma', OR: 'Oregon', PA: 'Pennsylvania', RI: 'Rhode Island', SC: 'South Carolina', SD: 'South Dakota',
  TN: 'Tennessee', TX: 'Texas', UT: 'Utah', VT: 'Vermont', VA: 'Virginia', WA: 'Washington', WV: 'West Virginia',
  WI: 'Wisconsin', WY: 'Wyoming', DC: 'District of Columbia'
};
const US_STATE_NAME_TO_CODE = Object.fromEntries(Object.entries(US_STATE_WHITELIST).map(([code, name]) => [name.toUpperCase(), code]));
const US_COUNTRY_ALIASES = ['US', 'USA', 'U.S.', 'U.S.A.', 'UNITED STATES', 'UNITED STATES OF AMERICA'];

function normalizeUsState(raw) {
  const v = (raw || '').trim().toUpperCase();
  if (!v) return null;
  if (US_STATE_WHITELIST[v]) return v;
  if (US_STATE_NAME_TO_CODE[v]) return US_STATE_NAME_TO_CODE[v];
  return null;
}

function classifyRecordGeography(r) {
  const countryRaw = (r.country || '').trim().toUpperCase();
  const isUS = !countryRaw || US_COUNTRY_ALIASES.includes(countryRaw);
  const stateCode = normalizeUsState(r.state);
  if (!isUS) return { bucket: 'international', stateCode: null, country: cleanStrLocal(r.country) || 'Unknown Country' };
  if (stateCode) return { bucket: stateCode === 'WA' ? 'washington' : 'otherUS', stateCode, country: null };
  return { bucket: 'unknown', stateCode: null, country: null };
}
function cleanStrLocal(v) { return (v == null ? '' : String(v)).trim(); }

let _waCountyLookupClient = null;
async function loadWaCountyLookupClient() {
  if (_waCountyLookupClient) return _waCountyLookupClient;
  try {
    const resp = await fetch('wa-county-lookup.json');
    _waCountyLookupClient = resp.ok ? await resp.json() : {};
  } catch (e) { _waCountyLookupClient = {}; }
  return _waCountyLookupClient;
}

function computeResidentReportAnalytics(records, countyLookup) {
  const totalResidents = records.length;
  const geocodedRecords = records.filter(r => r.lat && r.lng);
  const mappedResidents = geocodedRecords.length;
  const geocodingPercentage = totalResidents ? Math.round(mappedResidents / totalResidents * 100) : 0;

  const classified = records.map(r => ({ r, cls: classifyRecordGeography(r) }));
  const washingtonResidents = classified.filter(x => x.cls.bucket === 'washington').length;
  const otherUSResidents = classified.filter(x => x.cls.bucket === 'otherUS').length;
  const internationalResidents = classified.filter(x => x.cls.bucket === 'international').length;
  const unknownResidents = classified.filter(x => x.cls.bucket === 'unknown').length;

  const washingtonPercentage = totalResidents ? Math.round(washingtonResidents / totalResidents * 100) : 0;
  const outOfStateResidents = totalResidents - washingtonResidents;
  const outOfStatePercentage = totalResidents ? Math.round(outOfStateResidents / totalResidents * 100) : 0;

  const geoClassified = classified.filter(x => x.r.lat && x.r.lng);
  const waGeocoded = geoClassified.filter(x => x.cls.bucket === 'washington').map(x => x.r);
  const waMappedCount = waGeocoded.length;
  const waUnmappedCount = Math.max(0, washingtonResidents - waMappedCount);

  const countyCounts = {};
  waGeocoded.forEach(r => {
    const c = (countyLookup && countyLookup[r.zip]) || 'Unknown County';
    countyCounts[c] = (countyCounts[c] || 0) + 1;
  });
  const counties = Object.entries(countyCounts)
    .map(([label, count]) => ({ label, count, pct: waMappedCount ? Math.round(count / waMappedCount * 100) : 0 }))
    .sort((a, b) => b.count - a.count);

  const waCityCounts = {};
  waGeocoded.forEach(r => { const k = r.city || 'Unknown'; waCityCounts[k] = (waCityCounts[k] || 0) + 1; });
  const waCities = Object.entries(waCityCounts)
    .map(([label, count]) => ({ label, count, pct: waMappedCount ? Math.round(count / waMappedCount * 100) : 0 }))
    .sort((a, b) => b.count - a.count);

  const nonWaStateCounts = {};
  geoClassified.forEach(x => { if (x.cls.bucket === 'otherUS') nonWaStateCounts[x.cls.stateCode] = (nonWaStateCounts[x.cls.stateCode] || 0) + 1; });
  const nonWashingtonStates = Object.entries(nonWaStateCounts)
    .map(([code, count]) => ({ label: US_STATE_WHITELIST[code], count, pct: totalResidents ? Math.round(count / totalResidents * 100) : 0 }))
    .sort((a, b) => b.count - a.count);
  const topNonWaState = nonWashingtonStates[0] || null;

  const usStatesRepresented = new Set(geoClassified.filter(x => x.cls.stateCode).map(x => x.cls.stateCode)).size;

  const countryCounts = {};
  classified.forEach(x => { if (x.cls.bucket === 'international') countryCounts[x.cls.country] = (countryCounts[x.cls.country] || 0) + 1; });
  const countries = Object.entries(countryCounts)
    .map(([label, count]) => ({ label, count, pct: internationalResidents ? Math.round(count / internationalResidents * 100) : 0 }))
    .sort((a, b) => b.count - a.count);
  const hasInternational = internationalResidents > 0;

  const cityMap = {};
  geoClassified.forEach(x => {
    const region = x.cls.bucket === 'international' ? x.cls.country
      : x.cls.stateCode ? US_STATE_WHITELIST[x.cls.stateCode]
      : (x.r.state || 'Unknown');
    const key = `${x.r.city || 'Unknown'}|${region}`;
    if (!cityMap[key]) cityMap[key] = { city: x.r.city || 'Unknown', region, count: 0, distSum: 0 };
    cityMap[key].count++;
    cityMap[key].distSum += (x.r.distance || 0);
  });
  const cities = Object.values(cityMap)
    .map(v => ({ label: `${v.city}, ${v.region}`, city: v.city, region: v.region, count: v.count, avgDistance: Math.round(v.distSum / v.count) }))
    .sort((a, b) => b.count - a.count);

  const topCounty = counties[0] || null;
  const topWaCity = waCities[0] || null;

  const regionCounts = { 'Washington': washingtonResidents, 'Other U.S.': otherUSResidents, 'International': internationalResidents };
  if (unknownResidents > 0) regionCounts['Unknown'] = unknownResidents;

  const distanceBuckets = RESIDENT_DISTANCE_BINS.map(bin => {
    const count = geocodedRecords.filter(r => r.distance != null && r.distance >= bin.min && r.distance <= bin.max).length;
    return { label: bin.label, count, pct: mappedResidents ? Math.round(count / mappedResidents * 100) : 0 };
  });

  const farthestDistance = geocodedRecords.reduce((max, r) => (r.distance != null && r.distance > max ? r.distance : max), 0);
  const farthestRecord = geocodedRecords.find(r => r.distance === farthestDistance) || null;
  const avgDistance = mappedResidents ? Math.round(geocodedRecords.reduce((s, r) => s + (r.distance || 0), 0) / mappedResidents) : 0;

  const coverageMetrics = {
    totalResidents, mappedResidents, notMapped: totalResidents - mappedResidents, geocodingPercentage,
    completeGeoValues: totalResidents - unknownResidents, internationalRecordsIdentified: internationalResidents, unknownResidents
  };

  return {
    totalResidents, mappedResidents, geocodingPercentage,
    washingtonResidents, washingtonPercentage,
    otherUSResidents, internationalResidents, unknownResidents,
    outOfStateResidents, outOfStatePercentage,
    waMappedCount, waUnmappedCount, topCounty, topWaCity, counties, waCities,
    usStatesRepresented, nonWashingtonStates, topNonWaState, countries, hasInternational,
    cities, regionCounts, distanceBuckets, farthestDistance, farthestRecord, avgDistance,
    coverageMetrics
  };
}

function generateResidentFindings(a) {
  const findings = [];
  findings.push({
    heading: 'Local Concentration',
    text: `${a.washingtonPercentage}% of all residents list Washington as their state (${formatNum(a.washingtonResidents)} of ${formatNum(a.totalResidents)}).`
  });
  if (a.topCounty) {
    findings.push({ heading: 'Largest County', text: `${a.topCounty.label} contains ${formatNum(a.topCounty.count)} mapped Washington residents (${a.topCounty.pct}% of mapped WA residents).` });
  }
  if (a.topWaCity) {
    findings.push({ heading: 'Largest City', text: `${a.topWaCity.label} is the most common mapped city with ${formatNum(a.topWaCity.count)} residents.` });

  return findings.slice(0, 4);
}

function initLoginForm() {
  const form = document.getElementById('loginForm');
  const errorEl = document.getElementById('loginError');
  const btn = document.getElementById('loginBtn');

  if (!slug) {
    errorEl.textContent = 'This link is missing or invalid. Please check the URL your contact shared with you.';
    errorEl.classList.add('show');
    form.querySelectorAll('input, button').forEach(el => el.disabled = true);
    return;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('show');
    btn.disabled = true; btn.textContent = 'Signing in…';

    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const res = await doLogin(username, password);

    btn.disabled = false; btn.textContent = 'Sign In';

    if (!res.ok) {
      errorEl.textContent = (res.body && res.body.error) || 'Invalid username or password.';
      errorEl.classList.add('show');
      return;
    }

    const data = await checkSession();
    if (data) renderDashboard(data);
    else { errorEl.textContent = 'Something went wrong. Please try again.'; errorEl.classList.add('show'); }
  });
}

function renderCompareSection(a, b) {
  const section = document.getElementById('compareSection');
  section.style.display = 'block';

  const statsA = computeStats(a.records);
  const statsB = computeStats(b.records);

  const deltaBadge = (valA, valB) => {
    const d = valB - valA;
    if (d === 0) return '<span class="d flat">±0</span>';
    const cls = d > 0 ? 'up' : 'down';
    return `<span class="d ${cls}">${d > 0 ? '+' : ''}${formatNum(d)}</span>`;
  };
  const kpiCard = (label, valA, valB) => `
    <div class="compare-kpi-card">
      <div class="ck-label">${escHtml(label)}</div>
      <div class="compare-kpi-row">
        <div class="compare-kpi-val"><div class="v" style="color:#1e40af">${formatNum(valA)}</div><div class="l">${escHtml(a.name)}</div></div>
        <div class="compare-kpi-delta">${deltaBadge(valA, valB)}<div class="l" style="font-size:9px;color:#94a3b8;font-weight:600;margin-top:2px">Δ</div></div>
        <div class="compare-kpi-val"><div class="v" style="color:#9d174d">${formatNum(valB)}</div><div class="l">${escHtml(b.name)}</div></div>
      </div>
    </div>`;
  const deltaTable = (title, countsA, countsB) => {
    const keys = [...new Set([...Object.keys(countsA), ...Object.keys(countsB)])]
      .sort((k1, k2) => ((countsB[k2] || 0) + (countsA[k2] || 0)) - ((countsB[k1] || 0) + (countsA[k1] || 0)));
    const rows = keys.map(k => {
      const va = countsA[k] || 0, vb = countsB[k] || 0, d = vb - va;
      const cls = d > 0 ? 'delta-up' : d < 0 ? 'delta-down' : 'delta-flat';
      return `<tr><td>${escHtml(k)}</td><td>${formatNum(va)}</td><td>${formatNum(vb)}</td><td class="${cls}">${d > 0 ? '+' : ''}${formatNum(d)}</td></tr>`;
    }).join('');
    return `<div class="compare-table-wrap">
      <div class="compare-table-title">${escHtml(title)}</div>
      <table class="compare-table"><thead><tr><th></th><th>${escHtml(a.name)}</th><th>${escHtml(b.name)}</th><th>Δ</th></tr></thead><tbody>${rows}</tbody></table>
    </div>`;
  };

  section.innerHTML = `
    <h2>Comparison: ${escHtml(a.name)} vs ${escHtml(b.name)}</h2>
    <div class="compare-kpi-grid">
      ${kpiCard('Total Records', statsA.total, statsB.total)}
      ${kpiCard('Deposits Paid', statsA.depositsPaid, statsB.depositsPaid)}
      ${kpiCard('Housing Interested', statsA.housingCounts.Yes, statsB.housingCounts.Yes)}
    </div>
    ${deltaTable('Distance Band Breakdown', statsA.bandCounts, statsB.bandCounts)}
    ${deltaTable('Application Type Breakdown', statsA.appTypeCounts, statsB.appTypeCounts)}
    ${deltaTable('Status Breakdown', statsA.statusCounts, statsB.statusCounts)}
    <div class="compare-maps">
      <div class="compare-map-panel"><div class="compare-map-panel-header">${escHtml(a.name)}</div><div class="compare-map-el" id="compareMapA"></div></div>
      <div class="compare-map-panel"><div class="compare-map-panel-header">${escHtml(b.name)}</div><div class="compare-map-el" id="compareMapB"></div></div>
    </div>
  `;

  setTimeout(() => {
    buildMap('compareMapA', a.records);
    buildMap('compareMapB', b.records);
  }, 50);
}

function waitForMapTilesLoaded(map, maxWait) {
  return new Promise((resolve) => {
    const layers = [];
    map.eachLayer(l => { if (l instanceof L.TileLayer) layers.push(l); });
    const stillLoading = layers.filter(l => typeof l.isLoading === 'function' && l.isLoading());
    if (!stillLoading.length) { resolve(); return; }
    let settled = false;
    const finish = () => { if (!settled) { settled = true; resolve(); } };
    let pending = stillLoading.length;
    stillLoading.forEach(l => l.once('load', () => { pending--; if (pending <= 0) finish(); }));
    setTimeout(finish, maxWait);
  });
}

// Shared chart helpers, mirroring the internal admin dashboard's report
// charting so the client-downloaded report matches the same analytical style.
let _reportChartInstances = [];
const REPORT_PALETTE = ['#4b2e83', '#8b5cf6', '#f97316', '#22c55e', '#ef4444', '#0ea5e9', '#eab308', '#ec4899', '#14b8a6', '#a3a3a3'];

function destroyReportCharts() {
  _reportChartInstances.forEach(c => { try { c.destroy(); } catch (e) {} });
  _reportChartInstances = [];
}

// Ad-hoc Chart.js plugin (registered per-chart, not globally) that draws a
// "count (pct%)" label at the end of each bar — used for the horizontal
// distance-distribution chart so small categories stay legible even when
// bars are short. Mirrors the internal admin dashboard's implementation.
const barValueLabelPlugin = {
  id: 'barValueLabels',
  afterDatasetsDraw(chart) {
    const meta = chart.getDatasetMeta(0);
    const dataset = chart.data.datasets[0];
    const horizontal = chart.options.indexAxis === 'y';
    const ctx = chart.ctx;
    ctx.save();
    ctx.font = '700 11px Inter, sans-serif';
    ctx.fillStyle = '#334155';
    ctx.textBaseline = 'middle';
    meta.data.forEach((el, i) => {
      const pos = el.tooltipPosition();
      const value = dataset.data[i];
      const pct = dataset.labelPcts ? dataset.labelPcts[i] : null;
      const text = pct != null ? `${formatNum(value)} (${pct}%)` : formatNum(value);
      if (horizontal) {
        ctx.textAlign = 'left';
        ctx.fillText(text, pos.x + 8, pos.y);
      } else {
        ctx.textAlign = 'center';
        ctx.fillText(text, pos.x, pos.y - 8);
      }
    });
    ctx.restore();
  }
};

function renderReportCharts(specs) {
  destroyReportCharts();
  specs.forEach(spec => {
    const canvas = document.getElementById(spec.canvasId);
    if (!canvas) return;
    const isBar = spec.type === 'bar';
    const horizontal = isBar && !!spec.horizontal;
    const chart = new Chart(canvas.getContext('2d'), {
      type: spec.type,
      data: {
        labels: spec.labels,
        datasets: [{
          data: spec.data,
          backgroundColor: spec.colors,
          borderWidth: isBar ? 0 : 2,
          borderColor: '#ffffff',
          borderRadius: isBar ? 5 : 0,
          labelPcts: spec.pcts || null
        }]
      },
      options: {
        indexAxis: horizontal ? 'y' : 'x',
        responsive: true,
        maintainAspectRatio: false,
        animation: false,
        layout: { padding: horizontal ? { right: 64, top: 4, bottom: 4, left: 4 } : 4 },
        plugins: {
          legend: isBar ? { display: false } : {
            position: 'right',
            labels: { boxWidth: 11, padding: 10, font: { size: 11, family: 'Inter' }, color: '#334155' }
          },
          tooltip: { enabled: false }
        },
        scales: !isBar ? undefined : (horizontal ? {
          x: { beginAtZero: true, display: false, grid: { display: false } },
          y: { grid: { display: false }, ticks: { font: { size: 11.5, family: 'Inter', weight: '600' }, color: '#334155' } }
        } : {
          x: { grid: { display: false }, ticks: { font: { size: 10, family: 'Inter' }, color: '#64748b' } },
          y: { beginAtZero: true, grid: { color: '#f1f5f9' }, ticks: { font: { size: 10, family: 'Inter' }, color: '#64748b', precision: 0 } }
        })
      },
      plugins: spec.showValueLabels ? [barValueLabelPlugin] : []
    });
    _reportChartInstances.push(chart);
  });
}

            <div id="exec-map-slot" style="width:100%;height:100%"></div>
            <div style="position:absolute;top:14px;left:16px;background:rgba(255,255,255,0.95);border-radius:8px;padding:8px 13px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
              <div style="font-size:13.5px;font-weight:800;color:#0f172a">Washington Resident Distribution</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px">${waNote} by county</div>
            </div>
            <div style="position:absolute;left:16px;bottom:14px;background:rgba(255,255,255,0.94);border-radius:8px;padding:8px 12px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.12)">
              ${BANDS.map(b => `<div style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:50%;background:${b.color};display:inline-block"></span><span style="font-size:10.5px;font-weight:600;color:#334155">${b.label}</span></div>`).join('')}
            </div>
          </div>
          <div style="flex:1.05;display:flex;flex-direction:column;gap:16px;min-width:0">
            ${residentRankedTable('Top Washington Counties', '% of mapped Washington residents', a.counties.slice(0, 8), '#4b2e83', 1.15)}
            ${residentFindingsCard(findings, 1)}
          </div>
        </div>
        <div style="display:flex;gap:16px;flex:1">
          ${residentRankedTable('Top Washington Cities', '% of mapped Washington residents', a.waCities.slice(0, 8), '#22c55e', 1)}
          ${residentOriginMixPanel(a.regionCounts, a.totalResidents, 1)}
          ${residentDistancePanel('Distance Distribution', a.distanceBuckets, `Distance measured from Residential Village, ${RESIDENTIAL_VILLAGE_ADDRESS}`, 1)}
        </div>`
    }, waMapCanvas, [
      {
        canvasId: 'chart-region', type: 'doughnut',
        labels: Object.keys(a.regionCounts).filter(k => a.regionCounts[k] > 0),
        data: Object.entries(a.regionCounts).filter(([, c]) => c > 0).map(([, c]) => c),
        colors: Object.keys(a.regionCounts).filter(k => a.regionCounts[k] > 0).map(k => ({ 'Washington': '#4b2e83', 'Other U.S.': '#8b5cf6', 'International': '#f97316', 'Unknown': '#cbd5e1' }[k]))
      },
      {
        canvasId: 'chart-distance', type: 'bar', horizontal: true, showValueLabels: true,
        labels: a.distanceBuckets.map(b => b.label),
        data: a.distanceBuckets.map(b => b.count),
        pcts: a.distanceBuckets.map(b => b.pct),
        colors: DISTANCE_CHART_COLORS
      }
    ]));

    // ── PAGE 2: National & Global Reach ──────────────────────────
    const globalMapCanvas = await captureScopedMap(records, 'global');

    const page2Kpi = [
      reportKpiCallout(formatNum(a.totalResidents), 'Total Residents', '#4b2e83'),
      reportKpiCallout(`${formatNum(a.mappedResidents)} <span style="font-size:14px;color:#94a3b8;font-weight:600">(${a.geocodingPercentage}%)</span>`, 'Total Mapped', '#22c55e'),
      reportKpiCallout(formatNum(a.usStatesRepresented), 'U.S. States Represented', '#8b5cf6'),
      reportKpiCallout(a.hasInternational ? `${formatNum(a.internationalResidents)} <span style="font-size:14px;color:#94a3b8;font-weight:600">(${Math.round(a.internationalResidents / (a.totalResidents || 1) * 100)}%)</span>` : formatNum(0), 'International Residents', '#f97316'),
      reportKpiCallout(`${formatNum(a.farthestDistance)} mi`, 'Farthest Resident Distance', '#ef4444')
    ].join('');

    const internationalTable = a.hasInternational
      ? residentRankedTable('International Representation', '% of international residents', a.countries.slice(0, 7), '#f97316', 1)
      : residentMetricsCard('International Representation', [
          { label: 'International Residents', value: formatNum(0) },
          { label: 'Countries Identified', value: formatNum(0) },
          { label: 'U.S. States Represented', value: formatNum(a.usStatesRepresented), color: '#8b5cf6' }
        ], 1);

    pageCanvases.push(await renderResidentReportPage(container, PAGE_W, PAGE_H, {
      ...shellBase, subtitleBadge: 'World View', kpiHtml: page2Kpi,
      bodyHtml: `
        <div style="display:flex;gap:16px;flex:1.55">
          <div style="flex:1.45;position:relative;background:#eef1f6;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 8px rgba(15,23,42,0.06)">
            <div id="exec-map-slot" style="width:100%;height:100%"></div>
            <div style="position:absolute;top:14px;left:16px;background:rgba(255,255,255,0.95);border-radius:8px;padding:8px 13px;box-shadow:0 2px 8px rgba(0,0,0,0.1)">
              <div style="font-size:13.5px;font-weight:800;color:#0f172a">National &amp; Global Resident Distribution</div>
              <div style="font-size:11px;color:#64748b;margin-top:2px">${formatNum(a.mappedResidents)} mapped residents across ${formatNum(a.usStatesRepresented)} state${a.usStatesRepresented === 1 ? '' : 's'}${a.hasInternational ? ` and ${formatNum(a.countries.length)} countr${a.countries.length === 1 ? 'y' : 'ies'}` : ''}</div>
            </div>
          </div>
          <div style="flex:1.05;display:flex;flex-direction:column;gap:16px;min-width:0">
            ${residentRankedTable('Top Out-of-State Markets', 'U.S. states excluding Washington · % of total', a.nonWashingtonStates.slice(0, 7), '#8b5cf6', 1)}
            ${internationalTable}
          </div>
        </div>
        <div style="display:flex;gap:16px;flex:1">
          ${residentCityTable('Top Cities Overall', a.cities.slice(0, 8), 1.1)}
          ${residentMetricsCard('Geographic Reach', [
            { label: 'U.S. States Represented', value: formatNum(a.usStatesRepresented), color: '#8b5cf6' },
            { label: 'International Countries', value: formatNum(a.countries.length), color: '#f97316' },
            { label: 'Mapped Residents', value: formatNum(a.mappedResidents), color: '#22c55e' },
            { label: 'Average Resident Distance', value: `${formatNum(a.avgDistance)} mi` },
            { label: 'Farthest Distance', value: `${formatNum(a.farthestDistance)} mi`, color: '#ef4444' }
          ], 1)}
          ${residentMetricsCard('Data Coverage & Address Quality', [
            { label: 'Total Resident Records', value: formatNum(a.coverageMetrics.totalResidents) },
            { label: 'Successfully Mapped', value: formatNum(a.coverageMetrics.mappedResidents), color: '#22c55e' },
            { label: 'Not Mapped', value: formatNum(a.coverageMetrics.notMapped), color: a.coverageMetrics.notMapped ? '#ef4444' : '#0f172a' },
            { label: 'Geocoding Coverage', value: `${a.coverageMetrics.geocodingPercentage}%`, color: '#0ea5e9' },
            { label: 'International Records Identified', value: formatNum(a.coverageMetrics.internationalRecordsIdentified), color: '#f97316' }
          ], 1)}
        </div>`
    }, globalMapCanvas, null));

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'in', format: 'letter' });
    pageCanvases.forEach((canvas, i) => {
      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 11, 8.5);
    });
    pdf.save(`${slugify(portalData.clientName)}-resident-analysis.pdf`);

    container.innerHTML = '';
  } catch (err) {
    console.error('Export error:', err);
    alert('Export failed: ' + err.message);
    destroyReportCharts();
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

async function handleExportClick() {
  if (portalData && portalData.type === 'resident') return generateResidentClientReport();
  return exportPdfReport();
}

async function exportPdfReport() {
  if (!portalData) return;
  const btn = document.getElementById('exportPdfBtn');
  const original = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = 'Generating…';

  try {
    const records = portalData.primary.records;
    const stats = computeStats(records);
    const exportDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
    const countyLookup = await loadWaCountyLookup();
    const geo = computeGeoAnalysis(records, countyLookup);

    const PAGE_W = 2112, PAGE_H = 1632;
    const container = document.getElementById('execExportCanvas');
    container.style.width = PAGE_W + 'px';

    const shellBase = {
      title: `${portalData.clientName} — Admit Radius Report`, subtitle: '', exportDate,
      totalLabel: 'Total Displayed', totalValue: formatNum(stats.total), pageW: PAGE_W, pageH: PAGE_H
    };
    const pageCanvases = [];

    // ── Page 1: Washington View ─────────────────────────────────
    const waPct = stats.total ? Math.round(geo.waTotal / stats.total * 100) : 0;
    const waMapCanvas = await captureScopedMap(records, 'wa');
    pageCanvases.push(await renderReportPage(container, PAGE_W, PAGE_H, {
      ...shellBase, pageLabel: 'Washington View',
      bodyHtml: `
        <div style="display:flex;gap:16px;flex:0 0 96px">
          ${reportKpiCallout(formatNum(geo.waTotal), 'Washington Applicants', '#4b2e83')}
          ${reportKpiCallout(`${waPct}%`, 'Share of Total', '#22c55e')}
          ${reportKpiCallout(geo.waCountyRanked[0] ? geo.waCountyRanked[0].label : '—', 'Top County', '#f97316')}
        </div>
        <div style="flex:1.6;position:relative;background:#f1f5f9;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 8px rgba(15,23,42,0.06)">
          <div id="exec-map-slot" style="width:100%;height:100%"></div>
          <div style="position:absolute;left:12px;bottom:12px;background:rgba(255,255,255,0.92);border-radius:8px;padding:7px 11px;display:flex;gap:12px;box-shadow:0 2px 8px rgba(0,0,0,0.12)">
            ${BANDS.map(b => `<div style="display:flex;align-items:center;gap:5px"><span style="width:9px;height:9px;border-radius:50%;background:${b.color};display:inline-block"></span><span style="font-size:10px;font-weight:600;color:#334155">${b.label}</span></div>`).join('')}
          </div>
        </div>
        <div style="display:flex;gap:16px;flex:1">
          ${reportRankTable('Top Washington Counties', geo.waCountyRanked.slice(0, 8))}
          ${reportRankTable('Top Washington Cities', geo.waCityRanked.slice(0, 8))}
        </div>`
    }, waMapCanvas, null));

    // ── Page 2: USA View ───────────────────────────────────────
    const usaMapCanvas = await captureScopedMap(records, 'usa');
    pageCanvases.push(await renderReportPage(container, PAGE_W, PAGE_H, {
      ...shellBase, pageLabel: 'USA View',
      bodyHtml: `
        <div style="display:flex;gap:16px;flex:0 0 96px">
          ${reportKpiCallout(formatNum(geo.totalGeocoded), 'Total Mapped', '#4b2e83')}
          ${reportKpiCallout(formatNum(geo.statesRepresented), 'States Represented', '#22c55e')}
          ${reportKpiCallout(geo.stateRanked[0] ? geo.stateRanked[0].label : '—', 'Top State', '#f97316')}
        </div>
        <div style="flex:1.6;position:relative;background:#f1f5f9;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 8px rgba(15,23,42,0.06)">
          <div id="exec-map-slot" style="width:100%;height:100%"></div>
        </div>
        <div style="display:flex;gap:16px;flex:1">
          ${reportRankTable('Top 5 States', geo.stateRanked.slice(0, 5))}
          ${reportChartPanel('Distance Breakdown — Radius Analysis', 'chart-band', 1)}
        </div>`
    }, usaMapCanvas, [{
      canvasId: 'chart-band', type: 'bar',
      labels: BANDS.map(b => b.label), data: BANDS.map(b => stats.bandCounts[b.label] || 0), colors: BANDS.map(b => b.color)
    }]));

    // ── Page 3: Global View ────────────────────────────────────
    const globalMapCanvas = await captureScopedMap(records, 'global');
    pageCanvases.push(await renderReportPage(container, PAGE_W, PAGE_H, {
      ...shellBase, pageLabel: 'Global View',
      bodyHtml: `
        <div style="display:flex;gap:16px;flex:0 0 96px">
          ${reportKpiCallout(formatNum(geo.totalGeocoded), 'Total Mapped', '#4b2e83')}
          ${reportKpiCallout(`${formatNum(geo.farthestDistance)} mi`, 'Farthest Distance', '#ef4444')}
          ${reportKpiCallout(formatNum(geo.statesRepresented), 'States / Regions', '#8b5cf6')}
        </div>
        <div style="flex:1.6;position:relative;background:#f1f5f9;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(15,23,42,0.04),0 1px 8px rgba(15,23,42,0.06)">
          <div id="exec-map-slot" style="width:100%;height:100%"></div>
        </div>
        <div style="display:flex;gap:16px;flex:1">
          ${reportRankTable('Top Cities Nationwide', geo.cityStateRanked.slice(0, 8), 'Avg Distance')}
        </div>`
    }, globalMapCanvas, null));

    // ── Page 4: Detailed Rankings ──────────────────────────────
    const housingEntries = [
      ['Interested', stats.housingCounts.Yes, '#4b2e83'],
      ['Not Interested', stats.housingCounts.No, '#cbd5e1']
    ];
    if (stats.housingCounts.Unknown) housingEntries.push(['Unknown', stats.housingCounts.Unknown, '#e2e8f0']);
    const appTypeEntries = Object.entries(stats.appTypeCounts).sort((a, b) => b[1] - a[1]);

    pageCanvases.push(await renderReportPage(container, PAGE_W, PAGE_H, {
      ...shellBase, pageLabel: 'Detailed Rankings',
      bodyHtml: `
        <div style="display:flex;gap:16px;flex:1.4">
          ${reportRankTable('Top Cities by Applicant Count', geo.cityStateRanked.slice(0, 15), 'Avg Distance')}
        </div>
        <div style="display:flex;gap:16px;flex:1">
          ${reportChartPanel('Application Type', 'chart-apptype', 1)}
          ${reportChartPanel('Campus Housing Interest', 'chart-housing', 1)}
        </div>`
    }, null, [
      {
        canvasId: 'chart-apptype', type: 'doughnut',
        labels: appTypeEntries.map(([label]) => label), data: appTypeEntries.map(([, count]) => count),
        colors: appTypeEntries.map((_, i) => REPORT_PALETTE[i % REPORT_PALETTE.length])
      },
      {
        canvasId: 'chart-housing', type: 'doughnut',
        labels: housingEntries.map(e => e[0]), data: housingEntries.map(e => e[1]), colors: housingEntries.map(e => e[2])
      }
    ]));

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'landscape', unit: 'in', format: 'letter' });
    pageCanvases.forEach((canvas, i) => {
      if (i > 0) pdf.addPage();
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, 11, 8.5);
    });
    pdf.save(`${slugify(portalData.clientName)}-admit-radius-report.pdf`);

    container.innerHTML = '';
  } catch (err) {
    console.error('Export error:', err);
    alert('Export failed: ' + err.message);
    destroyReportCharts();
  } finally {
    btn.disabled = false;
    btn.innerHTML = original;
  }
}

// ── Boot ─────────────────────────────────────────────────────────
async function boot() {
  showScreen('loadingScreen');
  initLoginForm();
  document.getElementById('logoutBtn').addEventListener('click', doLogout);
  document.getElementById('exportPdfBtn').addEventListener('click', handleExportClick);

  if (!slug) { showScreen('loginWrap'); return; }

  const data = await checkSession();
  if (data) renderDashboard(data);
  else showScreen('loginWrap');
}

boot();
})();
</script>
</body>
</html>
