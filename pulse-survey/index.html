<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ivory University House - Pulse Survey • Marketing Hub</title>
  <script src="../reslife-guard.js"></script>
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/hqv8hwr.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <div id="bootLoader" style="position:fixed;inset:0;background:#ffffff;display:flex;align-items:center;justify-content:center;z-index:100;color:#111827;font-family:Roboto,Arial,sans-serif">
    <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
      <div style="font-weight:800">Marketing Hub</div>
      <div id="bootMsg" style="color:#6b7280; font-size:12px">Loading...</div>
    </div>
  </div>

  <header class="app" id="appHeader" style="display:none">
    <div class="brand">
      <img src="../logo-main.svg" class="logo-img" alt="Capstone" />
      <div class="title">Marketing Hub</div>
    </div>
    <div class="header-controls">
      <button class="header-btn" onclick="window.location.href='../custom_tools.html'">&#8592; Back to Custom Tools</button>
      <button class="header-btn" id="logoutBtn">Sign Out</button>
    </div>
    <span class="company-name">Capstone Management Partners</span>
  </header>

  <main class="container" id="appContainer" style="display:none">
    <div class="tool-title">
      <!-- clipboard + chart icon -->
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#446472" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1"/><path d="M9 17v-3M12 17v-6M15 17v-4" stroke="#ffb732"/>
      </svg>
      <div>
        <h1>Ivory University House - Pulse Survey</h1>
        <p>Build, publish, collect, analyze and report resident pulse surveys · Salt Lake City, Utah</p>
      </div>
      <div style="margin-left:auto" class="button-group no-print">
        <button id="brandBtn" class="sm">Branding</button>
      </div>
    </div>
    <nav class="mode-toggle" id="tabs" role="tablist" aria-label="Pulse Survey sections">
      <button role="tab" data-tab="dashboard" class="active">Dashboard</button>
      <button role="tab" data-tab="builder">Survey Builder</button>
      <button role="tab" data-tab="manager">Survey Manager</button>
      <button role="tab" data-tab="responses">Responses</button>
      <button role="tab" data-tab="reports">Pulse Reports</button>
    </nav>
    <section id="view" aria-live="polite"></section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="admin.js"></script>
<script>
/* Inactivity Auto-Logout (12h) – same as other Marketing Hub tools */
(function(){var T=12*60*60*1000,K='mmp_last_activity';function u(){try{localStorage.setItem(K,Date.now().toString())}catch(e){}}function c(){try{var l=parseInt(localStorage.getItem(K)||'0',10);if(l&&(Date.now()-l)>T){localStorage.removeItem(K);fetch('/api/auth-logout',{method:'POST',credentials:'include'}).catch(function(){});window.location.href='../index.html';}}catch(e){}}u();['mousedown','keydown','scroll','touchstart'].forEach(function(e){document.addEventListener(e,u,{passive:true})});setInterval(c,60000);c()})();
</script>
</body>
</html>
