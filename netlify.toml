[build]
  command = "cd email-shop && npm install && npm run build && cd ../mplr-app && npm install && npm run build"
  functions = "netlify/functions"
  publish = "."

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongodb", "bcryptjs", "jsonwebtoken", "jspdf", "jszip"]

# Security headers (CSP) to allow required external assets
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; img-src 'self' data: blob: https:; connect-src 'self' https://cmpmarketinghub.netlify.app https://unpkg.com; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://unpkg.com https://cdn.sheetjs.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://use.typekit.net https://p.typekit.net https://cdn.jsdelivr.net https://unpkg.com; font-src 'self' https://fonts.gstatic.com https://use.typekit.net https://p.typekit.net data:; frame-src 'self' blob: https://drive.google.com https://www.youtube.com https://youtube.com https://www.loom.com https://player.vimeo.com; media-src 'self' https: blob: data:;"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "0"

# Conduct Meeting Notes: controlled official Word template (harbour-occ-ram-v1)
[functions."reslife-conduct"]
  included_files = ["netlify/functions/templates/**"]

[functions."leasing-staff-reminders"]
  schedule = "0 13 * * 1"

[functions."reslife-schedule-reminders"]
  schedule = "*/15 * * * *"

[functions."reslife-duty-log-autosubmit"]
  schedule = "*/5 * * * *"

# Ivory University House Pulse Survey – permanent public survey links
# /survey/<publicId> is served by the static public survey page (rewrite, URL unchanged)
[[redirects]]
  from = "/survey/*"
  to = "/pulse-survey/public.html"
  status = 200

# Updated MMP calendar was renamed from calendar_test.html; keep old links/bookmarks working
[[redirects]]
  from = "/calendar_test.html"
  to = "/marketing_calendar.html"
  status = 301

# The 30-60-90 plan page replaced marketing_plans.html; keep old test links working
[[redirects]]
  from = "/marketing_plans_test.html"
  to = "/marketing_plans.html"
  status = 301

# Redirect API routes to functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
