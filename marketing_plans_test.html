<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>30-60-90 Day Marketing Plan (Test) • Marketing Hub</title>
  <link rel="stylesheet" href="https://use.typekit.net/hqv8hwr.css">
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{--brand:#446472;--accent:#ffb732;--accent2:#52d5ff;--bg:#f8fafc;--text:#1e293b;--sub:#64748b;--border:#e2e8f0;--ok:#16a34a;--risk:#d97706;--off:#dc2626}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}
    .hidden{display:none!important}
    /* Header matches the classic page; standard-nav.js supplies the shared header styles */
    header{padding:12px 24px;border-bottom:1px solid var(--border);background:#fff;position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
    .brand{display:flex;align-items:center;gap:10px}
    .brand .logo-img{height:28px;width:auto}
    .brand .title{color:#ffb732;font-family:zooja-pro,Arial,sans-serif;font-size:clamp(32px,4vw,48px);line-height:1}
    .header-controls{display:flex;align-items:center;gap:12px;margin-left:auto}
    .header-controls select{width:auto;min-width:200px;padding:8px 12px;border-radius:6px}
    .header-btn{background:#fff;border:1px solid var(--border);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text);cursor:pointer;white-space:nowrap}
    .header-btn:hover{background:#f8fafc;border-color:#cbd5e1}
    .company-name{font-size:12px;color:var(--sub);font-weight:500}
    .planbar{display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
    .test-pill{background:#fff7e6;border:1px solid var(--accent);color:#92400e;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:.5px}
    .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;color:var(--text);font-weight:600;cursor:pointer;font-size:13px;text-decoration:none;font-family:inherit}
    .btn:hover{background:#f1f5f9}
    .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
    .btn.primary:hover{background:#36525e}
    .btn.accent{background:var(--accent2);border-color:var(--accent2);color:#0b1b24}
    .btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
    .btn.sm{padding:4px 10px;font-size:12px}
    .btn.danger{color:var(--off)}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    input,select,textarea{width:100%;padding:8px 10px;border-radius:7px;border:1px solid #d1d5db;font-size:13px;font-family:inherit;background:#fff;color:var(--text)}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent2);box-shadow:0 0 0 3px rgba(82,213,255,.15)}
    textarea{min-height:64px;resize:vertical}
    label{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px}
    .wrap{max-width:1400px;margin:0 auto;padding:20px 24px;min-width:0}
    #main,.card,.card .body{min-width:0}
    .main-content{overflow-x:hidden}
    .tscroll{overflow-x:auto;max-width:100%}
    .card{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:18px;overflow:hidden}
    .card>h3{padding:14px 18px;font-size:15px;font-family:Roboto,Arial,sans-serif;border-bottom:1px solid var(--border);background:#f8fafc;display:flex;align-items:center;gap:10px}
    .card>h3 .sub{font-weight:400;font-size:12px;color:var(--sub);margin-left:auto}
    .card .body{padding:16px 18px}
    .step{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    @media(max-width:800px){.grid2,.grid3,.grid4{grid-template-columns:1fr}}
    .hint{font-size:12px;color:var(--sub);margin-top:4px}
    /* list */
    .side{position:sticky;top:90px}
    .plan-item{padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}
    .plan-item:hover{background:#f8fafc}
    .plan-item.active{background:#eff6ff;border-left:3px solid var(--accent2)}
    .plan-item .n{font-weight:600}
    .plan-item .m{font-size:12px;color:var(--sub)}
    /* status */
    .pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
    .pill.ok{background:#dcfce7;color:#166534}.pill.risk{background:#fef3c7;color:#92400e}.pill.off{background:#fee2e2;color:#991b1b}.pill.na{background:#f1f5f9;color:#64748b}
    .pill.done{background:#dcfce7;color:#166534}.pill.prog{background:#dbeafe;color:#1e40af}.pill.blocked{background:#fee2e2;color:#991b1b}
    /* health strip */
    .health{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    @media(max-width:900px){.health{grid-template-columns:repeat(2,1fr)}}
    .hcard{border:1px solid var(--border);border-radius:10px;padding:12px 14px;background:#fff}
    .hcard .k{font-size:11px;font-weight:700;color:var(--sub);text-transform:uppercase}
    .hcard .v{font-size:22px;font-weight:700;color:var(--brand)}
    .hcard .s{font-size:12px;color:var(--sub)}
    .bar{height:6px;background:#e5e7eb;border-radius:3px;overflow:hidden;margin-top:6px}
    .bar>i{display:block;height:100%;background:var(--accent2)}
    .timeline{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:14px}
    .timeline div{padding:8px 10px;border-radius:6px;background:#f1f5f9;font-size:12px;font-weight:600;color:var(--sub)}
    .timeline div.now{background:var(--brand);color:#fff}
    .timeline div.past{background:#e0f2fe;color:#0c4a6e}
    /* tables */
    table{width:100%;border-collapse:collapse}
    th{text-align:left;font-size:11px;text-transform:uppercase;color:var(--sub);font-weight:700;padding:8px 6px;border-bottom:2px solid var(--border);background:#f8fafc;white-space:nowrap}
    td{padding:6px;border-bottom:1px solid var(--border);vertical-align:top}
    td input,td select{padding:6px 8px;font-size:13px}
    td.num input{text-align:right;width:72px;padding:6px}
    .mcfg{display:flex;gap:4px;margin-top:4px}
    .mcfg select{padding:3px 4px;font-size:11px;color:var(--sub);width:auto}
    .phase-tabs .phase-tab{flex:1;min-width:180px;text-align:left}
    .grp{text-align:center;background:#eef6f9;color:var(--brand)}
    .auto{display:inline-block;padding:6px 8px;font-weight:700;color:var(--brand);background:#f0f9ff;border-radius:6px;min-width:56px;text-align:right}
    .auto small{font-weight:400;color:var(--sub);font-size:10px;display:block;text-align:right}
    /* phases */
    .phase-tabs{display:flex;gap:6px;padding:12px 18px;border-bottom:1px solid var(--border);background:#f8fafc;flex-wrap:wrap}
    .phase-tab{padding:8px 14px;border-radius:8px;border:1px solid var(--border);background:#fff;cursor:pointer;font-weight:600;font-size:13px}
    .phase-tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}
    .exit-row{display:flex;gap:8px;align-items:center;margin-bottom:6px}
    .exit-row input[type=checkbox]{width:18px;height:18px;flex:none}
    .funnel{display:flex;gap:6px;align-items:stretch;flex-wrap:wrap}
    .fstage{flex:1;min-width:110px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;padding:10px;text-align:center}
    .fstage .v{font-size:20px;font-weight:700;color:var(--brand)}
    .fconv{align-self:center;font-size:12px;font-weight:700;color:var(--sub);text-align:center;min-width:60px}
    .savebar{display:flex;align-items:center;gap:10px}
    .dirty{font-size:12px;color:var(--risk);font-weight:600}
    .empty{text-align:center;padding:60px 20px;color:var(--sub)}
    #toast{position:fixed;bottom:20px;right:20px;background:#1e293b;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:100;display:none}
    /* ===== Report (export) ===== */
    #report{display:none;background:#fff;max-width:1000px;margin:20px auto;padding:36px 40px;border:1px solid var(--border);border-radius:12px;font-size:12.5px}
    #report h1{font-family:Roboto,Arial,sans-serif;font-size:22px;color:var(--brand)}
    #report h2{font-family:Roboto,Arial,sans-serif;font-size:14px;color:var(--brand);text-transform:uppercase;letter-spacing:.5px;border-bottom:2px solid var(--accent);padding-bottom:4px;margin:20px 0 10px}
    #report h4{font-size:13px;margin:10px 0 4px}
    #report .meta{color:var(--sub);font-size:12px}
    #report table{font-size:11.5px}
    #report th,#report td{padding:5px 6px}
    #report .callout{background:#f8fafc;border-left:4px solid var(--brand);padding:10px 14px;border-radius:4px;margin-bottom:8px}
    #report .two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    #report ul{margin-left:18px}
    .pagebreak{break-before:page}
    body.preview #app{display:none}
    body.preview #report{display:block}
    @media print{
      @page{size:letter;margin:0.5in}
      body{background:#fff}
      header,#sidebarNav,#navToggle,#app,#boot,#toast{display:none!important}
      .main-content{margin-left:0!important}
      #report{display:block!important;border:none;margin:0;padding:0;max-width:none}
      .no-print{display:none!important}
      tr,.callout{break-inside:avoid}
      .pill{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    }
  </style>
</head>
<body>
  <header id="appHeader" class="hidden">
    <div class="brand">
      <img src="logo-main.svg" class="logo-img" alt="Capstone" />
      <div class="title">Marketing Hub</div>
    </div>
    <div class="header-controls">
      <span class="test-pill">30-60-90 Test</span>
      <select id="propertySelect"></select>
      <a href="marketing_plans.html" class="header-btn" style="text-decoration:none" title="Back to the current marketing plan page">&larr; Classic Plans</a>
    </div>
    <span class="company-name">Capstone Management Partners</span>
  </header>

  <div id="boot" class="empty">Loading…</div>

  <div id="app" class="hidden">
    <div class="wrap">
      <div class="card"><div class="body planbar">
        <div style="flex:1;min-width:220px;max-width:460px"><label>30-60-90 plans for this property (<span id="planCount">0</span>)</label><select id="planSelect"></select></div>
        <button class="btn primary" id="newPlanBtn">+ New 30-60-90 Plan</button>
        <div class="hint" style="flex:2;min-width:240px;margin:0"><b>How it works:</b> write the brief → set Day 30/60/90 targets → plan initiatives by phase → log the weekly pulse every Monday → export the HQ report.</div>
      </div></div>
      <main id="main"><div class="empty">Select a plan or create a new one.</div></main>
    </div>
  </div>

  <div id="report"></div>
  <div id="toast"></div>

  <script>
  // ======================= STATE =======================
  let me = null, properties = [], currentProperty = '', plans = [], plan = null, dirty = false, phaseTab = 0;
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const rid = () => 'r' + Math.random().toString(36).slice(2, 10);
  const num = v => (v === '' || v == null || isNaN(+v)) ? null : +v;
  const iso = d => { const z = new Date(d); return new Date(z.getTime() - z.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
  const fmtDate = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : '—';
  const fmtShort = s => s ? new Date(s + 'T00:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';
  const money = v => v == null ? '—' : '$' + Math.round(v).toLocaleString();
  function toast(m) { const t = $('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 2600); }

  async function api(path, opts = {}) {
    const res = await fetch('/api' + path, { ...opts, headers: { 'Content-Type': 'application/json' }, credentials: 'include' });
    if (!res.ok) {
      const text = await res.text(); let msg = text;
      try { const j = JSON.parse(text); msg = j.message || j.detail || j.error || text; } catch (e) { }
      if (res.status === 401) msg = 'Your session expired. Please log in again.';
      throw new Error(msg || 'HTTP ' + res.status);
    }
    return res.json();
  }

  // ======================= MODEL =======================
  const PHASES = [
    { d0: 1, d1: 30, label: 'Days 1–30', name: 'Foundation' },
    { d0: 31, d1: 60, label: 'Days 31–60', name: 'Momentum' },
    { d0: 61, d1: 90, label: 'Days 61–90', name: 'Close' },
  ];
  const CPS = [30, 60, 90];
  const WEEKS = 13;
  const SOURCES = { '': 'Manual entry', leads: 'Weekly pulse: Leads', tours: 'Weekly pulse: Tours', apps: 'Weekly pulse: Applications', leases: 'Weekly pulse: Leases', prelease: 'Weekly pulse: Pre-lease %', conv_lt: 'Calc: Tours ÷ Leads', conv_tl: 'Calc: Leases ÷ Tours', cost_lease: 'Calc: Spend ÷ Leases' };
  const STATUSES = { not_started: 'Not started', in_progress: 'In progress', done: 'Done', blocked: 'Blocked' };
  const CHANNELS = ['Leasing / Sales', 'Digital / Paid', 'Social', 'Website / ILS', 'Campus Outreach', 'Events', 'Resident / Referral', 'Reputation / Reviews', 'Email / SMS', 'Pricing / Specials', 'Other'];

  function defaultNinety() {
    const m = (name, unit, dir, src, why) => ({ id: rid(), name, unit, dir, src, why, baseline: null, t30: null, t60: null, t90: null, a30: null, a60: null, a90: null });
    const i = (title, channel, metric) => ({ id: rid(), title, channel, owner: '', due: '', budget: null, spent: null, metric, status: 'not_started' });
    return {
      owner: '', preparedBy: me?.username || '', reviewer: '', approvalStatus: 'draft', approvedBudget: null,
      summary: { situation: '', objective: '', strategy: '', priorities: ['', '', ''], audience: '', special: '', hqAsk: '' },
      metrics: [
        m('Pre-lease / Occupancy', '%', 'up', 'prelease', 'Primary outcome'),
        m('Leases signed (cumulative)', '#', 'up', 'leases', 'Primary outcome'),
        m('Leads (cumulative)', '#', 'up', 'leads', 'Top of funnel'),
        m('Tours (cumulative)', '#', 'up', 'tours', 'Mid funnel'),
        m('Applications (cumulative)', '#', 'up', 'apps', 'Bottom funnel'),
        m('Lead → Tour conversion', '%', 'up', 'conv_lt', 'Leasing effectiveness'),
        m('Tour → Lease conversion', '%', 'up', 'conv_tl', 'Closing effectiveness'),
        m('Avg. lead response time', 'hrs', 'down', '', 'Speed to lead'),
        m('Google rating', '★', 'up', '', 'Reputation'),
        m('Marketing cost per lease', '$', 'down', 'cost_lease', 'Efficiency'),
      ],
      phases: [
        { theme: 'Diagnose & fix the funnel', objective: 'Every lead is answered fast, every listing is accurate, and core campaigns are live.', exit: [{ text: 'Avg lead response under 2 hrs', done: false }, { text: 'Website, ILS, Google profile updated (photos, pricing, special)', done: false }, { text: 'Referral program launched', done: false }],
          initiatives: [i('Audit website, ILS listings & Google Business Profile', 'Website / ILS', 'All listings current'), i('Mystery shop leasing team; set 1-hr response standard', 'Leasing / Sales', 'Response time'), i('Launch resident referral program', 'Resident / Referral', 'Referral leases'), i('Publish 4-week social content calendar (3 posts/wk)', 'Social', 'Engagement / leads'), i('Build campus partner & outreach target list', 'Campus Outreach', '# partners contacted')],
          retro: { worked: '', didnt: '', adjust: '' } },
        { theme: 'Drive traffic & tours', objective: 'Grow qualified leads and convert them into booked tours.', exit: [{ text: 'Lead → Tour conversion at or above target', done: false }, { text: '2+ campus / community events completed', done: false }],
          initiatives: [i('Campus tabling / event activations', 'Events', 'Leads captured'), i('Paid social + retargeting campaign', 'Digital / Paid', 'Cost per lead'), i('Refresh tour route & model unit experience', 'Leasing / Sales', 'Tour → Lease %'), i('Student ambassador / influencer content', 'Social', 'Leads')],
          retro: { worked: '', didnt: '', adjust: '' } },
        { theme: 'Convert & close', objective: 'Create urgency and close outstanding prospects to hit the Day 90 lease target.', exit: [{ text: 'Day 90 lease target achieved', done: false }, { text: 'All open applications followed up', done: false }],
          initiatives: [i('Deadline-driven special / urgency campaign', 'Pricing / Specials', 'Leases signed'), i('Follow-up blitz: toured-not-signed & open apps', 'Leasing / Sales', 'Apps → leases'), i('Review generation push after move-in/signing', 'Reputation / Reviews', 'Google rating')],
          retro: { worked: '', didnt: '', adjust: '' } },
      ],
      pulse: Array.from({ length: WEEKS }, () => ({ leads: null, tours: null, apps: null, leases: null, prelease: null, notes: '' })),
      risks: [{ id: rid(), risk: 'Competitor launches aggressive concession', likelihood: 'Medium', impact: 'High', mitigation: 'Pre-approve counter-special with RM; monitor comps weekly', owner: '' }],
    };
  }

  // ======================= CALCULATIONS =======================
  const cpWeeks = cp => Math.floor(cp / 7); // weeks fully inside the window: D30→4, D60→8, D90→12(+wk13 partial)
  function pulseCount(c) { return c === 90 ? WEEKS : cpWeeks(c); }
  function pulseSum(key, c) {
    const rows = plan.ninety.pulse.slice(0, pulseCount(c)); let any = false, s = 0;
    rows.forEach(r => { if (r[key] != null) { any = true; s += +r[key]; } });
    return any ? s : null;
  }
  function pulseLast(key, c) { const rows = plan.ninety.pulse.slice(0, pulseCount(c)); for (let i = rows.length - 1; i >= 0; i--) if (rows[i][key] != null) return +rows[i][key]; return null; }
  function spendTo(c) {
    let s = 0, any = false;
    plan.ninety.phases.forEach((p, i) => { if (PHASES[i].d1 <= c) p.initiatives.forEach(x => { if (x.spent != null) { s += +x.spent; any = true; } }); });
    return any ? s : null;
  }
  function autoActual(m, c) {
    switch (m.src) {
      case 'leads': case 'tours': case 'apps': case 'leases': return pulseSum(m.src, c);
      case 'prelease': return pulseLast('prelease', c);
      case 'conv_lt': { const l = pulseSum('leads', c), t = pulseSum('tours', c); return l && t != null ? +(t / l * 100).toFixed(1) : null; }
      case 'conv_tl': { const t = pulseSum('tours', c), l = pulseSum('leases', c); return t && l != null ? +(l / t * 100).toFixed(1) : null; }
      case 'cost_lease': { const s = spendTo(c), l = pulseSum('leases', c); return s != null && l ? Math.round(s / l) : null; }
    }
    return null;
  }
  function actual(m, c) { const a = autoActual(m, c); return a != null ? a : num(m['a' + c]); }
  // A checkpoint is judged only once it's reached (by calendar or by weekly pulse coverage).
  function reached(c) {
    const weeksLogged = plan.ninety.pulse.reduce((n, r, i) => ['leads', 'tours', 'apps', 'leases', 'prelease'].some(k => r[k] != null) ? i + 1 : n, 0);
    return dayOfPlan() >= c || weeksLogged >= pulseCount(c);
  }
  function score(m, c) {
    const a = actual(m, c), t = num(m['t' + c]);
    if (a == null || t == null) return null;
    if (!reached(c)) return 'prog';
    const pct = m.dir === 'down' ? (a === 0 ? 1 : t / a) : (t === 0 ? 1 : a / t);
    return pct >= 0.95 ? 'ok' : pct >= 0.8 ? 'risk' : 'off';
  }
  const LABEL = { ok: 'On track', risk: 'At risk', off: 'Off track', na: 'No data', prog: 'In progress' };
  const pill = s => `<span class="pill ${s || 'na'}">${LABEL[s || 'na']}</span>`;
  function latestScore(m) { for (const c of [90, 60, 30]) { const s = score(m, c); if (s && s !== 'prog') return { c, s }; } return null; }
  function overall() {
    const ss = plan.ninety.metrics.map(latestScore).filter(Boolean).map(x => x.s);
    // Lease pace toward the Day 90 goal counts as a signal even before a checkpoint is reached.
    const pr = projection();
    if (pr && pr.target) { const r = pr.projected / pr.target; ss.push(r >= .95 ? 'ok' : r >= .8 ? 'risk' : 'off'); }
    if (!ss.length) return 'na';
    const off = ss.filter(s => s === 'off').length, risk = ss.filter(s => s === 'risk').length;
    return off >= 2 || off / ss.length > .25 ? 'off' : (off || risk) ? 'risk' : 'ok';
  }
  function dayOfPlan() {
    if (!plan.startDate) return 0;
    const d = Math.floor((new Date(iso(new Date()) + 'T00:00:00') - new Date(plan.startDate + 'T00:00:00')) / 86400000) + 1;
    return Math.max(0, Math.min(91, d));
  }
  function initiativeStats(list) { const n = list.length, done = list.filter(x => x.status === 'done').length, blocked = list.filter(x => x.status === 'blocked').length; return { n, done, blocked, pct: n ? Math.round(done / n * 100) : 0 }; }
  function allInitiatives() { return plan.ninety.phases.flatMap(p => p.initiatives); }
  function leaseMetric() { return plan.ninety.metrics.find(m => m.src === 'leases'); }
  function projection() {
    const lm = leaseMetric(); if (!lm) return null;
    const weeksLogged = plan.ninety.pulse.reduce((n, r, i) => r.leases != null ? i + 1 : n, 0);
    if (!weeksLogged) return null;
    const cum = pulseSum('leases', 90);
    return { cum, weeksLogged, projected: Math.round(cum / weeksLogged * WEEKS), target: num(lm.t90), needPerWeek: num(lm.t90) != null && weeksLogged < WEEKS ? Math.max(0, (num(lm.t90) - cum) / (WEEKS - weeksLogged)) : null };
  }

  // ======================= AUTH / INIT =======================
  function userCanAccess(p) {
    if (!me || me.role === 'admin') return true;
    const raw = me.properties;
    const list = Array.isArray(raw) ? raw.map(String) : (typeof raw === 'string' ? raw.split(',').map(s => s.trim()).filter(Boolean) : []);
    if (list.includes('*')) return true;
    const n = s => String(s || '').trim().toLowerCase(), slug = s => n(s).replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    return list.some(x => n(x) === n(p.name) || n(x) === n(p.id) || slug(x) === slug(p.name));
  }

  async function init() {
    try { const r = await fetch('/api/me', { credentials: 'include' }); if (!r.ok) throw 0; me = await r.json(); }
    catch (e) { location.href = 'marketing_plans.html'; return; }
    try { const list = await (await fetch('/api/properties', { credentials: 'include' })).json(); properties = (list || []).filter(userCanAccess).map(x => x.name).filter(Boolean); } catch (e) { properties = []; }
    $('propertySelect').innerHTML = properties.map(p => `<option>${esc(p)}</option>`).join('') || '<option value="">No properties assigned</option>';
    $('propertySelect').onchange = () => { if (dirty && !confirm('Discard unsaved changes?')) { $('propertySelect').value = currentProperty; return; } setProperty($('propertySelect').value); };
    $('newPlanBtn').onclick = newPlan;
    $('boot').classList.add('hidden'); $('appHeader').classList.remove('hidden'); $('app').classList.remove('hidden');
    if (properties.length) await setProperty(properties[0]);
  }

  async function setProperty(p) { currentProperty = p; plan = null; dirty = false; await loadList(); renderMain(); }
  async function loadList() {
    try { plans = await api(`/marketing-plans?property=${encodeURIComponent(currentProperty)}&planType=30_60_90`); } catch (e) { plans = []; toast('Could not load plans: ' + e.message); }
    renderList();
  }
  function renderList() {
    $('planCount').textContent = plans.length;
    const s = $('planSelect');
    s.innerHTML = `<option value="">${plans.length ? '— Select a plan —' : 'No plans yet — create one'}</option>` + (plan && !plan.id ? '<option value="__new" selected>(New unsaved plan)</option>' : '') +
      plans.map(p => `<option value="${p.id}" ${plan && plan.id === p.id ? 'selected' : ''}>${esc(p.name)} · ${fmtShort(p.startDate)} – ${fmtDate(p.endDate)}</option>`).join('');
    s.onchange = () => { if (s.value && s.value !== '__new') openPlan(s.value); };
  }
  async function openPlan(id) {
    if (dirty && !confirm('Discard unsaved changes?')) { renderList(); return; }
    try {
      const d = await api(`/marketing-plans?id=${encodeURIComponent(id)}`);
      const base = defaultNinety();
      d.ninety = Object.assign(base, d.ninety || {});
      d.ninety.summary = Object.assign(base.summary, (d.ninety || {}).summary || {});
      while (d.ninety.pulse.length < WEEKS) d.ninety.pulse.push({ leads: null, tours: null, apps: null, leases: null, prelease: null, notes: '' });
      plan = d; dirty = false; phaseTab = 0; renderList(); renderMain();
    } catch (e) { alert('Failed to load plan: ' + e.message); }
  }
  function newPlan() {
    if (!currentProperty) { alert('Select a property first.'); return; }
    if (dirty && !confirm('Discard unsaved changes?')) return;
    const start = iso(new Date());
    plan = { id: null, property: currentProperty, name: `${currentProperty} 30-60-90 Plan`, termLabel: '', startDate: start, endDate: addDays(start, 89), planType: '30_60_90', ninety: defaultNinety() };
    dirty = true; phaseTab = 0; renderList(); renderMain();
  }

  // ======================= SAVE / DELETE =======================
  async function save() {
    if (!plan.name.trim()) { alert('Plan name is required.'); return; }
    if (!plan.startDate) { alert('Start date is required.'); return; }
    plan.endDate = addDays(plan.startDate, 89);
    const lm = leaseMetric();
    const body = { property: currentProperty, name: plan.name, termLabel: plan.termLabel, planType: '30_60_90', startDate: plan.startDate, endDate: plan.endDate,
      leasesGoal: lm ? num(lm.t90) : null, primaryGoals: plan.ninety.summary.objective, targetAudiences: plan.ninety.summary.audience, currentSpecial: plan.ninety.summary.special, ninety: plan.ninety };
    const btn = $('saveBtn'); if (btn) { btn.disabled = true; btn.textContent = 'Saving…'; }
    try {
      if (plan.id) await api('/marketing-plans', { method: 'PUT', body: JSON.stringify({ id: plan.id, ...body }) });
      else { const r = await api('/marketing-plans', { method: 'POST', body: JSON.stringify(body) }); plan.id = r.id; }
      dirty = false; toast('Plan saved'); await loadList(); renderMain();
    } catch (e) { alert('Failed to save: ' + e.message); if (btn) { btn.disabled = false; btn.textContent = 'Save plan'; } }
  }
  async function del() {
    if (!plan.id || !confirm('Delete this plan permanently?')) return;
    try { await api('/marketing-plans', { method: 'DELETE', body: JSON.stringify({ id: plan.id }) }); plan = null; dirty = false; await loadList(); renderMain(); toast('Plan deleted'); }
    catch (e) { alert('Failed to delete: ' + e.message); }
  }
  window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  // ======================= BINDING =======================
  // Inputs use data-k="path.to.field" (relative to plan); data-num marks numeric.
  function setPath(obj, path, val) { const ks = path.split('.'); let o = obj; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
  function getPath(obj, path) { return path.split('.').reduce((o, k) => o == null ? o : o[k], obj); }
  function inp(path, { type = 'text', numeric = false, ph = '', attrs = '' } = {}) {
    const v = getPath(plan, path);
    return `<input type="${type}" data-k="${path}" ${numeric ? 'data-num step="any"' : ''} value="${esc(v ?? '')}" placeholder="${esc(ph)}" ${attrs}>`;
  }
  function area(path, ph = '', rows = 3) { return `<textarea data-k="${path}" rows="${rows}" placeholder="${esc(ph)}">${esc(getPath(plan, path) ?? '')}</textarea>`; }
  function sel(path, opts, rerender = true) {
    const v = getPath(plan, path);
    return `<select data-k="${path}" ${rerender ? 'data-rr' : ''}>${Object.entries(opts).map(([k, l]) => `<option value="${esc(k)}" ${String(v) === k ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select>`;
  }
  function onEdit(e) {
    const el = e.target; const k = el.dataset && el.dataset.k; if (!k || !plan) return;
    let v = el.type === 'checkbox' ? el.checked : el.value;
    if (el.dataset.num !== undefined) v = num(v);
    setPath(plan, k, v); markDirty();
    if (k === 'startDate' && v) plan.endDate = addDays(v, 89);
    if (el.dataset.rr !== undefined || el.type === 'checkbox' || k === 'startDate') { if (e.type === 'change') renderMain(); }
    else renderDerived();
  }
  document.addEventListener('input', onEdit);
  document.addEventListener('change', e => { if (e.target.dataset && (e.target.dataset.rr !== undefined || e.target.type === 'checkbox' || e.target.dataset.k === 'startDate')) onEdit(e); });
  function markDirty() { dirty = true; const d = $('dirtyFlag'); if (d) d.textContent = '● Unsaved changes'; }

  // Actions via data-act
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if (!b || !plan) return;
    const n = plan.ninety, a = b.dataset.act, i = +b.dataset.i, j = +b.dataset.j;
    const acts = {
      save, del, report: () => openReport(false), print: () => openReport(true), csv: exportCsv,
      phase: () => { phaseTab = i; },
      addMetric: () => n.metrics.push({ id: rid(), name: '', unit: '#', dir: 'up', src: '', why: '', baseline: null, t30: null, t60: null, t90: null, a30: null, a60: null, a90: null }),
      delMetric: () => n.metrics.splice(i, 1),
      addInit: () => n.phases[i].initiatives.push({ id: rid(), title: '', channel: CHANNELS[0], owner: '', due: '', budget: null, spent: null, metric: '', status: 'not_started' }),
      delInit: () => n.phases[i].initiatives.splice(j, 1),
      addExit: () => n.phases[i].exit.push({ text: '', done: false }),
      delExit: () => n.phases[i].exit.splice(j, 1),
      addRisk: () => n.risks.push({ id: rid(), risk: '', likelihood: 'Medium', impact: 'Medium', mitigation: '', owner: '' }),
      delRisk: () => n.risks.splice(i, 1),
    };
    if (!acts[a]) return;
    acts[a]();
    if (!['save', 'del', 'report', 'print', 'csv', 'phase'].includes(a)) markDirty();
    if (!['save', 'del', 'report', 'print', 'csv'].includes(a)) renderMain();
  });

      <div class="hcard"><div class="k">Plan day</div><div class="v">${d < 1 ? 'Not started' : d > 90 ? 'Complete' : d + ' / 90'}</div><div class="bar"><i style="width:${Math.min(100, d / 90 * 100)}%"></i></div></div>
      <div class="hcard"><div class="k">Leases to date</div><div class="v">${pr ? pr.cum : '—'}${pr && pr.target != null ? `<span style="font-size:14px;color:var(--sub)"> / ${pr.target}</span>` : ''}</div><div class="s">${pr && pr.target ? Math.round(pr.cum / pr.target * 100) + '% of Day 90 goal' : 'Log weekly pulse'}</div></div>
      <div class="hcard"><div class="k">Projected Day 90</div><div class="v" style="color:${pr && pr.target != null ? (pr.projected >= pr.target ? 'var(--ok)' : 'var(--off)') : 'var(--brand)'}">${pr ? pr.projected : '—'}</div><div class="s">${pr && pr.needPerWeek != null ? `Need ${pr.needPerWeek.toFixed(1)}/wk to hit goal` : 'At current pace'}</div></div>
      <div class="hcard"><div class="k">Initiatives done</div><div class="v">${inits.done}/${inits.n}</div><div class="bar"><i style="width:${inits.pct}%"></i></div><div class="s">${inits.blocked ? inits.blocked + ' blocked' : ''}</div></div>
    </div>
    <div class="timeline">${PHASES.map((p, i) => `<div class="${i === cur ? 'now' : i < cur ? 'past' : ''}">${p.label}: ${esc(plan.ninety.phases[i].theme || p.name)}</div>`).join('')}</div>`;
  }

  function funnelHtml() {
    const L = pulseSum('leads', 90), T = pulseSum('tours', 90), A = pulseSum('apps', 90), S = pulseSum('leases', 90);
    const pct = (a, b) => a && b != null ? Math.round(b / a * 100) + '%' : '—';
    const st = (k, v) => `<div class="fstage"><div class="v">${v ?? '—'}</div><div class="hint" style="margin:0">${k}</div></div>`;
    return `<div class="funnel">${st('Leads', L)}<div class="fconv">→<br>${pct(L, T)}</div>${st('Tours', T)}<div class="fconv">→<br>${pct(T, A)}</div>${st('Apps', A)}<div class="fconv">→<br>${pct(A, S)}</div>${st('Leases', S)}</div>
      <div class="hint">Lead → Lease overall: <b>${pct(L, S)}</b></div>`;
  }

  function paceSvg(w = 460, h = 180) {
    const lm = leaseMetric(); const target = lm ? num(lm.t90) : null;
    let cum = 0; const pts = plan.ninety.pulse.map(r => { if (r.leases == null) return null; cum += +r.leases; return cum; });
    let lastIdx = -1; pts.forEach((v, i) => { if (v != null) lastIdx = i; });
    const actualPts = []; let run = 0; for (let i = 0; i <= lastIdx; i++) { run += +(plan.ninety.pulse[i].leases || 0); actualPts.push(run); }
    const max = Math.max(target || 0, ...actualPts, 10) * 1.1;
    const pad = 30, X = i => pad + (i / WEEKS) * (w - pad - 10), Y = v => h - 22 - (v / max) * (h - 40);
    const tgt = [lm && num(lm.baseline) != null ? 0 : 0, num(lm?.t30), num(lm?.t60), target];
    const tgtLine = target != null ? `<polyline fill="none" stroke="#94a3b8" stroke-dasharray="5 4" stroke-width="2" points="${[[0, 0], [30 / 7, tgt[1]], [60 / 7, tgt[2]], [WEEKS, target]].filter(p => p[1] != null).map(p => `${X(p[0])},${Y(p[1])}`).join(' ')}"/>` : '';
    const act = actualPts.length ? `<polyline fill="none" stroke="#446472" stroke-width="3" points="${X(0)},${Y(0)} ${actualPts.map((v, i) => `${X(i + 1)},${Y(v)}`).join(' ')}"/>${actualPts.map((v, i) => `<circle cx="${X(i + 1)}" cy="${Y(v)}" r="3" fill="#446472"/>`).join('')}` : '';
    const ticks = [0, 4, 8, 13].map(i => `<text x="${X(i)}" y="${h - 6}" font-size="10" fill="#64748b" text-anchor="middle">${i === 0 ? 'Start' : i === 13 ? 'D90' : 'D' + i * 7}</text>`).join('');
    return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;background:#fff;border:1px solid var(--border);border-radius:8px">
      <line x1="${pad}" y1="${h - 22}" x2="${w - 10}" y2="${h - 22}" stroke="#e2e8f0"/>${ticks}${tgtLine}${act}
      <text x="${pad}" y="14" font-size="10" fill="#64748b">— Actual cumulative leases   - - Target path${target != null ? ' (' + target + ')' : ' (set Day 30/60/90 lease targets)'}</text></svg>`;
  }

  function budgetHtml() {
    const n = plan.ninety; const rows = PHASES.map((p, i) => { const b = n.phases[i].initiatives.reduce((s, x) => s + (+x.budget || 0), 0), sp = n.phases[i].initiatives.reduce((s, x) => s + (+x.spent || 0), 0); return { p, b, sp }; });
    const tb = rows.reduce((s, r) => s + r.b, 0), ts = rows.reduce((s, r) => s + r.sp, 0), ap = num(n.approvedBudget);
    const over = ap != null && tb > ap;
    return `<table><thead><tr><th>Phase</th><th>Planned</th><th>Spent</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td>${r.p.label}</td><td>${money(r.b)}</td><td>${money(r.sp)}</td></tr>`).join('')}
      <tr><td><b>Total</b></td><td><b>${money(tb)}</b>${ap != null ? ` of ${money(ap)} approved` : ''}</td><td><b>${money(ts)}</b></td></tr></tbody></table>
      ${over ? `<div class="hint" style="color:var(--off);font-weight:600">Planned spend exceeds approved budget by ${money(tb - ap)}.</div>` : ''}`;
  }

  // ======================= EXPORT =======================
  function reportHtml() {
    const n = plan.ninety, s = n.summary, pr = projection(), inits = initiativeStats(allInitiatives());
    const pri = s.priorities.filter(Boolean);
    const ap = { draft: 'Draft', submitted: 'Submitted for review', approved: 'Approved', revise: 'Needs revision' }[n.approvalStatus] || 'Draft';
    const blank = v => v ? esc(v).replace(/\n/g, '<br>') : '<span style="color:#94a3b8">—</span>';
    return `
    <div class="no-print" style="display:flex;gap:8px;margin-bottom:16px"><button class="btn" onclick="closeReport()">&larr; Back to editor</button><button class="btn primary" onclick="window.print()">Print / Save as PDF</button></div>
    <div style="display:flex;justify-content:space-between;gap:20px;align-items:flex-start">
      <div><div class="meta">${esc(currentProperty)} · 30-60-90 Day Marketing Plan</div><h1>${esc(plan.name)}</h1>
        <div class="meta">${fmtDate(plan.startDate)} – ${fmtDate(plan.endDate)}${plan.termLabel ? ' · ' + esc(plan.termLabel) : ''} · Owner: ${esc(n.owner || '—')} · Status: ${ap}</div></div>
      <div style="text-align:right"><div class="meta">Overall health</div>${pill(overall())}<div class="meta" style="margin-top:4px">Day ${Math.max(0, Math.min(90, dayOfPlan()))} of 90 · Generated ${fmtDate(iso(new Date()))}</div></div>
    </div>
    <h2>Executive summary</h2>
    <div class="callout"><b>Objective:</b> ${blank(s.objective)}</div>
    <div class="two"><div><h4>Situation</h4>${blank(s.situation)}</div><div><h4>Strategy</h4>${blank(s.strategy)}</div></div>
    <div class="two"><div><h4>Top priorities</h4>${pri.length ? '<ol style="margin-left:18px">' + pri.map(p => `<li>${esc(p)}</li>`).join('') + '</ol>' : blank('')}</div>
      <div><h4>Support needed from HQ</h4>${blank(s.hqAsk)}<h4>Audience / current offer</h4>${blank([s.audience, s.special].filter(Boolean).join(' · '))}</div></div>
    <h2>Scorecard</h2>
    <table><thead><tr><th>Metric</th><th>Baseline</th>${CPS.map(c => `<th>D${c} target</th><th>D${c} actual</th>`).join('')}<th>Status</th></tr></thead><tbody>
      ${n.metrics.filter(m => m.name).map(m => { const ls = latestScore(m); return `<tr><td><b>${esc(m.name)}</b>${m.dir === 'down' ? ' <span class="meta">(lower is better)</span>' : ''}</td><td>${fmtVal(num(m.baseline), m.unit)}</td>
        ${CPS.map(c => `<td>${fmtVal(num(m['t' + c]), m.unit)}</td><td><b>${fmtVal(actual(m, c), m.unit)}</b></td>`).join('')}<td>${pill(ls && ls.s)}</td></tr>`; }).join('')}
    </tbody></table>
    <div class="two" style="margin-top:12px"><div><h4>Funnel to date</h4>${funnelHtml()}</div><div><h4>Lease pace</h4>${paceSvg(420, 160)}
      ${pr ? `<div class="meta">${pr.cum} leases in ${pr.weeksLogged} wks · projected ${pr.projected} by Day 90${pr.target != null ? ' vs goal ' + pr.target : ''}${pr.needPerWeek != null ? ` · need ${pr.needPerWeek.toFixed(1)}/wk` : ''}</div>` : ''}</div></div>
    <div class="pagebreak"></div>
    <h2>Execution plan by phase <span class="meta" style="text-transform:none;letter-spacing:0">(${inits.done}/${inits.n} initiatives complete)</span></h2>
    ${PHASES.map((P, i) => { const p = n.phases[i]; const st = initiativeStats(p.initiatives); const s0 = addDays(plan.startDate, P.d0 - 1), e0 = addDays(plan.startDate, P.d1 - 1); return `
      <h4>${P.label} (${fmtShort(s0)} – ${fmtShort(e0)}): ${esc(p.theme || P.name)} <span class="meta">· ${st.done}/${st.n} done</span></h4>
      <div class="meta" style="margin-bottom:6px"><b>Objective:</b> ${esc(p.objective || '—')}</div>
      <table><thead><tr><th>Initiative</th><th>Channel</th><th>Owner</th><th>Due</th><th>Budget</th><th>Success measure</th><th>Status</th></tr></thead><tbody>
      ${p.initiatives.filter(x => x.title).map(x => `<tr><td>${esc(x.title)}</td><td>${esc(x.channel)}</td><td>${esc(x.owner || '—')}</td><td>${fmtShort(x.due) || '—'}</td><td>${x.budget != null ? money(x.budget) : '—'}</td><td>${esc(x.metric || '')}</td><td><span class="pill ${{ done: 'done', in_progress: 'prog', blocked: 'blocked' }[x.status] || 'na'}">${STATUSES[x.status] || ''}</span></td></tr>`).join('') || '<tr><td colspan="7" class="meta">No initiatives</td></tr>'}
      </tbody></table>
      <div class="two" style="margin-top:6px"><div><b class="meta">Exit criteria</b><ul>${p.exit.filter(x => x.text).map(x => `<li>${x.done ? '☑' : '☐'} ${esc(x.text)}</li>`).join('') || '<li class="meta">—</li>'}</ul></div>
        <div>${p.retro.worked || p.retro.didnt || p.retro.adjust ? `<b class="meta">Day ${P.d1} review</b><ul>${p.retro.worked ? `<li><b>Worked:</b> ${esc(p.retro.worked)}</li>` : ''}${p.retro.didnt ? `<li><b>Didn't:</b> ${esc(p.retro.didnt)}</li>` : ''}${p.retro.adjust ? `<li><b>Adjust:</b> ${esc(p.retro.adjust)}</li>` : ''}</ul>` : ''}</div></div>`; }).join('')}
    <h2>Budget</h2>${budgetHtml()}
    <h2>Risks &amp; mitigations</h2>
    <table><thead><tr><th>Risk</th><th>Likelihood</th><th>Impact</th><th>Mitigation</th><th>Owner</th></tr></thead><tbody>
      ${n.risks.filter(r => r.risk).map(r => `<tr><td>${esc(r.risk)}</td><td>${esc(r.likelihood)}</td><td>${esc(r.impact)}</td><td>${esc(r.mitigation)}</td><td>${esc(r.owner)}</td></tr>`).join('') || '<tr><td colspan="5" class="meta">None logged</td></tr>'}</tbody></table>
    <h2>Weekly pulse log</h2>
    <table><thead><tr><th>Week</th><th>Leads</th><th>Tours</th><th>Apps</th><th>Leases</th><th>Pre-lease</th><th>Notes</th></tr></thead><tbody>
      ${n.pulse.map((r, w) => ({ r, w })).filter(({ r }) => ['leads', 'tours', 'apps', 'leases', 'prelease'].some(k => r[k] != null) || r.notes).map(({ r, w }) => `<tr><td>Wk ${w + 1} (${fmtShort(addDays(plan.startDate, w * 7))})</td><td>${r.leads ?? '—'}</td><td>${r.tours ?? '—'}</td><td>${r.apps ?? '—'}</td><td>${r.leases ?? '—'}</td><td>${r.prelease != null ? r.prelease + '%' : '—'}</td><td>${esc(r.notes)}</td></tr>`).join('') || '<tr><td colspan="7" class="meta">No weeks logged yet</td></tr>'}</tbody></table>
    <h2>Sign-off</h2>
    <div class="grid3" style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:20px">
      ${[['Prepared by', n.preparedBy], ['Plan owner', n.owner], ['Reviewed / approved', n.reviewer]].map(([k, v]) => `<div><div style="border-bottom:1px solid #94a3b8;height:28px;padding-top:6px">${esc(v || '')}</div><div class="meta">${k} · Date ________</div></div>`).join('')}
    </div>`;
  }
  function openReport(print) {
    $('report').innerHTML = reportHtml();
    document.body.classList.add('preview'); window.scrollTo(0, 0);
    if (print) setTimeout(() => window.print(), 150);
  }
  function closeReport() { document.body.classList.remove('preview'); }

  function exportCsv() {
    const n = plan.ninety, q = v => `"${String(v ?? '').replace(/"/g, '""')}"`, rows = [];
    rows.push(['Property', currentProperty], ['Plan', plan.name], ['Dates', `${plan.startDate} to ${plan.endDate}`], ['Overall', LABEL[overall()]], []);
    rows.push(['SCORECARD'], ['Metric', 'Unit', 'Baseline', 'D30 Target', 'D30 Actual', 'D60 Target', 'D60 Actual', 'D90 Target', 'D90 Actual', 'Status']);
    n.metrics.forEach(m => rows.push([m.name, m.unit, m.baseline, ...CPS.flatMap(c => [m['t' + c], actual(m, c)]), LABEL[(latestScore(m) || {}).s || 'na']]));
    rows.push([], ['INITIATIVES'], ['Phase', 'Initiative', 'Channel', 'Owner', 'Due', 'Budget', 'Spent', 'Success measure', 'Status']);
    n.phases.forEach((p, i) => p.initiatives.forEach(x => rows.push([PHASES[i].label + ' ' + (p.theme || ''), x.title, x.channel, x.owner, x.due, x.budget, x.spent, x.metric, STATUSES[x.status]])));
    rows.push([], ['WEEKLY PULSE'], ['Week', 'Start', 'Leads', 'Tours', 'Apps', 'Leases', 'Pre-lease %', 'Notes']);
    n.pulse.forEach((r, w) => rows.push([w + 1, addDays(plan.startDate, w * 7), r.leads, r.tours, r.apps, r.leases, r.prelease, r.notes]));
    const blob = new Blob([rows.map(r => r.map(q).join(',')).join('\r\n')], { type: 'text/csv' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${(plan.name || 'plan').replace(/[^a-z0-9]+/gi, '_')}_30-60-90.csv`; a.click();
  }

  init();
  </script>
  <script src="standard-nav.js"></script>
</body>
</html>
