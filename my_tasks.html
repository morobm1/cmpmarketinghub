<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>My Tasks &bull; Marketing Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root{--pri:#446472;--pri-d:#2d4752;--acc2:#52d5ff;--text:#0f1729;--sub:#475569;--muted:#64748b;--bdr:#cbd5e1;--bdr-l:#e2e8f0;--good:#16a34a;--bg:#f1f4f8}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Open Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5}

.topbar{background:var(--pri);color:#fff;padding:16px 20px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--pri-d)}
.topbar .av{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800;flex-shrink:0}
.topbar .info{flex:1}
.topbar .info h1{font-size:18px;font-weight:800;margin-bottom:2px}
.topbar .info .sub{font-size:12px;opacity:.85;font-weight:600}
.topbar button{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);color:#fff;padding:8px 16px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer}
.topbar button:hover{background:rgba(255,255,255,.3)}

.container{max-width:800px;margin:0 auto;padding:20px 16px}

.view-toggle{display:flex;gap:0;margin-bottom:16px;border:2px solid var(--bdr);border-radius:10px;overflow:hidden;background:#fff}
.view-btn{flex:1;padding:10px 16px;font-size:13px;font-weight:700;cursor:pointer;border:none;background:#fff;color:var(--sub);text-align:center;transition:all .15s}
.view-btn:not(:last-child){border-right:2px solid var(--bdr-l)}
.view-btn:hover{background:#f1f5f9;color:var(--text)}
.view-btn.on{background:var(--pri);color:#fff}

.prog-card{background:#fff;border:2px solid var(--bdr);border-radius:12px;padding:20px;margin-bottom:20px;display:flex;align-items:center;gap:16px}
.prog-ring{width:64px;height:64px;position:relative;flex-shrink:0}
.prog-ring svg{transform:rotate(-90deg)}
.prog-ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:900;color:var(--pri)}
.prog-info{flex:1}
.prog-info .t{font-size:15px;font-weight:800;margin-bottom:4px;color:var(--text)}
.prog-info .d{font-size:12px;color:var(--muted);font-weight:600}

.date-nav{display:flex;align-items:center;gap:12px;margin-bottom:20px;justify-content:center}
.date-nav button{background:#fff;border:2px solid var(--bdr);border-radius:8px;padding:8px 16px;font-size:16px;font-weight:800;cursor:pointer;color:var(--text)}
.date-nav button:hover{background:#f1f5f9;border-color:#94a3b8}
.date-nav .dl{font-size:15px;font-weight:800;min-width:180px;text-align:center;color:var(--text)}

.grp{background:#fff;border:2px solid var(--bdr);border-radius:12px;overflow:hidden;margin-bottom:16px}
.grp-hd{padding:12px 16px;font-size:14px;font-weight:800;display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--bdr-l);color:var(--text)}
.grp-hd .dot{width:12px;height:12px;border-radius:3px;flex-shrink:0}
.grp-hd .cnt{margin-left:auto;font-size:12px;font-weight:700;color:var(--muted);background:#e2e8f0;padding:2px 10px;border-radius:999px}

.task{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--bdr-l);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .1s}
.task:last-child{border-bottom:none}
.task:active{background:#f8fafc}
.task.done{background:#f0fdf4}
.task.overdue{background:#fef2f2}
.cb{width:26px;height:26px;border-radius:7px;border:2px solid var(--bdr);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.cb:hover{border-color:#94a3b8}
.task.done .cb{background:var(--good);border-color:var(--good);color:#fff}
.task.done .cb::after{content:'\2713';font-size:15px;font-weight:800}
.task-body{flex:1}
.task-body .lbl{font-size:14px;line-height:1.4;font-weight:600;color:var(--text)}
.task.done .lbl{text-decoration:line-through;color:var(--muted)}
.task-body .meta{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600}
.task-body .meta.overdue-text{color:#dc2626;font-weight:700}

.st{display:inline-block;padding:3px 10px;border-radius:999px;font-size:10px;font-weight:800;margin-left:8px;border:1px solid transparent}
.st-ns{background:#f1f5f9;color:#475569;border-color:#cbd5e1}
.st-wi{background:#fef3c7;color:#92400e;border-color:#fcd34d}
.st-dn{background:#dcfce7;color:#166534;border-color:#86efac}
.st-oh{background:#ede9fe;color:#5b21b6;border-color:#c4b5fd}

.st-pick{display:none;position:fixed;z-index:50;background:#fff;border:2px solid var(--bdr);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);padding:6px;min-width:150px}
.st-pick.show{display:block}
.st-pick div{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:700}
.st-pick div:hover{background:#f1f5f9}

.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty h2{font-size:20px;color:var(--text);margin-bottom:8px;font-weight:800}
.loading{text-align:center;padding:80px 20px;color:var(--muted)}
.loading .spin{width:40px;height:40px;border:4px solid var(--bdr);border-top-color:var(--acc2);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 16px}
@keyframes sp{to{transform:rotate(360deg)}}

@media print{
  .topbar button,.date-nav button,.st-pick,.view-toggle{display:none!important}
  .topbar{background:var(--pri)!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .grp-hd{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .st{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff}.task{cursor:default}
}
  </style>
</head>
<body>

<div id="loadV" class="loading"><div class="spin"></div><div style="font-weight:700">Loading your tasks&hellip;</div></div>
<div id="errV" class="empty" style="display:none"><h2>Unable to Load Tasks</h2><p id="errMsg">Please sign in or check your link.</p><a href="index.html" style="color:var(--acc2);font-weight:700;margin-top:16px;display:inline-block">Go to Login</a></div>

<div id="appV" style="display:none">
  <div class="topbar">
    <div class="av" id="av"></div>
    <div class="info"><h1 id="sName"></h1><div class="sub"><span id="sRole"></span> &middot; <span id="sProp"></span></div></div>
    <button onclick="window.print()">Print</button>
  </div>
  <div class="container">
    <div class="view-toggle">
      <button class="view-btn" data-mode="open" id="vOpen">Open Tasks</button>
      <button class="view-btn" data-mode="month" id="vMonth">Month</button>
      <button class="view-btn on" data-mode="day" id="vDay">Day</button>
    </div>
    <div class="date-nav" id="dateNav">
      <button id="prevD">&larr;</button>
      <div class="dl" id="dLabel"></div>
      <button id="nextD">&rarr;</button>
    </div>
    <div class="prog-card">
      <div class="prog-ring">
        <svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="28" fill="none" stroke="#e2e8f0" stroke-width="5"/><circle cx="32" cy="32" r="28" fill="none" stroke="#22c55e" stroke-width="5" stroke-dasharray="175.93" stroke-dashoffset="175.93" stroke-linecap="round" id="pCircle"/></svg>
        <div class="pct" id="pPct">0%</div>
      </div>
      <div class="prog-info"><div class="t" id="pTitle">0 of 0 tasks</div><div class="d" id="pDetail">Get started!</div></div>
    </div>
    <div id="taskArea"></div>
    <div id="noTasks" class="empty" style="display:none"><h2>No Tasks</h2><p id="noTasksMsg">No tasks assigned for this date.</p></div>
  </div>
</div>

<div class="st-pick" id="stPick">
  <div data-s="Not Started"><span class="st st-ns">Not Started</span></div>
  <div data-s="Working on It"><span class="st st-wi">Working on It</span></div>
  <div data-s="Done"><span class="st st-dn">Done</span></div>
  <div data-s="On Hold"><span class="st st-oh">On Hold</span></div>
</div>

<script>
const GROUPS=[
  {id:'opening',name:'Opening',color:'#3b82f6'},{id:'operations',name:'Operations',color:'#8b5cf6'},
  {id:'turn',name:'Turn / Move-Ins',color:'#f59e0b'},{id:'marketing',name:'Marketing',color:'#10b981'},
  {id:'lead-follow-up',name:'Lead Follow Up',color:'#f97316'},{id:'events',name:'Events',color:'#ec4899'},
  {id:'closing',name:'Closing',color:'#ef4444'},{id:'misc',name:'Misc',color:'#64748b'},
];
const ST_CSS={'Not Started':'st-ns','Working on It':'st-wi','Done':'st-dn','On Hold':'st-oh'};
let staffData=null,myTasks=[],curDate='',viewMode='day';
const params=new URLSearchParams(location.search);
function esc(t){const d=document.createElement('div');d.textContent=t;return d.innerHTML;}
function today(){return new Date().toISOString().slice(0,10);}
function fmtDate(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});}
function fmtMonth(d){return new Date(d+'T12:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});}
async function apiFetch(p){const r=await fetch('/api'+p,{credentials:'include'});if(!r.ok)throw new Error(await r.text()||'HTTP '+r.status);return r.json();}

async function init(){
  try{
    await apiFetch('/me');
    curDate=params.get('date')||today();
    viewMode=params.get('mode')||'day';
    const staffId=params.get('staff')||'';
    let url='/leasing-staff?action=myTasks&date='+curDate+'&mode='+viewMode;
    if(staffId) url+='&staffId='+staffId;
    const data=await apiFetch(url);
    if(!data.staff){showErr('No staff profile found. Ask your admin to link your username.');return;}
    staffData=data.staff;myTasks=data.tasks||[];
    let propName='';
    try{const ps=await apiFetch('/properties');const p=ps.find(x=>x.id===staffData.propertyId);if(p)propName=p.name;}catch(e){}
    document.getElementById('loadV').style.display='none';
    document.getElementById('appV').style.display='';
    const ini=(staffData.employeeName||'').split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
    document.getElementById('av').textContent=ini;
    document.getElementById('sName').textContent=staffData.employeeName;
    document.getElementById('sRole').textContent=staffData.role||'Team Member';
    document.getElementById('sProp').textContent=propName||'Property';
    updateViewToggle();
    updateDateNav();
    render();
  }catch(e){console.error(e);showErr(e.message);}
}
function showErr(m){document.getElementById('loadV').style.display='none';document.getElementById('errV').style.display='';document.getElementById('errMsg').textContent=m;}

function updateViewToggle(){
  document.querySelectorAll('.view-btn').forEach(b=>{
    b.classList.toggle('on',b.dataset.mode===viewMode);
  });
}

function updateDateNav(){
  const nav=document.getElementById('dateNav');
  if(viewMode==='open'){
    nav.style.display='none';
  } else {
    nav.style.display='';
    if(viewMode==='day'){
      document.getElementById('dLabel').textContent=fmtDate(curDate);
    } else {
      document.getElementById('dLabel').textContent=fmtMonth(curDate);
    }
  }
}

function render(){
  const todayStr=today();
  const byG={};myTasks.forEach(t=>{const g=t.groupId||'misc';if(!byG[g])byG[g]=[];byG[g].push(t);});
  let html='',hasAny=false;
  GROUPS.forEach(g=>{
    const items=byG[g.id];if(!items||!items.length)return;hasAny=true;
    const done=items.filter(t=>t.completed).length;
    html+='<div class="grp"><div class="grp-hd"><span class="dot" style="background:'+g.color+'"></span>'+esc(g.name)+'<span class="cnt">'+done+'/'+items.length+'</span></div>';
    items.forEach(t=>{
      const dc=t.completed?'done':'';
      const isOverdue=!t.completed&&t.date&&t.date<todayStr;
      const rowClass='task '+(dc||(isOverdue?'overdue':''));
      const stC=ST_CSS[t.status]||'st-ns';
      const time=t.completedAt?new Date(t.completedAt).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
      const prC={'':'','Low':'color:#1e40af','Medium':'color:#92400e','High':'color:#991b1b','Critical':'color:#fff;background:#dc2626;padding:2px 6px;border-radius:4px'}[t.priority||'']||'';
      html+='<div class="'+rowClass+'" data-tid="'+t._id+'">';
      html+='<div class="cb"></div>';
      html+='<div class="task-body">';
      html+='<div class="lbl">'+esc(t.label)+'<span class="st '+stC+'" data-tid="'+t._id+'" onclick="event.stopPropagation();showSP(this,\''+t._id+'\')">'+esc(t.status)+'</span>';
      if(t.priority) html+='<span style="font-size:10px;font-weight:800;margin-left:6px;'+prC+'">'+esc(t.priority)+'</span>';
      html+='</div>';
      if(viewMode!=='day'&&t.date) html+='<div class="meta'+(isOverdue?' overdue-text':'')+'">Due: '+esc(t.date)+(isOverdue?' (overdue)':'')+'</div>';
      if(viewMode==='day'&&t.date) html+='<div class="meta">Due: '+esc(t.date)+'</div>';
      if(t.notes) html+='<div class="meta">'+esc(t.notes)+'</div>';
      if(t.completed) html+='<div class="meta">Completed '+esc(time)+'</div>';
      html+='</div></div>';
    });
    html+='</div>';
  });
  document.getElementById('taskArea').innerHTML=html;

  var noTasksEl=document.getElementById('noTasks');
  var noTasksMsg=document.getElementById('noTasksMsg');
  if(!hasAny){
    if(viewMode==='open') noTasksMsg.textContent='All tasks are completed!';
    else if(viewMode==='month') noTasksMsg.textContent='No tasks assigned for this month.';
    else noTasksMsg.textContent='No tasks assigned for this date.';
    noTasksEl.style.display='';
  } else {
    noTasksEl.style.display='none';
  }

  var total=myTasks.length,comp=myTasks.filter(t=>t.completed).length;
  var pct=total?Math.round(comp/total*100):0;
  document.getElementById('pPct').textContent=pct+'%';
  if(viewMode==='open'){
    document.getElementById('pTitle').textContent=total+' open task'+(total!==1?'s':'');
    document.getElementById('pDetail').textContent=total===0?'All done!':'Tasks remaining across all dates';
  } else {
    document.getElementById('pTitle').textContent=comp+' of '+total+' tasks completed';
    document.getElementById('pDetail').textContent=pct===100?'All done! Great work.':pct>=50?'Keep going!':'Get started!';
  }
  var circ=document.getElementById('pCircle');
  var C=2*Math.PI*28;
  circ.style.strokeDasharray=C;
  if(viewMode==='open'){
    circ.style.strokeDashoffset=C;
    circ.style.stroke='#52d5ff';
  } else {
    circ.style.strokeDashoffset=C-(pct/100*C);
    circ.style.stroke=pct===100?'#16a34a':'#52d5ff';
  }

  document.querySelectorAll('.task .cb').forEach(cb=>{
    cb.addEventListener('click',async(e)=>{
      e.stopPropagation();
      const row=cb.closest('.task');
      const tid=row.dataset.tid;
      const t=myTasks.find(x=>(x._id||'').toString()===tid);if(!t)return;
      const nv=!t.completed;
      if(nv&&!confirm('Are you sure this task is ready to be marked complete?'))return;
      t.completed=nv;t.completedAt=nv?new Date().toISOString():null;t.status=nv?'Done':'Not Started';
      render();
      try{await fetch('/api/leasing-staff?action=completeTask',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:tid,completed:nv})});}
      catch(e){t.completed=!nv;t.completedAt=null;t.status=nv?'Not Started':'Done';render();alert('Failed');}
    });
  });
}

let spTid=null;
function showSP(el,tid){
  spTid=tid;
  const p=document.getElementById('stPick');
  const r=el.getBoundingClientRect();
  p.style.top=(r.bottom+4)+'px';
  p.style.left=Math.min(r.left,window.innerWidth-170)+'px';
  p.classList.add('show');
}
window.showSP=showSP;
document.querySelectorAll('#stPick > div').forEach(o=>{
  o.addEventListener('click',async()=>{
    document.getElementById('stPick').classList.remove('show');
    if(!spTid)return;
    const t=myTasks.find(x=>(x._id||'').toString()===spTid);if(!t)return;
    const s=o.dataset.s;
    t.status=s;t.completed=s==='Done';t.completedAt=s==='Done'?new Date().toISOString():null;
    render();
    try{await fetch('/api/leasing-staff?action=updateStatus',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:spTid,status:s})});}
    catch(e){render();alert('Failed');}
  });
});
document.addEventListener('click',e=>{if(!e.target.closest('#stPick')&&!e.target.closest('.st'))document.getElementById('stPick').classList.remove('show');});

async function loadTasks(){
  const staffId=params.get('staff')||'';
  let url='/leasing-staff?action=myTasks&date='+curDate+'&mode='+viewMode;
  if(staffId) url+='&staffId='+staffId;
  try{const data=await apiFetch(url);myTasks=data.tasks||[];render();}
  catch(e){document.getElementById('taskArea').innerHTML='<div class="empty"><p>Error loading tasks</p></div>';}
  const u=new URL(location);
  u.searchParams.set('date',curDate);
  u.searchParams.set('mode',viewMode);
  history.replaceState(null,'',u);
}

async function navDate(off){
  if(viewMode==='day'){
    const d=new Date(curDate+'T12:00:00');d.setDate(d.getDate()+off);curDate=d.toISOString().slice(0,10);
  } else if(viewMode==='month'){
    const d=new Date(curDate+'T12:00:00');d.setMonth(d.getMonth()+off);curDate=d.toISOString().slice(0,10);
  }
  updateDateNav();
  await loadTasks();
}

document.getElementById('prevD').addEventListener('click',()=>navDate(-1));
document.getElementById('nextD').addEventListener('click',()=>navDate(1));

document.querySelectorAll('.view-btn').forEach(btn=>{
  btn.addEventListener('click',async()=>{
    viewMode=btn.dataset.mode;
    updateViewToggle();
    updateDateNav();
    await loadTasks();
  });
});

init();
</script>
</body>
</html>
