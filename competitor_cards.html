    // ── Extract bedroom type from floorplan name/bedsBaths ──
    function extractBedroomType(fp) {
      // Try to extract from bedsBaths first (e.g., "1/1", "2x2", "3BR/2BA", "Studio")
      var txt = (fp.bedsBaths || fp.name || '').toLowerCase().trim();
      // Studio / efficiency
      if (txt.indexOf('studio') >= 0 || txt.indexOf('efficiency') >= 0 || txt.indexOf('eff') === 0 || txt === '0') return 'Studio / Efficiency';
      // Pattern: "1x1", "1/1", "1br", "1x1.5" etc
      var m = txt.match(/(\d+)\s*(?:x|\/|br|bd|bed|bath)?\s*(\d*)/);
      if (m) {
        var beds = parseInt(m[1]);
        if (beds === 1) return '1 Bedroom / 1 Bath';
        if (beds === 2) return '2 Bedroom / 2 Bath';
        if (beds === 3) return '3 Bedroom';
        if (beds === 4) return '4 Bedroom';
        if (beds >= 5) return beds + ' Bedroom';
      }
      // Try name patterns
      if (txt.indexOf('1br') >= 0 || txt.indexOf('1x1') >= 0 || txt.indexOf('1/1') >= 0) return '1 Bedroom / 1 Bath';
      if (txt.indexOf('2br') >= 0 || txt.indexOf('2x2') >= 0 || txt.indexOf('2/2') >= 0) return '2 Bedroom / 2 Bath';
      if (txt.indexOf('3br') >= 0 || txt.indexOf('3x3') >= 0 || txt.indexOf('3/3') >= 0) return '3 Bedroom';
      if (txt.indexOf('4br') >= 0 || txt.indexOf('4x4') >= 0 || txt.indexOf('4/4') >= 0) return '4 Bedroom';
      // Return the name as-is if no pattern matched
      return fp.name || fp.bedsBaths || 'Unspecified';
    }

    // Build rate comparison HTML grouped by bedroom type with range and vs-subject arrows
    function buildRateCompareHTML(compCards) {
      var sc = subjectCard;
      var allCards = [];
      if (sc) allCards.push(sc);
      allCards = allCards.concat(compCards);

      // Group floorplans by bedroom type across all properties
      var typeGroups = {}; // bedroomType -> { props: { ci: [fps] } }
      var typeOrder = ['Studio / Efficiency', '1 Bedroom / 1 Bath', '2 Bedroom / 2 Bath', '3 Bedroom', '4 Bedroom', '5 Bedroom'];

      allCards.forEach(function(c, ci) {
        (c.floorplanDetails || []).forEach(function(fp) {
          var bt = extractBedroomType(fp);
          if (!typeGroups[bt]) typeGroups[bt] = { props: {} };
          if (!typeGroups[bt].props[ci]) typeGroups[bt].props[ci] = [];
          typeGroups[bt].props[ci].push({
            name: fp.name,
            bedsBaths: fp.bedsBaths,
            sqft: fp.sqft,
            rate: fp.rate
          });
        });
      });

      var types = Object.keys(typeGroups);
      if (types.length === 0) return '<p style="color:#9ca3af;">No floorplan data available for rate comparison.</p>';

      // Sort types by the order array, with unknown types at the end
      types.sort(function(a, b) {
        var ia = typeOrder.indexOf(a);
        var ib = typeOrder.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return a.localeCompare(b);
      });

      var html = '<table class="rate-compare-table" style="font-size:12px;">';
      html += '<thead><tr><th style="min-width:140px;">Floorplan Type</th>';
      allCards.forEach(function(c, i) {
        var cls = i === 0 && sc ? ' rc-our' : '';
        var label = i === 0 && sc ? 'OUR PROPERTY: ' + esc(subjectCard.competitorName || currentProperty) : esc(c.competitorName);
        html += '<th class="rc-header' + cls + '" style="min-width:160px;">' + label + '</th>';
      });
      html += '</tr></thead><tbody>';

      html += '<tr class="rc-section"><td colspan="' + (allCards.length + 1) + '">Starting Rates by Bedroom Type</td></tr>';

      function parseRateNum(rateStr) {
        if (!rateStr) return 0;
        var cleaned = rateStr.replace(/[^0-9.]/g, '');
        var num = parseFloat(cleaned) || 0;
        // Validate reasonable range (between $100 and $10,000 per month)
        // If number is very small (< 50), might be in hundreds format (e.g., "8.5" meaning "$850")
        if (num > 0 && num < 50) {
          num = num * 100;
        }
        return num;
      }

      function getSubjectRange(bt) {
        if (!sc) return null;
        var fps = (typeGroups[bt] && typeGroups[bt].props[0]) || [];
        var nums = fps.map(function(fp) { return parseRateNum(fp.rate); }).filter(function(n) { return n > 0; });
        if (nums.length === 0) return null;
        return { min: Math.min.apply(null, nums), max: Math.max.apply(null, nums) };
      }

      types.forEach(function(bt) {
        var grp = typeGroups[bt];
        var rowDisplay = [];
        var rowNums = [];
        var subjectRange = getSubjectRange(bt);

        allCards.forEach(function(c, ci) {
          var fps = grp.props[ci] || [];
          if (fps.length === 0) {
            rowDisplay.push('');
            rowNums.push(0);
            return;
          }
          var nums = fps.map(function(fp) { return parseRateNum(fp.rate); }).filter(function(n) { return n > 0; });
          if (nums.length === 0) {
            rowDisplay.push(fps[0].rate || '');
            rowNums.push(0);
            return;
          }
          var minNum = Math.min.apply(null, nums);
          var maxNum = Math.max.apply(null, nums);
          rowNums.push(minNum);

          var displayStr;
          if (nums.length === 1) {
            displayStr = fps[0].rate;
          } else {
            var fmtMin = '$' + minNum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            var fmtMax = '$' + maxNum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            displayStr = fmtMin + ' - ' + fmtMax;
          }

          // Add vs-subject arrow for competitor columns
          if (ci > 0 && nums.length > 0) {
            if (subjectRange) {
              var compMin = minNum;
              var subjMin = subjectRange.min;
              var diff = compMin - subjMin;
              var diffStr = '$' + Math.abs(diff).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

              var arrowHTML = '';
              if (diff < 0) {
                // Competitor cheaper -> we are higher -> RED UP ARROW
                arrowHTML = '<span style="background:#fef2f2;color:#dc2626;padding:3px 8px;border-radius:4px;font-weight:700;font-size:14px;margin-left:6px;white-space:nowrap;">↑ ' + diffStr + '</span>';
              } else if (diff > 0) {
                // Competitor more expensive -> we are lower -> GREEN DOWN ARROW  
                arrowHTML = '<span style="background:#ecfdf5;color:#059669;padding:3px 8px;border-radius:4px;font-weight:700;font-size:14px;margin-left:6px;white-space:nowrap;">↓ ' + diffStr + '</span>';
              } else {
                // Equal
                arrowHTML = '<span style="color:#6b7280;font-weight:500;font-size:12px;margin-left:6px;">= Same</span>';
              }
              displayStr += arrowHTML;
            } else {
              // No comparable data in subject property for this bedroom type
              displayStr += '<span style="color:#9ca3af;font-size:11px;margin-left:6px;font-style:italic;">(no comparable)</span>';
            }
          }

          rowDisplay.push(displayStr);
        });

        var hasData = rowDisplay.some(function(d) { return d; });
        if (!hasData) return;

        var validNums = rowNums.filter(function(n) { return n > 0; });
        var overallMin = validNums.length > 1 ? Math.min.apply(null, validNums) : null;
        var overallMax = validNums.length > 1 ? Math.max.apply(null, validNums) : null;

        html += '<tr><td class="rc-fp-name">' + esc(bt) + '</td>';
        rowDisplay.forEach(function(display, ci) {
          if (!display) {
            html += '<td class="rc-empty">--</td>';
            return;
          }
          var cls = 'rc-rate';
          if (overallMin !== null && rowNums[ci] > 0 && rowNums[ci] === overallMin) cls += ' rc-lowest';
          else if (overallMax !== null && rowNums[ci] > 0 && rowNums[ci] === overallMax) cls += ' rc-highest';
          html += '<td class="' + cls + '">' + display + '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }    // ── Build amenity cart HTML with grouped, cross-property comparison ──

      html += '<tr><td class="ac-amenity-name">Amenity Count</td>';
      allCards.forEach(function(c, ci) {
        var count = (propAmenities[ci] || []).length;
        if (count === 0) {
          count = (rawAmenityMap[ci] || []).length;
        }
        html += '<td style="font-weight:700;color:var(--card-navy);font-size:18px;text-align:center;">' + count + '</td>';
      });
      html += '</tr>';

      html += '</tbody></table>';
      return html;
    }

    // ── Fallback raw amenity cart ──
    function buildRawAmenityCart(allCards, rawMap, allStd, sc) {
      var html = '<table class="amenity-cart-table" style="font-size:12px;">';
      html += '<thead><tr><th style="min-width:120px;">Amenity</th>';
      allCards.forEach(function(c, i) {
        var cls = i === 0 && sc ? ' ac-our' : '';
        var label = i === 0 && sc ? 'OUR PROPERTY: ' + esc(subjectCard.competitorName || currentProperty) : esc(c.competitorName);
        html += '<th class="ac-header' + cls + '">' + label + '</th>';
      });
      html += '</tr></thead><tbody>';

      allStd.forEach(function(amenityLower) {
        html += '<tr><td class="ac-amenity-name">' + esc(amenityLower.charAt(0).toUpperCase() + amenityLower.slice(1)) + '</td>';
        allCards.forEach(function(c, ci) {
          var items = rawMap[ci] || [];
          var found = items.some(function(item) { return item.toLowerCase().indexOf(amenityLower) >= 0 || amenityLower.indexOf(item.toLowerCase()) >= 0; });
          html += '<td>' + (found ? '<span class="ac-present">' + icon('check') + ' Yes</span>' : '<span class="ac-missing">--</span>') + '</td>';
        });
        html += '</tr>';
      });

      html += '<tr class="ac-category"><td colspan="' + (allCards.length + 1) + '">Total Amenities</td></tr>';
      html += '<tr><td class="ac-amenity-name">Count</td>';
      allCards.forEach(function(c, ci) {
        html += '<td style="font-weight:700;color:var(--card-navy);font-size:18px;text-align:center;">' + (rawMap[ci] || []).length + '</td>';
      });
      html += '</tr>';
      html += '</tbody></table>';
      return html;
    }

    // ── Render: Rate Comparison standalone view ──
    function renderRateComparison() {
      currentView = 'rateCompare';

      var ids = getCompareIds();
      var compCards = ids.map(function(id) { return cards.find(function(c) { return c.id === id; }); }).filter(Boolean);

      if (compCards.length < 1) {
        showToast('Select at least 1 competitor to compare (use checkboxes on cards)');
        return;
      }

      els.pageTitle.textContent = 'Rate Comparison';
      els.pageSubtitle.textContent = 'Floorplan rate comparison for ' + esc(currentProperty);
      els.pageSubtitle.style.display = '';

      els.toolbarActions.innerHTML =
        '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back</button>' +
        '<button class="btn btn-outline" id="printRCBtn">' + icon('printer') + ' Print</button>';

      document.getElementById('backBtn').onclick = function() { renderGallery(); };
      document.getElementById('printRCBtn').onclick = function() { window.print(); };

      // Check if subject card exists and has data for validation warnings
      var subjectValid = true;
      var warningMessage = '';

      if (!subjectCard) {
        subjectValid = false;
        warningMessage = '<div style="margin-bottom:16px;padding:12px 16px;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;color:#991b1b;">' +
          '<strong>' + icon('alert') + ' Subject Property Not Set Up</strong><br>' +
          'Set up your property card to see colored arrows comparing your rates to competitors. ' +
          '<button class="btn btn-sm" style="margin-left:8px;background:#dc2626;color:#fff;border-color:#dc2626;" onclick="(function(){ currentCard = createEmptyCard(\'subject\'); currentCard.competitorName = currentProperty; renderEditor(); })()">Set Up Now</button>' +
        '</div>';
      } else if (!subjectCard.floorplanDetails || subjectCard.floorplanDetails.length === 0) {
        subjectValid = false;
        warningMessage = '<div style="margin-bottom:16px;padding:12px 16px;background:#fffbeb;border:1px solid #fde68a;border-radius:8px;color:#78350f;">' +
          '<strong>' + icon('alert') + ' Missing Floorplan Data</strong><br>' +
          'Add floorplan details to your property card to enable rate comparison arrows. ' +
          '<button class="btn btn-sm" style="margin-left:8px;background:#d97706;color:#fff;border-color:#d97706;" onclick="(function(){ handleEditCard(subjectCard); })()">Edit Property Card</button>' +
        '</div>';
      }

      els.mainContent.innerHTML =
        '<div class="compare-bar">' +
          '<div class="compare-info">' + icon('compare') + ' <span style="background:var(--brand-accent-2);color:#1e293b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;font-size:11px;">OUR PROPERTY</span> <span style="margin-left:4px;">' + esc(currentProperty) + ' vs ' + compCards.length + ' competitors</span></div>' +
          '<div class="compare-actions" style="display:flex;flex-direction:column;gap:6px;align-items:flex-end;">' +
            '<div style="display:flex;gap:6px;font-size:11px;opacity:0.85;white-space:nowrap;">' +
              '<span style="background:#ecfdf5;color:#065f46;padding:3px 8px;border-radius:4px;font-weight:500;">Lowest</span>' +
              '<span style="background:#fef2f2;color:#991b1b;padding:3px 8px;border-radius:4px;font-weight:500;">Highest</span>' +
            '</div>' +
            '<div style="display:flex;gap:6px;font-size:11px;white-space:nowrap;">' +
              '<span style="background:#fef2f2;color:#dc2626;padding:3px 8px;border-radius:4px;font-weight:600;">↑ We\'re Higher</span>' +
              '<span style="background:#ecfdf5;color:#059669;padding:3px 8px;border-radius:4px;font-weight:600;">↓ We\'re Lower</span>' +
            '</div>' +
          '</div>' +
        '</div>' +
        warningMessage +
        '<div class="rate-compare-wrap">' + buildRateCompareHTML(compCards) + '</div>';

      if (subjectCard) {
        var note = '<div style="margin-top:8px;padding:10px 16px;background:#f0faff;border-radius:8px;border:1px solid var(--brand-accent-2);display:flex;align-items:center;gap:8px;font-size:13px;color:#1e293b;"><span style="background:var(--brand-accent-2);color:#1e293b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:3px 8px;border-radius:4px;font-size:10px;">OUR PROPERTY</span> <span style="font-weight:600;">' + esc(subjectCard.competitorName || currentProperty) + '</span> included in the <strong>blue-highlighted column</strong>.</div>';
        els.mainContent.innerHTML += note;
      }
    }

    // ── Render: Amenity Cart standalone view ──
    function renderAmenityCart() {
      currentView = 'amenityCart';

      var ids = getCompareIds();
      var compCards = ids.map(function(id) { return cards.find(function(c) { return c.id === id; }); }).filter(Boolean);

      if (compCards.length < 1) {
        showToast('Select at least 1 competitor to compare (use checkboxes on cards)');
        return;
      }

      els.pageTitle.textContent = 'Amenity Cart';
      els.pageSubtitle.textContent = 'Amenity comparison for ' + esc(currentProperty);
      els.pageSubtitle.style.display = '';

      els.toolbarActions.innerHTML =
        '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back</button>' +
        '<button class="btn btn-outline" id="printACBtn">' + icon('printer') + ' Print</button>';

      document.getElementById('backBtn').onclick = function() { renderGallery(); };
      document.getElementById('printACBtn').onclick = function() { window.print(); };

      els.mainContent.innerHTML =
        '<div class="amenity-cart-bar">' +
          '<div class="ac-info">' + icon('check') + ' <span style="background:var(--brand-accent-2);color:#1e293b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 6px;border-radius:4px;font-size:11px;">OUR PROPERTY</span> ' + esc(currentProperty) + ' vs ' + compCards.length + ' competitors</div>' +
          '<div class="ac-actions">' +
            '<span style="font-size:11px;opacity:0.8;"><span style="background:#ecfdf5;padding:2px 6px;border-radius:4px;margin-right:4px;color:#059669;">Present</span></span>' +
          '</div>' +
        '</div>' +
        '<div class="amenity-cart-wrap">' + buildAmenityCartHTML(compCards) + '</div>';

      if (subjectCard) {
        var note = '<div style="margin-top:8px;padding:8px 14px;background:#f0faff;border-radius:8px;border:1px solid var(--brand-accent-2);display:flex;align-items:center;gap:8px;font-size:12px;color:#1e293b;"><span style="background:var(--brand-accent-2);color:#1e293b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:4px;font-size:10px;">OUR PROPERTY</span> <span style="font-weight:600;">' + esc(subjectCard.competitorName || currentProperty) + '</span> included in the <strong>blue-highlighted column</strong>.</div>';
        els.mainContent.innerHTML += note;
      }
    }

    // ── Init ──
    async function init() {
      try {
        var meRes = await fetch('/api/me');
        if (!meRes.ok) { location.href = 'index.html'; return; }
        var me = await meRes.json();
        currentUser = me;

        if (els.adminPageBtn) {
          els.adminPageBtn.style.display = me.role === 'admin' ? '' : 'none';
          els.adminPageBtn.onclick = function() { location.href = 'mmp_admin.html'; };
        }
        if (els.logoutBtn) {
          els.logoutBtn.onclick = async function() {
            try { await fetch('/api/auth-logout', { method: 'POST' }); } catch (e) {}
            location.href = 'index.html';
          };
        }

        var props = [];
        try {
          var pres = await fetch('/api/properties');
          props = await pres.json();
        } catch (e) { props = []; }

        var list = getAccessible(props, me);
        var saved = (localStorage.getItem(STORE_KEY) || '').trim();
        currentProperty = list.includes(saved) ? saved : (list[0] || '');

        if (els.propertySelect) {
          els.propertySelect.innerHTML = list.map(function(p) { return '<option value="' + p.replace(/"/g, '&quot;') + '">' + esc(p) + '</option>'; }).join('');
          els.propertySelect.value = currentProperty;
          els.propertySelect.onchange = async function() {
            currentProperty = els.propertySelect.value;
            localStorage.setItem(STORE_KEY, currentProperty);
            await loadCards();
          };
        }

        await loadCards();
        hideLoading();
      } catch (e) {
        console.error('Init error:', e);
        hideLoading();
        location.href = 'index.html';
      }
    }

    init();
  })();
  </script>
  <script src="standard-nav.js"></script>
</body>
</html>
