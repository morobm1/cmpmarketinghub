    // ══════════════════════════════════════════════════════════════════════
    // ── Admin: Bulk Update Property Images ──
    // Uses the existing admin role check (currentUser.role === 'admin', already gates the
    // toolbar button) and the existing property-to-competitor relationship: subjectCard/cards
    // are already loaded and scoped to currentProperty by loadCards()/silentRefreshCards(), so
    // this tool reads them directly instead of fetching across every accessible property.
    // ══════════════════════════════════════════════════════════════════════
    function renderBulkImageTool() {
      currentView = 'bulkImages';
      viewingCard = null;
      currentCard = null;
      bulkImageFilter = 'all';

      els.pageTitle.textContent = 'Bulk Update Property Images';
      els.pageSubtitle.textContent = currentProperty;
      els.pageSubtitle.style.display = '';
      els.toolbarActions.innerHTML = '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back</button>';
      // Back always returns to the gallery for whatever currentProperty already is — this tool
      // never mutates currentProperty/cards/subjectCard except via explicit Save.
      document.getElementById('backBtn').onclick = function() { renderGallery(); };

      buildBulkImageRowsFromCurrentProperty();
      renderBulkImageTable();
    }

    // Builds bulkImageRows from the already property-scoped in-memory state (subjectCard + cards)
    // for currentProperty only. Preserves any not-yet-saved draft "newValue" typed for a row that
    // still exists, keyed by the card's stable id (never by name or array position).
    function buildBulkImageRowsFromCurrentProperty() {
      var priorDrafts = {};
      bulkImageRows.forEach(function(r) { if (r.newValue) priorDrafts[r.id] = r.newValue; });

      bulkImageRows = [];
      if (subjectCard && subjectCard.id) {
        bulkImageRows.push({
          id: subjectCard.id, property: subjectCard.property || currentProperty, cardType: 'subject',
          name: subjectCard.competitorName || currentProperty, currentImage: subjectCard.heroImage || '',
          newValue: priorDrafts[subjectCard.id] || ''
        });
      }
      cards.forEach(function(c) {
        bulkImageRows.push({
          id: c.id, property: c.property || currentProperty, cardType: c.cardType || 'competitor',
          name: c.competitorName || '(untitled)', currentImage: c.heroImage || '',
          newValue: priorDrafts[c.id] || ''
        });
      });
    }

    function isMissingImageURL(row) { return !row.currentImage || !String(row.currentImage).trim(); }

    function getBulkImageCounts() {
      var all = bulkImageRows.length;
      var missing = bulkImageRows.filter(isMissingImageURL).length;
      return { all: all, missing: missing, has: all - missing };
    }

    function getFilteredBulkImageRows() {
      if (bulkImageFilter === 'missing') return bulkImageRows.filter(isMissingImageURL);
      if (bulkImageFilter === 'has') return bulkImageRows.filter(function(r) { return !isMissingImageURL(r); });
      return bulkImageRows;
    }

    function renderBulkImageTable() {
      var counts = getBulkImageCounts();
      var filtered = getFilteredBulkImageRows();

      var filterBarHTML = '<div class="bit-filter-bar"><span class="bit-filter-label">Show:</span>' +
        [['all', 'All', counts.all], ['missing', 'Missing Image URL', counts.missing], ['has', 'Has Image URL', counts.has]].map(function(f) {
          var active = bulkImageFilter === f[0];
          return '<button type="button" class="btn btn-sm ' + (active ? 'btn-primary' : 'btn-outline') + '" data-bit-filter="' + f[0] + '">' + f[1] + ' (' + f[2] + ')</button>';
        }).join('') +
      '</div>';

      var rowsHTML = filtered.map(function(row) {
        var typeLabel = row.cardType === 'subject' ? 'Our Property' : 'Competitor';
        return '<tr data-bit-row-id="' + esc(row.id) + '">' +
          '<td>' + esc(row.name) + (row.cardType === 'subject' ? ' <span style="font-size:9px;color:#1e293b;background:var(--brand-accent-2);padding:1px 5px;border-radius:3px;font-weight:700;">OUR PROPERTY</span>' : '') + '</td>' +
          '<td>' + esc(typeLabel) + '</td>' +
          '<td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:#6b7280;" title="' + esc(row.currentImage) + '">' + esc(row.currentImage || '(none)') + '</td>' +
          '<td><input type="text" data-bit-input="' + esc(row.id) + '" placeholder="https://\u2026" value="' + esc(row.newValue) + '"></td>' +
          '<td><div class="bit-thumb" id="bitThumb_' + esc(row.id) + '">' + (row.currentImage ? '<img src="' + esc(row.currentImage) + '">' : 'No Image') + '</div></td>' +
        '</tr>';
      }).join('');

      els.mainContent.innerHTML =
        '<div class="bulk-img-summary"><span>' + counts.all + ' record' + (counts.all !== 1 ? 's' : '') + ' in ' + esc(currentProperty) + ' competitor set</span>' +
          '<button class="btn btn-success" id="bitSaveBtn">' + icon('save') + ' Save Changed Images</button>' +
        '</div>' +
        filterBarHTML +
        (bulkImageRows.length === 0 ? '<p style="color:#9ca3af;padding:20px;">No property or competitor cards found for ' + esc(currentProperty) + '.</p>' :
         filtered.length === 0 ? '<p style="color:#9ca3af;padding:20px;">No records match this filter.</p>' :
        '<div class="bulk-img-table-wrap"><table class="bulk-img-table"><thead><tr>' +
          '<th>Property</th><th>Type</th><th>Current Image URL</th><th>New Image URL</th><th>Preview</th>' +
        '</tr></thead><tbody id="bitBody">' + rowsHTML + '</tbody></table></div>');

      document.querySelectorAll('[data-bit-input]').forEach(function(input) {
        input.oninput = function() {
          var id = input.getAttribute('data-bit-input');
          var row = bulkImageRows.find(function(r) { return r.id === id; });
          if (!row) return;
          row.newValue = input.value;
          var tr = input.closest('tr');
          var isChanged = !!(input.value.trim() && input.value.trim() !== row.currentImage);
          if (tr) tr.classList.toggle('bit-changed', isChanged);
          var thumb = document.getElementById('bitThumb_' + id);
          if (thumb) {
            var v = input.value.trim() || row.currentImage;
            thumb.innerHTML = v ? '<img src="' + esc(v) + '" onerror="this.parentElement.textContent=\'Invalid\'">' : 'No Image';
          }
        };
      });

      document.querySelectorAll('[data-bit-filter]').forEach(function(btn) {
        btn.onclick = function() {
          bulkImageFilter = btn.getAttribute('data-bit-filter');
          renderBulkImageTable(); // bulkImageRows itself is untouched, so drafts survive the filter switch
        };
      });

      var saveBtn = document.getElementById('bitSaveBtn');
      if (saveBtn) saveBtn.onclick = saveBulkImageChanges;
    }

    async function saveBulkImageChanges() {
      var changed = bulkImageRows.filter(function(r) { return r.newValue && r.newValue.trim() && r.newValue.trim() !== r.currentImage; });
      if (changed.length === 0) { showToast('No changed images to save'); return; }
      if (!confirm('Save ' + changed.length + ' updated image URL(s) for ' + currentProperty + '? Untouched images will not be modified.')) return;

      var saveBtn = document.getElementById('bitSaveBtn');
      if (saveBtn) { saveBtn.disabled = true; saveBtn.textContent = 'Saving\u2026'; }

      var okCount = 0, failCount = 0;
      for (var i = 0; i < changed.length; i++) {
        var row = changed[i];
        try {
          await apiUpdate({ id: row.id, property: row.property, heroImage: row.newValue.trim() });
          row.currentImage = row.newValue.trim(); // updates Current Image URL + re-evaluates filter membership in place
          row.newValue = '';
          okCount++;
        } catch (e) {
          failCount++;
          console.error('Error saving image for ' + row.name, e);
        }
      }

      showToast('Saved ' + okCount + ' image(s)' + (failCount ? ', ' + failCount + ' failed' : ''));

      // Keep the main app's in-memory state (subjectCard/cards) in sync for currentProperty only.
      await silentRefreshCards();
      // Re-render with the same active filter — rows that just gained an image will naturally
      // drop out of a "Missing Image URL" view since counts/membership are recomputed from the
      // just-updated bulkImageRows above.
      if (currentView === 'bulkImages') renderBulkImageTable();
    }

    // ══════════════════════════════════════════════════════════════════════
    // ── College House Market Overview ──
    // Parses the actual College House workbook structure (Overview / Fundamentals /
    // Universities / Properties / Sales Comps). Raw rows are preserved for future tools;
    // only normalized KPIs are surfaced in the UI. Never auto-creates competitor cards.
    // ══════════════════════════════════════════════════════════════════════
    var CH_SHEET_NAMES = ['Overview', 'Fundamentals', 'Universities', 'Properties', 'Sales Comps'];
    var CH_OVERVIEW_MAP = {
      'Market ID': 'marketId', 'City': 'city', 'State': 'state', 'Date': 'date',
      'On Campus Beds': 'onCampusBeds', 'Purpose Built Beds': 'purposeBuiltBeds',
      'Purpose Built Property Count': 'purposeBuiltPropertyCount', 'Purpose Built Unit Count': 'purposeBuiltUnitCount',
      'Avg Rate Per SF': 'avgRatePerSF', 'Average Rate': 'averageRate', 'Occupancy': 'occupancy',
      'Pre-lease': 'preLease', 'Planned Beds': 'plannedBeds', 'Under Construction Beds': 'underConstructionBeds',
      'Lease Up Beds': 'leaseUpBeds', 'Estimated Excess': 'estimatedExcess', 'Current Availability': 'currentAvailability',
      'Shadow Market Average Rate': 'shadowAverageRate', 'Shadow Market Property Count': 'shadowPropertyCount',
      'Shadow Market Unit Count': 'shadowUnitCount', 'Shadow Market Avg Rate Per SF': 'shadowAvgRatePerSF'
    };
    var CH_BEDROOM_TYPES = ['Studio', '1 Bedroom', '2 Bedroom', '3 Bedroom', '4 Bedroom', '5 Bedroom', '6 Bedroom'];

    function normHeaderKey(h) { return String(h || '').replace(/\s+/g, ' ').trim(); }

    function normalizeCollegeHouseOverview(rows) {
      if (!rows || !rows.length) return null;
      var row = rows[0];
      var out = { bedroomBreakdown: [] };
      Object.keys(row).forEach(function(rawKey) {
        var key = normHeaderKey(rawKey);
        if (CH_OVERVIEW_MAP[key]) out[CH_OVERVIEW_MAP[key]] = row[rawKey];
      });
      CH_BEDROOM_TYPES.forEach(function(bt) {
        var rateKey = bt + ' Average Rate *', occKey = bt + ' Occupancy *', bedKey = bt + ' Bed Count *';
        if (row.hasOwnProperty(rateKey) || row.hasOwnProperty(occKey) || row.hasOwnProperty(bedKey)) {
          out.bedroomBreakdown.push({ type: bt, rate: row[rateKey], occupancy: row[occKey], beds: row[bedKey] });
        }
      });
      return out;
    }

    function parseCollegeHouseWorkbook(wb) {
      var raw = {};
      CH_SHEET_NAMES.forEach(function(name) {
        var ws = wb.Sheets[name];
        if (ws) {
          // Defensive cap keeps the Mongo document reasonably sized while preserving
          // the vast majority of real-world market datasets (Properties sheets are
          // typically a few hundred to ~1000 floorplan rows for a single market).
          raw[name] = XLSX.utils.sheet_to_json(ws, { defval: '' }).slice(0, 3000);
        }
      });
      return { raw: raw, normalized: { overview: normalizeCollegeHouseOverview(raw['Overview']) } };
    }

    function buildCollegeHouseKPIHTML(normalized, compact) {
      if (!normalized || !normalized.overview) return '<p style="color:#9ca3af;">No market overview data found in the uploaded workbook.</p>';
      var ov = normalized.overview;
      function pct(v) { if (v === '' || v === null || typeof v === 'undefined') return '\u2014'; var n = safeParseNum(v); if (!n) return String(v); return (n <= 1 ? (n * 100) : n).toFixed(1) + '%'; }
      function num(v) { if (v === '' || v === null || typeof v === 'undefined') return '\u2014'; var n = safeParseNum(v); return n || n === 0 ? n.toLocaleString('en-US') : String(v); }
      function money(v) { var n = safeParseNum(v); return n ? '$' + n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) : '\u2014'; }

      var kpis = [
        { label: 'Purpose Built Beds', value: num(ov.purposeBuiltBeds) },
        { label: 'Purpose Built Properties', value: num(ov.purposeBuiltPropertyCount) },
        { label: 'Average Rate', value: money(ov.averageRate) },
        { label: 'Average Rate / SF', value: money(ov.avgRatePerSF) },
        { label: 'Occupancy', value: pct(ov.occupancy) },
        { label: 'Pre-Lease', value: pct(ov.preLease) },
        { label: 'Current Availability', value: num(ov.currentAvailability) },
        { label: 'Planned Beds', value: num(ov.plannedBeds) },
        { label: 'Under Construction Beds', value: num(ov.underConstructionBeds) },
        { label: 'Lease-Up Beds', value: num(ov.leaseUpBeds) },
        { label: 'Estimated Excess', value: num(ov.estimatedExcess) }
      ];

      var html = '<div class="ch-kpi-grid">' + kpis.map(function(k) {
        return '<div class="ch-kpi-card"><div class="ch-kpi-value">' + esc(String(k.value)) + '</div><div class="ch-kpi-label">' + esc(k.label) + '</div></div>';
      }).join('') + '</div>';

      if (ov.bedroomBreakdown && ov.bedroomBreakdown.length) {
        html += '<table class="ch-bedroom-table"><thead><tr><th>Bedroom Type</th><th>Avg Rate</th><th>Occupancy</th><th>Bed Count</th></tr></thead><tbody>';
        ov.bedroomBreakdown.forEach(function(b) {
          html += '<tr><td>' + esc(b.type) + '</td><td>' + money(b.rate) + '</td><td>' + pct(b.occupancy) + '</td><td>' + num(b.beds) + '</td></tr>';
        });
        html += '</tbody></table>';
      }
      return html;
    }

    function renderCollegeHouse() {
      currentView = 'collegeHouse';
      viewingCard = null;
      currentCard = null;
      if (!subjectCard) { showToast('Set up Our Property first'); renderGallery(); return; }

      els.pageTitle.textContent = 'College House Market Overview';
      els.pageSubtitle.textContent = 'Third-party market intelligence for ' + esc(currentProperty);
      els.pageSubtitle.style.display = '';
      els.toolbarActions.innerHTML = '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back</button>';
      document.getElementById('backBtn').onclick = function() { renderGallery(); };

      var chData = subjectCard.collegeHouseData;
      if (!chData) {
        els.mainContent.innerHTML = buildCollegeHouseUploadHTML(false);
        attachCollegeHouseUploadHandlers();
        return;
      }

      var metaBar = '<div class="ch-meta-bar"><span>' + icon('file') + ' Imported ' + esc((chData.importedAt || '').split('T')[0] || '') + (chData.sourceFileName ? ' from ' + esc(chData.sourceFileName) : '') + '</span>' +
        '<button class="btn btn-sm btn-outline" id="chReplaceBtn">' + icon('upload') + ' Replace / Upload New Report</button></div>';

      els.mainContent.innerHTML = metaBar + '<div id="chBody">' + buildCollegeHouseKPIHTML(chData.normalized, false) + '</div>' + '<div id="chUploadWrap"></div>';

      document.getElementById('chReplaceBtn').onclick = function() {
        var wrap = document.getElementById('chUploadWrap');
        wrap.innerHTML = buildCollegeHouseUploadHTML(true);
        attachCollegeHouseUploadHandlers();
      };
    }

    function buildCollegeHouseUploadHTML(isReplace) {
      return '<div class="import-intro">' +
        '<h3>' + (isReplace ? 'Replace College House Report' : 'Upload College House Market Report') + '</h3>' +
        '<p>Upload the College House (or similar market intelligence) Excel workbook for this market. Expected sheets: Overview, Fundamentals, Universities, Properties, Sales Comps. Raw rows are preserved for future tools; this data is stored on Our Property and is never used to automatically create competitor cards.</p>' +
      '</div>' +
      '<div class="import-dropzone" id="chDropzone">' +
        '<div class="id-icon">' + icon('upload') + '</div>' +
        '<p><strong>Click to browse</strong> or drag &amp; drop the workbook here</p>' +
        '<p class="id-hint">Accepts .xlsx and .xls files</p>' +
        '<div class="import-file-name" id="chFileName" style="display:none"></div>' +
      '</div>' +
      '<input type="file" id="chFileInput" accept=".xlsx,.xls" style="display:none">' +
      '<div class="xl-status" id="chStatus"></div>';
    }

    function attachCollegeHouseUploadHandlers() {
      var zone = document.getElementById('chDropzone');
      var input = document.getElementById('chFileInput');
      if (!zone || !input) return;
      zone.onclick = function() { input.click(); };
      zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
      zone.addEventListener('dragleave', function() { zone.classList.remove('drag-over'); });
      zone.addEventListener('drop', function(e) { e.preventDefault(); zone.classList.remove('drag-over'); var f = e.dataTransfer.files[0]; if (f) handleCollegeHouseFile(f); });
      input.onchange = function() { var f = input.files[0]; if (f) handleCollegeHouseFile(f); };
    }

    function handleCollegeHouseFile(file) {
      var statusEl = document.getElementById('chStatus');
      var nameEl = document.getElementById('chFileName');
      if (nameEl) { nameEl.style.display = 'block'; nameEl.textContent = '\ud83d\udcce ' + file.name; }
      if (statusEl) { statusEl.className = 'xl-status'; statusEl.textContent = 'Reading workbook\u2026'; }
      var reader = new FileReader();
      reader.onload = async function(e) {
        try {
          var wb = XLSX.read(e.target.result, { type: 'array' });
          var parsed = parseCollegeHouseWorkbook(wb);
          if (!parsed.raw['Overview'] && !parsed.raw['Properties']) {
            if (statusEl) { statusEl.className = 'xl-status err'; statusEl.textContent = 'No recognized sheets found (expected Overview, Fundamentals, Universities, Properties, Sales Comps).'; }
            return;
          }
          subjectCard.collegeHouseData = { raw: parsed.raw, normalized: parsed.normalized, importedAt: new Date().toISOString(), sourceFileName: file.name };
          if (subjectCard.id) {
            await apiUpdate({ id: subjectCard.id, property: subjectCard.property || currentProperty, collegeHouseData: subjectCard.collegeHouseData });
            showToast('College House market data imported');
          } else {
            showToast('Imported \u2014 but Our Property has not been saved yet. Set up and save Our Property first so this data can persist.');
          }
          renderCollegeHouse();
        } catch (err) {
          console.error('College House import error:', err);
          if (statusEl) { statusEl.className = 'xl-status err'; statusEl.textContent = 'Error reading workbook: ' + err.message; }
        }
      };
      reader.readAsArrayBuffer(file);
    }

    // ══════════════════════════════════════════════════════════════════════
    // ── Report Export / PDF Generation (landscape letter, dedicated off-screen layout) ──
    // Builds a fixed-width (independent of viewport/scroll) export DOM per report page,
    // rasterizes each with html2canvas, then slices tall pages across multiple PDF pages
    // so long tables/lists flow naturally instead of being clipped or forced to break
    // mid-row via CSS break rules.
    // ══════════════════════════════════════════════════════════════════════
    var REPORT_PAGE_W = 1056; // px, 11in @ 96dpi (landscape letter width)
    var REPORT_MATRIX_CHUNK_EXPORT = 3; // competitors per Comparison Matrix export page group (1 column each)
    var REPORT_RATE_CHUNK_EXPORT = 2; // competitors per Rate Comparison export page group (2 columns each: Rate + Diff)
    var REPORT_AMENITY_CHUNK_EXPORT = 5; // competitors per Amenity Matrix export page group

    function createExportRoot() {
      var root = document.createElement('div');
      root.className = 'report-export-root';
      document.body.appendChild(root);
      return root;
    }
    function makeExportPage() {
      var page = document.createElement('div');
      page.className = 'report-export-page';
      return page;
    }

    function buildSnapshotCardHTML(card, isOurs) {
      var amenities = parseAmenities(card.topAmenities).slice(0, 5).join(', ');
      return '<div class="rex-snap-card' + (isOurs ? ' rex-ours' : '') + '">' +
        '<div class="rex-snap-img">' + (card.heroImage ? '<img src="' + esc(card.heroImage) + '">' : '') + '</div>' +
        '<div class="rex-snap-head">' + esc(card.competitorName || (isOurs ? currentProperty : 'Untitled')) + '</div>' +
        '<div class="rex-snap-body">' +
          (card.address ? '<div class="rex-row"><span class="rex-label">Address</span><br>' + esc(card.address) + '</div>' : '') +
          '<div class="rex-row"><span class="rex-label">Type</span><br>' + esc(PROPERTY_TYPE_LABELS[card.propertyType] || card.propertyType || '\u2014') + (card.targetAudience ? ' / ' + esc(TARGET_AUDIENCE_LABELS[card.targetAudience] || card.targetAudience) : '') + '</div>' +
          (card.distanceFromCampus ? '<div class="rex-row"><span class="rex-label">Distance</span><br>' + esc(card.distanceFromCampus) + '</div>' : '') +
          (card.floorplans ? '<div class="rex-row"><span class="rex-label">Floorplans</span><br>' + esc(card.floorplans) + '</div>' : '') +
          (card.startingRate ? '<div class="rex-row"><span class="rex-label">Starting Rate</span><br><strong>' + esc(card.startingRate) + '</strong></div>' : '') +
          (card.currentOccupancy ? '<div class="rex-row"><span class="rex-label">Occupancy</span><br>' + esc(card.currentOccupancy) + '</div>' : '') +
          (amenities ? '<div class="rex-row"><span class="rex-label">Top Amenities</span><br>' + esc(amenities) + '</div>' : '') +
          (card.currentSpecials ? '<div class="rex-row"><span class="rex-label">Special</span><br>' + esc(card.currentSpecials) + '</div>' : '') +
          (card.competitiveTakeaway ? '<div class="rex-row"><span class="rex-label">Competitive Takeaway</span><br><em>' + esc(card.competitiveTakeaway) + '</em></div>' : '') +
        '</div>' +
      '</div>';
    }

    function buildExportCoverPage(reportCards, reportDate) {
      var page = makeExportPage();
      var html = '<div style="text-align:center;padding:70px 40px;">' +
        '<h1 style="font-size:30px;color:var(--card-navy);font-weight:800;margin-bottom:6px;">' + esc(currentProperty) + '</h1>' +
        '<h2 style="font-size:20px;color:var(--brand-primary);font-weight:700;margin-bottom:18px;">Market Analysis Report</h2>' +
        '<p style="font-size:13px;color:#9ca3af;">Prepared: ' + esc(reportDate) + '</p>' +
        '<p style="font-size:12px;color:#9ca3af;margin-top:2px;">Capstone Management Partners</p>';
      if (reportCards.length) {
        html += '<div style="margin-top:40px;border-top:1px solid #e5e7eb;padding-top:20px;">' +
          '<p style="font-size:11px;font-weight:700;color:#9ca3af;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;">Competitors Analyzed</p>' +
          '<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;">' +
          reportCards.map(function(c) { return '<span style="background:#f1f5f9;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:600;">' + esc(c.competitorName) + '</span>'; }).join('') +
          '</div></div>';
      }
      html += '</div>';
      page.innerHTML = html;
      return page;
    }

    function buildExportSubjectPage(sc) {
      var page = makeExportPage();
      page.innerHTML = '<div class="rex-header"><h2>Our Property Snapshot</h2><div class="rex-meta">' + esc(currentProperty) + '</div></div>' +
        '<div class="rex-snapshot-grid" style="grid-template-columns:1fr;max-width:420px;">' + buildSnapshotCardHTML(sc, true) + '</div>';
      return page;
    }

    function buildExportCompetitorPages(reportCards) {
      var page = makeExportPage();
      page.innerHTML = '<div class="rex-header"><h2>Competitor Profiles</h2><div class="rex-meta">' + reportCards.length + ' competitor' + (reportCards.length !== 1 ? 's' : '') + '</div></div>' +
        '<div class="rex-snapshot-grid">' + reportCards.map(function(c) { return buildSnapshotCardHTML(c, false); }).join('') + '</div>';
      return [page];
    }

    function buildExportComparisonMatrixPages(reportCards, sc) {
      var groups = chunkArray(reportCards, REPORT_MATRIX_CHUNK_EXPORT);
      if (!groups.length) groups = [[]];
      return groups.map(function(group, gi) {
        var page = makeExportPage();
        var suffix = groups.length > 1 ? ' (Group ' + (gi + 1) + ' of ' + groups.length + ')' : '';
        page.innerHTML = '<div class="rex-header"><h2>Comparison Matrix' + suffix + '</h2><div class="rex-meta">' + esc(currentProperty) + '</div></div>' +
          buildComparisonMatrixTableHTML(group, sc).replace('compare-table', 'compare-table rex-matrix-table');
        return page;
      });
    }

    function buildRateComparisonReportTableHTML(group, sc, rateMode) {
      var ourFps = (sc && sc.floorplanDetails) || [];
      if (!ourFps.length) return '<p style="color:#9ca3af;">No floorplan data available for Our Property.</p>';

      function bestRateForType(card, bt) {
        var matches = (card.floorplanDetails || []).filter(function(fp) { return extractBedroomType(fp) === bt; });
        if (!matches.length) return null;
        var best = null, bestNum = Infinity;
        matches.forEach(function(fp) {
          var n = safeParseNum(fp.rate);
          if (n > 0 && n < bestNum) { bestNum = n; best = fp; }
        });
        return best || matches[0];
      }

      var html = '<table class="rex-rate-table"><thead><tr>' +
        '<th>Floorplan</th><th>Beds</th><th>Baths</th><th>SQ FT</th><th class="rex-ours-col">' + (rateMode === 'future' ? 'Future Rate' : 'Rate') + ' (Ours)</th><th class="rex-ours-col">Rate / SQ FT (Ours)</th>';
      group.forEach(function(c) { html += '<th>' + esc(c.competitorName) + ' Rate</th><th>Diff to Us</th>'; });
      html += '</tr></thead><tbody>';

      ourFps.forEach(function(fp) {
        var bb = splitBedsBaths(fp.bedsBaths);
        var ourRate = fp.rate;
        if (rateMode === 'future') {
          var entry = (sc.futureRates || {})[getFloorplanId(fp)];
          ourRate = entry ? entry.rate : '';
        }
        var bt = extractBedroomType(fp);
        html += '<tr><td class="rex-metric-label">' + esc(fp.name || '') + '</td><td>' + esc(bb.beds) + '</td><td>' + esc(bb.baths) + '</td><td>' + esc(fp.sqft || '') + '</td>' +
          '<td class="rex-ours-col">' + (ourRate ? esc(ourRate) : '<span style="color:#9ca3af;">Not Set</span>') + '</td>' +
          '<td class="rex-ours-col">' + fmtRatePerSqft(ourRate, fp.sqft) + '</td>';
        group.forEach(function(c) {
          var m = bestRateForType(c, bt);
          var compRate = m ? m.rate : '';
          var diffHTML = '<span style="color:#9ca3af;">--</span>';
          var ourNum = safeParseNum(ourRate), compNum = safeParseNum(compRate);
          if (ourNum > 0 && compNum > 0) {
            var diff = compNum - ourNum;
            diffHTML = (diff > 0 ? '+' : '') + fmtMoney(diff);
          }
          html += '<td>' + (compRate ? esc(compRate) : '<span style="color:#9ca3af;">--</span>') + '</td><td>' + diffHTML + '</td>';
        });
        html += '</tr>';
      });
      html += '</tbody></table>';
      return html;
    }

    function buildExportRateComparisonPages(reportCards, sc, rateMode) {
      if (rateMode === 'currentVsFuture') {
        var page = makeExportPage();
        var body = sc ? buildFutureRatesTableHTML(sc, { showStatus: true, editable: false }) : '<p style="color:#9ca3af;">Our Property is not set up.</p>';
        page.innerHTML = '<div class="rex-header"><h2>Rate Comparison \u2014 Current vs Future</h2><div class="rex-meta">' + esc(currentProperty) + '</div></div>' + body;
        return [page];
      }
      var groups = chunkArray(reportCards, REPORT_RATE_CHUNK_EXPORT);
      if (!groups.length) groups = [[]];
      var modeLabel = rateMode === 'future' ? 'Held Future Rates' : 'Current Rates';
      return groups.map(function(group, gi) {
        var page = makeExportPage();
        var suffix = groups.length > 1 ? ' (Group ' + (gi + 1) + ' of ' + groups.length + ')' : '';
        page.innerHTML = '<div class="rex-header"><h2>Rate Comparison' + suffix + '</h2><div class="rex-meta">Source: ' + modeLabel + '</div></div>' +
          buildRateComparisonReportTableHTML(group, sc, rateMode);
        return page;
      });
    }

    function buildExportAmenityPages(reportCards) {
      var groups = chunkArray(reportCards, REPORT_AMENITY_CHUNK_EXPORT);
      if (!groups.length) groups = [[]];
      return groups.map(function(group, gi) {
        var page = makeExportPage();
        var suffix = groups.length > 1 ? ' (Group ' + (gi + 1) + ' of ' + groups.length + ')' : '';
        var html;
        try { html = buildAmenityCartHTML(group, false).replace(/class="amenity-cart-table"/, 'class="amenity-cart-table rex-amenity-table"'); }
        catch (e) { html = '<p style="color:#dc2626;">Amenity cart error: ' + esc(e.message) + '</p>'; }
        page.innerHTML = '<div class="rex-header"><h2>Amenity Matrix' + suffix + '</h2><div class="rex-meta">' + esc(currentProperty) + '</div></div>' + html;
        return page;
      });
    }

    function buildExportCollegeHousePage(sc) {
      if (!sc || !sc.collegeHouseData || !sc.collegeHouseData.normalized) return null;
      var page = makeExportPage();
      page.innerHTML = '<div class="rex-header"><h2>College House Market Overview</h2><div class="rex-meta">' + esc(currentProperty) + '</div></div>' +
        buildCollegeHouseKPIHTML(sc.collegeHouseData.normalized, true);
      return page;
    }

    // Slices a (possibly very tall) rendered canvas into one-or-more PDF pages so long
    // content flows naturally instead of being clipped or forced through CSS break rules.
    function sliceCanvasIntoPdf(pdf, canvas, pageWmm, pageHmm, state) {
      var sliceHeightPx = Math.max(1, Math.floor(canvas.width * (pageHmm / pageWmm)));
      var totalSlices = Math.max(1, Math.ceil(canvas.height / sliceHeightPx));
      for (var i = 0; i < totalSlices; i++) {
        var thisSliceH = Math.min(sliceHeightPx, canvas.height - i * sliceHeightPx);
        if (thisSliceH <= 0) continue;
        var sliceCanvas = document.createElement('canvas');
        sliceCanvas.width = canvas.width;
        sliceCanvas.height = thisSliceH;
        var ctx = sliceCanvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
        ctx.drawImage(canvas, 0, i * sliceHeightPx, canvas.width, thisSliceH, 0, 0, canvas.width, thisSliceH);
        var imgData = sliceCanvas.toDataURL('image/jpeg', 0.92);
        if (state.used) pdf.addPage('letter', 'landscape');
        state.used = true;
        var renderedHmm = pageHmm * (thisSliceH / sliceHeightPx);
        pdf.addImage(imgData, 'JPEG', 0, 0, pageWmm, renderedHmm);
      }
    }

    async function generateReportPDF() {
      var reportCards = Object.keys(reportSelected).filter(function(id) { return reportSelected[id]; }).map(function(id) { return cards.find(function(c) { return c.id === id; }); }).filter(Boolean);
      if (reportCards.length === 0 && (!subjectCard || !reportSections.subjectCard)) {
        showToast('Select at least one competitor, or enable Our Property in Report Builder Step 2');
        return;
      }
      if (typeof window.jspdf === 'undefined' || typeof window.html2canvas === 'undefined') {
        showToast('PDF library failed to load \u2014 check your connection and try again');
        return;
      }
      showToast('Generating PDF\u2026 this may take a few seconds');

      var root = createExportRoot();
      var pages = [];
      var reportDate = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      pages.push(buildExportCoverPage(reportCards, reportDate));
      if (reportSections.subjectCard && subjectCard) pages.push(buildExportSubjectPage(subjectCard));
      if (reportSections.competitorCards && reportCards.length) pages = pages.concat(buildExportCompetitorPages(reportCards));
      if (reportSections.comparisonTable && reportCards.length) pages = pages.concat(buildExportComparisonMatrixPages(reportCards, subjectCard));
      if (reportSections.rateComparison && reportCards.length) pages = pages.concat(buildExportRateComparisonPages(reportCards, subjectCard, reportRateMode));
      if (reportSections.amenityCart && reportCards.length) pages = pages.concat(buildExportAmenityPages(reportCards));
      if (reportSections.collegeHouse && subjectCard && subjectCard.collegeHouseData) {
        var chPage = buildExportCollegeHousePage(subjectCard);
        if (chPage) pages.push(chPage);
      }

      pages.forEach(function(p) { root.appendChild(p); });

      try {
        var jsPDFCtor = window.jspdf.jsPDF;
        var pdf = new jsPDFCtor({ orientation: 'landscape', unit: 'mm', format: 'letter' });
        var pageWmm = pdf.internal.pageSize.getWidth();
        var pageHmm = pdf.internal.pageSize.getHeight();
        var state = { used: false };
        for (var i = 0; i < pages.length; i++) {
          var canvas = await html2canvas(pages[i], { scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false, windowWidth: REPORT_PAGE_W });
          sliceCanvasIntoPdf(pdf, canvas, pageWmm, pageHmm, state);
        }
        var filename = currentProperty.replace(/[^a-z0-9]/gi, '_') + '_Market_Report_' + new Date().toISOString().split('T')[0] + '.pdf';
        pdf.save(filename);
        showToast('PDF downloaded');
      } catch (err) {
        console.error('PDF generation error:', err);
        showToast('Error generating PDF: ' + err.message);
      } finally {
        root.remove();
      }
    }

    // ── Init ──
    async function init() {
      try {
        var meRes = await fetch('/api/me');
        if (!meRes.ok) { location.href = 'index.html'; return; }
        var me = await meRes.json();
        currentUser = me;

        if (els.adminPageBtn) {
          els.adminPageBtn.style.display = me.role === 'admin' ? '' : 'none';
          els.adminPageBtn.onclick = function() { location.href = 'mmp_admin.html'; };
        }
        if (els.logoutBtn) {
          els.logoutBtn.onclick = async function() {
            try { await fetch('/api/auth-logout', { method: 'POST' }); } catch (e) {}
            location.href = 'index.html';
          };
        }

        var props = [];
        try {
          var pres = await fetch('/api/properties');
          props = await pres.json();
        } catch (e) { props = []; }

        var list = getAccessible(props, me);
        var saved = (localStorage.getItem(STORE_KEY) || '').trim();
        currentProperty = list.includes(saved) ? saved : (list[0] || '');

        if (els.propertySelect) {
          els.propertySelect.innerHTML = list.map(function(p) { return '<option value="' + p.replace(/"/g, '&quot;') + '">' + esc(p) + '</option>'; }).join('');
          els.propertySelect.value = currentProperty;
          els.propertySelect.onchange = async function() {
            currentProperty = els.propertySelect.value;
            localStorage.setItem(STORE_KEY, currentProperty);
            await loadCards();
          };
        }

        await loadCards();
        hideLoading();
      } catch (e) {
        console.error('Init error:', e);
        hideLoading();
        location.href = 'index.html';
      }
    }

    init();
  })();
  </script>
