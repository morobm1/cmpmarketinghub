    // ── Render: Comparison ──
    function renderComparison() {
      currentView = 'compare';
      var ids = getCompareIds();
      var compCards = ids.map(function(id) { return cards.find(function(c) { return c.id === id; }); }).filter(Boolean);

      if (compCards.length < 1) { showToast('Select at least 1 card to compare'); renderGallery(); return; }

      els.pageTitle.textContent = 'Competitor Comparison';
      els.pageSubtitle.textContent = 'Comparing ' + compCards.length + ' competitors for ' + currentProperty;
      els.pageSubtitle.style.display = '';
      els.toolbarActions.innerHTML =
        '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back to Gallery</button>' +
        '<button class="btn btn-outline" id="printCompareBtn">' + icon('printer') + ' Print</button>';

      document.getElementById('backBtn').onclick = function() { renderGallery(); };
      document.getElementById('printCompareBtn').onclick = function() { window.print(); };

      // Build comparison table
      var colHeaders = '<th></th><th class="col-header our-prop">' + esc(currentProperty) + '<br><span style="font-size:10px;font-weight:400;opacity:0.8;">Our Property</span></th>';
      compCards.forEach(function(c) {
        colHeaders += '<th class="col-header">' + esc(c.competitorName) + '</th>';
      });

      var sc = subjectCard; // our property data (may be null)
      function ourVal(getter) {
        if (!sc) return '<span style="color:#d1d5db;">--</span>';
        var v = getter(sc);
        return v ? esc(v) : '<span style="color:#d1d5db;">--</span>';
      }

      function row(label, getter, highlight) {
        var cls = highlight ? ' class="highlight"' : '';
        var html = '<tr><th>' + label + '</th><td' + cls + '>' + ourVal(getter) + '</td>';
        compCards.forEach(function(c) {
          var val = getter(c);
          html += '<td' + cls + '>' + (val ? esc(val) : '<span style="color:#d1d5db;">--</span>') + '</td>';
        });
        return html + '</tr>';
      }

      function badgeRow(label, getter, variant) {
        var ourBadge = sc ? (function() { var v = getter(sc); return v ? badgeHTML(variant, v, (variant === 'impact' ? IMPACT_LABELS : VELOCITY_LABELS)[v] || v) : '<span style="color:#d1d5db;">--</span>'; })() : '<span style="color:#d1d5db;">--</span>';
        var html = '<tr><th>' + label + '</th><td>' + ourBadge + '</td>';
        compCards.forEach(function(c) {
          var val = getter(c);
          html += '<td>' + (val ? badgeHTML(variant, val, (variant === 'impact' ? IMPACT_LABELS : VELOCITY_LABELS)[val] || val) : '<span style="color:#d1d5db;">--</span>') + '</td>';
        });
        return html + '</tr>';
      }

      function sectionRow(title) {
        var span = compCards.length + 2;
        return '<tr class="section-row"><th colspan="' + span + '">' + title + '</th></tr>';
      }

      // Floorplan comparison rows
      function fpRows() {
        var html = '';
        function buildFpTable(fps) {
          if (!fps || fps.length === 0) return '<span style="color:#d1d5db;">--</span>';
          var t = '<table class="fp-table" style="margin:0;"><tbody>';
          fps.forEach(function(fp) {
            t += '<tr><td>' + esc(fp.name) + '</td><td>' + esc(fp.bedsBaths) + '</td><td>' + esc(fp.sqft) + '</td><td class="rate-cell">' + esc(fp.rate) + '</td></tr>';
          });
          return t + '</tbody></table>';
        }
        // Our property floorplans
        var allCards = [].concat(sc ? [sc] : []).concat(compCards);
        var hasAnyFP = allCards.some(function(c) { return (c.floorplanDetails || []).length > 0; });
        if (hasAnyFP) {
          // Single row showing all floorplans
          html += '<tr><th>Floorplan Rates</th>';
          html += '<td>' + buildFpTable(sc ? sc.floorplanDetails : []) + '</td>';
          compCards.forEach(function(c) {
            html += '<td>' + buildFpTable(c.floorplanDetails) + '</td>';
          });
          html += '</tr>';
        }
        return html;
      }

      var tableHTML = '<div class="compare-table-wrap"><table class="compare-table"><thead><tr>' + colHeaders + '</tr></thead><tbody>' +
        sectionRow('Property Snapshot') +
        row('Address', function(c) { return c.address; }) +
        row('Property Type', function(c) { return PROPERTY_TYPE_LABELS[c.propertyType] || c.propertyType; }) +
        row('Target Audience', function(c) { return TARGET_AUDIENCE_LABELS[c.targetAudience] || c.targetAudience; }) +
        row('Distance', function(c) { return c.distanceFromCampus; }) +
        row('Drive Time', function(c) { return c.driveTimeToCampus; }) +
        sectionRow('Product Summary') +
        row('Floorplans', function(c) { return c.floorplans; }) +
        row('Unit Count', function(c) { return c.unitCount; }) +
        row('Lease Style', function(c) { return LEASE_STYLE_LABELS[c.leaseStyle] || c.leaseStyle; }) +
        row('Furnished', function(c) { return FURNISHED_LABELS[c.furnished] || c.furnished; }) +
        row('Utilities', function(c) { return UTILITY_LABELS[c.utilityStructure] || c.utilityStructure; }) +
        row('Top Amenities', function(c) { return c.topAmenities; }) +
        row('Parking', function(c) { return c.parkingType; }) +
        row('Pet Policy', function(c) { return c.petPolicy; }) +
        sectionRow('Pricing & Fees') +
        row('Starting Rate', function(c) { return c.startingRate; }, true) +
        row('Est. Above Base', function(c) { return c.estimatedCostAboveBase; }, true) +
        row('Application Fee', function(c) { return c.applicationFee; }) +
        row('Admin Fee', function(c) { return c.adminFee; }) +
        row('Deposit', function(c) { return c.deposit; }) +
        row('Current Specials', function(c) { return c.currentSpecials; }) +
        sectionRow('Floorplan Details') +
        fpRows() +
        sectionRow('Market Performance') +
        row('Occupancy', function(c) { return c.currentOccupancy; }, true) +
        row('Preleased', function(c) { return c.preleasedPercent; }) +
        badgeRow('Leasing Velocity', function(c) { return c.leasingVelocity; }, 'velocity') +
        badgeRow('Impact Level', function(c) { return c.impactToProperty; }, 'impact') +
        row('Competitive Takeaway', function(c) { return c.competitiveTakeaway; }) +
        sectionRow('Strategic Comparison') +
        row('Strengths vs Us', function(c) { return c.biggestStrengths; }) +
        row('Weaknesses vs Us', function(c) { return c.biggestWeaknesses; }) +
        row('Who We Lose To', function(c) { return c.whoWeLoseTo; }) +
        row('Who We Win Against', function(c) { return c.whoWeWinAgainst; }) +
        row('Comparable Floorplans', function(c) { return c.closestComparableFloorplans; }) +
        row('Recommended Positioning', function(c) { return c.recommendedPositioning; }) +
      '</tbody></table></div>';

      els.mainContent.innerHTML =
        '<div class="compare-bar">' +
          '<div class="compare-info">' + icon('compare') + ' <span style="background:var(--brand-accent-2);color:#1e293b;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 6px;border-radius:4px;font-size:11px;">OUR PROPERTY</span> ' + esc(currentProperty) + ' vs ' + compCards.length + ' competitors</div>' +
          '<div class="compare-actions">' +
            '<button class="btn btn-sm btn-outline-light" id="acBtn">' + icon('check') + ' Amenity Cart</button>' +
            '<button class="btn btn-sm btn-outline-light" id="rcBtn">' + icon('compare') + ' Rate Compare</button>' +
            '<button class="btn btn-sm btn-outline-light" id="clearCompareBtn">Clear Selection</button>' +
          '</div>' +
        '</div>' +
        tableHTML;

      var acBtn = document.getElementById('acBtn');
      if (acBtn) acBtn.onclick = function() { renderAmenityCart(); };
      var rcBtn = document.getElementById('rcBtn');
      if (rcBtn) rcBtn.onclick = function() { openRateCompareModal(); };
      document.getElementById('clearCompareBtn').onclick = function() {
        compareSelected = {};
        renderGallery();
      };
    }

    // ── Build Form ──
    function buildForm() {
      var c = currentCard;
      var container = document.getElementById('formContainer');
      var isSubjectCard = c.cardType === 'subject';

      function section(title, iconName, id, fields) {
        return '<div class="form-section open" id="section_' + id + '">' +
          '<div class="form-section-header" onclick="this.parentElement.classList.toggle(\'open\')">' +
            '<span class="section-icon">' + icon(iconName) + '</span>' +
            '<span class="section-title">' + esc(title) + '</span>' +
            '<span class="section-chevron">' + icon('chevronDown') + '</span>' +
          '</div>' +
          '<div class="form-section-body"><div class="form-grid">' + fields + '</div></div>' +
        '</div>';
      }

      function field(label, name, value, opts) {
        opts = opts || {};
        var cls = opts.full ? ' full' : '';
        var req = opts.required ? ' <span class="req">*</span>' : '';
        var input;
        if (opts.type === 'textarea') {
          input = '<textarea data-field="' + esc(name) + '" rows="' + (opts.rows || 3) + '" placeholder="' + esc(opts.placeholder || '') + '">' + esc(value) + '</textarea>';
        } else if (opts.type === 'select') {
          var options = '<option value="">Select...</option>' + opts.options.map(function(o) {
            return '<option value="' + esc(o[0]) + '"' + (value === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>';
          }).join('');
          input = '<select data-field="' + esc(name) + '">' + options + '</select>';
        } else {
          input = '<input type="' + (opts.type || 'text') + '" data-field="' + esc(name) + '" value="' + esc(value) + '" placeholder="' + esc(opts.placeholder || '') + '">';
        }

            currentCard[fieldName] = val;

            els.pageTitle.textContent = val || 'New Competitor Card';
          }
          renderPreview(currentCard, document.getElementById('previewContainer'));
        };
        el.addEventListener('input', handler);

    // ── Floorplan Detail Rows ──
    function renderFPRows() {
      var fpRowsEl = document.getElementById('fpRows');
      if (!fpRowsEl) return;
      var fps = currentCard.floorplanDetails || [];

      fpRowsEl.innerHTML = fps.map(function(fp, i) {
        return '<div class="fp-entry" data-fp-idx="' + i + '">' +
          '<input type="text" data-fp-field="name" value="' + esc(fp.name) + '" placeholder="e.g., 1BR/1BA">' +
          '<input type="text" data-fp-field="bedsBaths" value="' + esc(fp.bedsBaths) + '" placeholder="1/1">' +
          '<input type="text" data-fp-field="sqft" value="' + esc(fp.sqft) + '" placeholder="650">' +
          '<input type="text" data-fp-field="rate" value="' + esc(fp.rate) + '" placeholder="$1,200">' +
          '<button type="button" class="fp-remove" data-fp-remove="' + i + '">&times;</button>' +
        '</div>';
      }).join('');

      // Attach events
      fpRowsEl.querySelectorAll('[data-fp-field]').forEach(function(el) {
        el.oninput = function() {
          var entry = el.closest('.fp-entry');
          var idx = parseInt(entry.getAttribute('data-fp-idx'));
          var field = el.getAttribute('data-fp-field');
          if (!currentCard.floorplanDetails[idx]) return;
          currentCard.floorplanDetails[idx][field] = el.value;
          renderPreview(currentCard, document.getElementById('previewContainer'));
        };
      });

      fpRowsEl.querySelectorAll('[data-fp-remove]').forEach(function(el) {
        el.onclick = function() {
          var idx = parseInt(el.getAttribute('data-fp-remove'));
          currentCard.floorplanDetails.splice(idx, 1);
          renderFPRows();
          renderPreview(currentCard, document.getElementById('previewContainer'));
        };
      });

      var addBtn = document.getElementById('fpAddBtn');
      if (addBtn) {
        addBtn.onclick = function() {
          if (!currentCard.floorplanDetails) currentCard.floorplanDetails = [];
          currentCard.floorplanDetails.push({ id: makeFpId(), name: '', bedsBaths: '', sqft: '', rate: '' });
          renderFPRows();
        };
      }
    }

    // ── Handlers ──
    function handleNewCard() {
      currentCard = createEmptyCard();
      renderEditor();
    }

    function handleEditCard(card) {
      currentCard = JSON.parse(JSON.stringify(card));
      backfillCardDefaults(currentCard);
      renderEditor();
    }

    function handleViewCard(card) {
      viewingCard = card;
      renderViewer();
    }

    async function handleDuplicateCard(card) {
      try {
        var dup = JSON.parse(JSON.stringify(card));
        delete dup.id;
        dup.competitorName = (dup.competitorName || '') + ' (Copy)';
        dup.status = 'draft';
        dup.property = currentProperty;
        var result = await apiCreate(dup);
        dup.id = result.id;
        dup.createdAt = result.createdAt;
        dup.updatedAt = result.updatedAt;
        cards.unshift(dup);
        showToast('Card duplicated');
        renderGallery();
      } catch (e) {
        showToast('Error duplicating card');
        console.error(e);
      }
    }

    async function handleArchiveCard(id) {
      try {
        await apiDelete(id, true);
        var card = cards.find(function(c) { return c.id === id; });
        if (card) { card.status = 'archived'; card.updatedAt = new Date().toISOString(); }
        showToast('Card archived');
        renderGallery();
      } catch (e) {
        showToast('Error archiving card');
        console.error(e);
      }
    }

    function updateCardInState(card) {
      var copy = JSON.parse(JSON.stringify(card));
      if (card.cardType === 'subject') {
        subjectCard = copy;
      } else {
        var idx = cards.findIndex(function(c) { return c.id === card.id; });
        if (idx >= 0) cards[idx] = copy;
        else cards.unshift(copy);
      }
    }

    async function handleSaveDraft() {
      if (!currentCard) return;
      try {
        currentCard.status = 'draft';
        currentCard.property = currentProperty;
        if (currentCard.id) {
          var result = await apiUpdate(currentCard);
          currentCard.updatedAt = result.updatedAt;
        } else {
          var result = await apiCreate(currentCard);
          currentCard.id = result.id;
          currentCard.createdAt = result.createdAt;
          currentCard.updatedAt = result.updatedAt;
        }
        updateCardInState(currentCard);
        showToast('Draft saved');
      } catch (e) {
        showToast('Error saving draft');
        console.error(e);
      }
    }

    async function handleSaveComplete() {
      if (!currentCard) return;
      if (!(currentCard.competitorName || '').trim()) {
        showToast(currentCard.cardType === 'subject' ? 'Property name is required' : 'Competitor name is required');
        return;
      }
      try {
        currentCard.status = 'complete';
        currentCard.property = currentProperty;
        if (currentCard.id) {
          var result = await apiUpdate(currentCard);
          currentCard.updatedAt = result.updatedAt;
        } else {
          var result = await apiCreate(currentCard);
          currentCard.id = result.id;
          currentCard.createdAt = result.createdAt;
          currentCard.updatedAt = result.updatedAt;
        }
        updateCardInState(currentCard);
        showToast('Card saved as complete');
      } catch (e) {
        showToast('Error saving card');
        console.error(e);
      }
    }

    function handlePresentation(card) {
      if (card) {
        viewingCard = card;
        renderPresentation(card);
      }
    }

    // ── Load Data ──
    async function loadCards() {
      try {
        var allCards = await apiGet();
        // Ensure floorplanDetails/futureRates/collegeHouseData exist on all cards (backward compatible)
        allCards.forEach(backfillCardDefaults);
        // Separate subject card from competitor cards
        subjectCard = allCards.find(function(c) { return c.cardType === 'subject'; }) || null;
        cards = allCards.filter(function(c) { return c.cardType !== 'subject'; });
      } catch (e) {
        cards = [];
        subjectCard = null;
        console.error('Error loading cards:', e);
      }
      compareSelected = {};
      renderGallery();
    }


    // ── Parse amenities text into array ──
    function parseAmenities(text) {
      if (!text) return [];
      // Split by comma, semicolon, or newline
      var items = text.split(/[,;\n]+/);
      var result = [];
      items.forEach(function(item) {
        var t = item.trim();
        if (t) result.push(t);
      });
      return result;
    }

      { label: 'Address', fn: function(c) { return c.address; } },
      { label: 'Property Type', fn: function(c) { return PROPERTY_TYPE_LABELS[c.propertyType] || c.propertyType; } },

    // Horizontal metric-rows table: Metric | Our Property | Comp A | Comp B ... Our Property
    // column (and the Metric label column) are repeated in every continuation group.
    function buildComparisonMatrixTableHTML(chunkCards, ourCard) {
      var cols = [];
      if (ourCard) cols.push({ card: ourCard, isOurs: true, label: ourCard.competitorName || currentProperty });
      chunkCards.forEach(function(c) { cols.push({ card: c, isOurs: false, label: c.competitorName || 'Untitled' }); });

      var html = '<div style="overflow-x:auto;"><table class="compare-table" style="width:100%;"><thead><tr><th>Metric</th>';
      cols.forEach(function(col) {
        html += '<th class="col-header' + (col.isOurs ? ' our-prop' : '') + '">' + esc(col.label) +
          (col.isOurs ? '<br><span style="font-size:10px;font-weight:400;opacity:0.8;">Our Property</span>' : '') + '</th>';
      });
      html += '</tr></thead><tbody>';
      COMPARISON_MATRIX_METRICS.forEach(function(m) {
        html += '<tr><th>' + esc(m.label) + '</th>';
        cols.forEach(function(col) {

    // ── Build comparison matrix HTML (for report) — horizontal table with Our Property
    // always first, split into continuation groups when there are too many competitors
    // for one readable table (metric + our property column repeat in every group). ──
    function buildComparisonTableHTML(compCards) {
      var sc = subjectCard;
      if (!sc && compCards.length === 0) return '<p style="color:#9ca3af;">No data to compare.</p>';
      var groups = chunkArray(compCards, COMPARISON_MATRIX_CHUNK);

        html += buildComparisonMatrixTableHTML(group, sc);

    // ── Extract bedroom type from floorplan name/bedsBaths ──
    function extractBedroomType(fp) {
      // Try to extract from bedsBaths first (e.g., "1/1", "2x2", "3BR/2BA", "Studio")
      var txt = (fp.bedsBaths || fp.name || '').toLowerCase().trim();
      // Studio / efficiency
      if (txt.indexOf('studio') >= 0 || txt.indexOf('efficiency') >= 0 || txt.indexOf('eff') === 0 || txt === '0') return 'Studio / Efficiency';
      // Pattern: "1x1", "1/1", "1br", "1x1.5" etc
      var m = txt.match(/(\d+)\s*(?:x|\/|br|bd|bed|bath)?\s*(\d*)/);
      if (m) {
        var beds = parseInt(m[1]);
        if (beds === 1) return '1 Bedroom / 1 Bath';
        if (beds === 2) return '2 Bedroom / 2 Bath';
        if (beds === 3) return '3 Bedroom';
        if (beds === 4) return '4 Bedroom';
        if (beds >= 5) return beds + ' Bedroom';
      }
      // Try name patterns
      if (txt.indexOf('1br') >= 0 || txt.indexOf('1x1') >= 0 || txt.indexOf('1/1') >= 0) return '1 Bedroom / 1 Bath';
      if (txt.indexOf('2br') >= 0 || txt.indexOf('2x2') >= 0 || txt.indexOf('2/2') >= 0) return '2 Bedroom / 2 Bath';
      if (txt.indexOf('3br') >= 0 || txt.indexOf('3x3') >= 0 || txt.indexOf('3/3') >= 0) return '3 Bedroom';
      if (txt.indexOf('4br') >= 0 || txt.indexOf('4x4') >= 0 || txt.indexOf('4/4') >= 0) return '4 Bedroom';
      // Return the name as-is if no pattern matched
      return fp.name || fp.bedsBaths || 'Unspecified';
    }

    // Build rate comparison HTML grouped by bedroom type with range and vs-subject arrows.
    // rateSource: 'current' (default) uses live rates for Our Property; 'future' uses the
    // held/planned rates from subjectCard.futureRates (never falls back to $0 — shows "Not Set").
    function buildRateCompareHTML(compCards, rateSource) {
      rateSource = rateSource || 'current';
      var sc = subjectCard;
      var allCards = [];
      if (sc) allCards.push(sc);
      allCards = allCards.concat(compCards);

      // Group floorplans by bedroom type across all properties
      var typeGroups = {}; // bedroomType -> { props: { ci: [fps] } }
      var typeOrder = ['Studio / Efficiency', '1 Bedroom / 1 Bath', '2 Bedroom / 2 Bath', '3 Bedroom', '4 Bedroom', '5 Bedroom'];

      function effectiveRate(fp, ci) {
        if (ci === 0 && sc && rateSource === 'future') {
          var entry = (sc.futureRates || {})[getFloorplanId(fp)];
          return entry ? entry.rate : '';
        }
        return fp.rate;
      }

      allCards.forEach(function(c, ci) {
        (c.floorplanDetails || []).forEach(function(fp) {
          var bt = extractBedroomType(fp);
          if (!typeGroups[bt]) typeGroups[bt] = { props: {} };
          if (!typeGroups[bt].props[ci]) typeGroups[bt].props[ci] = [];
          typeGroups[bt].props[ci].push({
            name: fp.name,
            bedsBaths: fp.bedsBaths,
            sqft: fp.sqft,
            rate: effectiveRate(fp, ci)
          });
        });
      });

      var types = Object.keys(typeGroups);
      if (types.length === 0) return '<p style="color:#9ca3af;">No floorplan data available for rate comparison.</p>';

      // Sort types by the order array, with unknown types at the end
      types.sort(function(a, b) {
        var ia = typeOrder.indexOf(a);
        var ib = typeOrder.indexOf(b);
        if (ia >= 0 && ib >= 0) return ia - ib;
        if (ia >= 0) return -1;
        if (ib >= 0) return 1;
        return a.localeCompare(b);
      });

      var html = '<table class="rate-compare-table" style="font-size:12px;">';
      html += '<thead><tr><th style="min-width:140px;">Floorplan Type</th>';
      allCards.forEach(function(c, i) {
        var cls = i === 0 && sc ? ' rc-our' : '';
        var label = i === 0 && sc ? 'OUR PROPERTY: ' + esc(subjectCard.competitorName || currentProperty) : esc(c.competitorName);
        html += '<th class="rc-header' + cls + '" style="min-width:160px;">' + label + '</th>';
      });
      html += '</tr></thead><tbody>';

      html += '<tr class="rc-section"><td colspan="' + (allCards.length + 1) + '">Starting Rates by Bedroom Type</td></tr>';

      function parseRateNum(rateStr) {
        if (!rateStr) return 0;
        var cleaned = rateStr.replace(/[^0-9.]/g, '');
        var num = parseFloat(cleaned) || 0;
        // Validate reasonable range (between $100 and $10,000 per month)
        // If number is very small (< 50), might be in hundreds format (e.g., "8.5" meaning "$850")
        if (num > 0 && num < 50) {
          num = num * 100;
        }
        return num;
      }

      function getSubjectRange(bt) {
        if (!sc) return null;
        var fps = (typeGroups[bt] && typeGroups[bt].props[0]) || [];
        var nums = fps.map(function(fp) { return parseRateNum(fp.rate); }).filter(function(n) { return n > 0; });
        if (nums.length === 0) return null;
        return { min: Math.min.apply(null, nums), max: Math.max.apply(null, nums) };
      }

      types.forEach(function(bt) {
        var grp = typeGroups[bt];
        var rowDisplay = [];
        var rowNums = [];
        var subjectRange = getSubjectRange(bt);

        allCards.forEach(function(c, ci) {
          var fps = grp.props[ci] || [];
          if (fps.length === 0) {
            rowDisplay.push('');
            rowNums.push(0);
            return;
          }
          var nums = fps.map(function(fp) { return parseRateNum(fp.rate); }).filter(function(n) { return n > 0; });
          if (nums.length === 0) {
            if (ci === 0 && rateSource === 'future') {
              rowDisplay.push('<span class="fr-not-set">Not Set</span>');
            } else {
              rowDisplay.push(fps[0].rate || '');
            }
            rowNums.push(0);
            return;
          }
          var minNum = Math.min.apply(null, nums);
          var maxNum = Math.max.apply(null, nums);
          rowNums.push(minNum);

          var displayStr;
          if (nums.length === 1) {
            displayStr = fps[0].rate;
          } else {
            var fmtMin = '$' + minNum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            var fmtMax = '$' + maxNum.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
            displayStr = fmtMin + ' - ' + fmtMax;
          }

          // Add vs-subject arrow for competitor columns
          if (ci > 0 && nums.length > 0) {
            if (subjectRange) {
              var compMin = minNum;
              var subjMin = subjectRange.min;
              var diff = compMin - subjMin;
              var diffStr = '$' + Math.abs(diff).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

              var arrowHTML = '';
              if (diff < 0) {
                // Competitor cheaper -> we are higher -> RED UP ARROW
                arrowHTML = '<span style="background:#fef2f2;color:#dc2626;padding:3px 8px;border-radius:4px;font-weight:700;font-size:14px;margin-left:6px;white-space:nowrap;">↑ ' + diffStr + '</span>';
              } else if (diff > 0) {
                // Competitor more expensive -> we are lower -> GREEN DOWN ARROW  
                arrowHTML = '<span style="background:#ecfdf5;color:#059669;padding:3px 8px;border-radius:4px;font-weight:700;font-size:14px;margin-left:6px;white-space:nowrap;">↓ ' + diffStr + '</span>';
              } else {
                // Equal
                arrowHTML = '<span style="color:#6b7280;font-weight:500;font-size:12px;margin-left:6px;">= Same</span>';
              }
              displayStr += arrowHTML;
            } else {
              // No comparable data in subject property for this bedroom type
              displayStr += '<span style="color:#9ca3af;font-size:11px;margin-left:6px;font-style:italic;">(no comparable)</span>';
            }
          }

          rowDisplay.push(displayStr);
        });

        var hasData = rowDisplay.some(function(d) { return d; });
        if (!hasData) return;

        var validNums = rowNums.filter(function(n) { return n > 0; });
        var overallMin = validNums.length > 1 ? Math.min.apply(null, validNums) : null;
        var overallMax = validNums.length > 1 ? Math.max.apply(null, validNums) : null;

        html += '<tr><td class="rc-fp-name">' + esc(bt) + '</td>';
        rowDisplay.forEach(function(display, ci) {
          if (!display) {
            html += '<td class="rc-empty">--</td>';
            return;
          }
          var cls = 'rc-rate';
          if (overallMin !== null && rowNums[ci] > 0 && rowNums[ci] === overallMin) cls += ' rc-lowest';
          else if (overallMax !== null && rowNums[ci] > 0 && rowNums[ci] === overallMax) cls += ' rc-highest';
          html += '<td class="' + cls + '">' + display + '</td>';
        });
        html += '</tr>';
      });

      html += '</tbody></table>';
      return html;
    }

    // Per-floorplan SQ FT / Rate / Rate-per-SqFt detail for Our Property specifically (the
    // bedroom-type bucket table above aggregates across properties and can't show a single
    // SQ FT per row once more than one floorplan shares a bedroom type). Guards against
    // NaN/Infinity/zero via fmtRatePerSqft/safeRatePerSqft.
    function buildOurPropertyFloorplanDetailHTML(card, rateSource) {

        '<table class="rate-compare-table" style="font-size:12px;"><thead><tr><th>Floorplan</th><th>Beds</th><th>Baths</th><th>SQ FT</th><th>' + (showFuture ? 'Future Rate' : 'Rate') + '</th><th>Rate / SQ FT</th></tr></thead><tbody>';
      card.floorplanDetails.forEach(function(fp) {

              var overrideKey = ci + '_' + stdName;
              var present = autoDetected;
              var manualClass = '';
              
              // Check for manual override
              if (amenityOverrides.hasOwnProperty(overrideKey)) {
                present = amenityOverrides[overrideKey];
                if (present && !autoDetected) manualClass = ' ac-manually-added';
                else if (!present && autoDetected) manualClass = ' ac-manually-removed';
              }
              
              var cellClass = editable ? 'ac-editable' + manualClass : manualClass;
              var dataAttrs = editable ? ' data-card-idx="' + ci + '" data-amenity="' + esc(stdName) + '" data-override-key="' + overrideKey + '"' : '';
              
              html += '<td class="' + cellClass + '"' + dataAttrs + '>' + 
                      (present ? '<span class="ac-present">' + icon('check') + ' Yes</span>' : '<span class="ac-missing">--</span>') + 
                      '</td>';
            });
            html += '</tr>';
          });
        } catch (e) {
          console.error('Error processing category ' + cat + ':', e);
        }
      });

      // Summary row
      html += '<tr class="ac-category"><td colspan="' + (allCards.length + 1) + '">Total Amenities</td></tr>';
      html += '<tr><td class="ac-amenity-name">Amenity Count</td>';
      allCards.forEach(function(c, ci) {
        // Count amenities including manual overrides
        var count = 0;
        allStd.forEach(function(stdName) {
          var overrideKey = ci + '_' + stdName;
          var autoDetected = (propAmenities[ci] || []).indexOf(stdName) >= 0;
          var present = autoDetected;
          
          // Check for manual override
          if (amenityOverrides.hasOwnProperty(overrideKey)) {
            present = amenityOverrides[overrideKey];
          }
          
          if (present) count++;
        });
        
        if (count === 0) {
          count = (rawAmenityMap[ci] || []).length;
        }
        html += '<td style="font-weight:700;color:var(--card-navy);font-size:18px;text-align:center;">' + count + '</td>';
      });
      html += '</tr>';

      html += '</tbody></table>';
      
      // Add instructions if editable
      if (editable) {
        html += '<div style="margin-top:12px;padding:12px;background:#f0f9ff;border:1px solid #bae6fd;border-radius:8px;font-size:12px;color:#0c4a6e;">';
        html += '<strong>Tip:</strong> Click on any cell to manually add or remove an amenity for that property. Blue cells = manually added, Pink cells = manually removed.';
        html += ' <button id="resetAmenityOverrides" style="margin-left:12px;padding:4px 12px;background:#ef4444;color:#fff;border:none;border-radius:6px;font-size:11px;font-weight:600;cursor:pointer;">Reset All Manual Changes</button>';
        html += '</div>';
      }
      
      return html;
      
      } catch (error) {
        console.error('buildAmenityCartHTML: Critical error:', error);
        console.error('Error stack:', error.stack);
        return '<p style="color:#dc2626;padding:20px;"><strong>Error generating amenity cart:</strong> ' + error.message + '</p>';
      }
    }
    
    // ── Attach amenity cart edit handlers ──
    function attachAmenityCartHandlers(compCards) {
      console.log('Attaching amenity cart handlers');
      var editableCells = document.querySelectorAll('.ac-editable');
      console.log('Found ' + editableCells.length + ' editable cells');
      
      editableCells.forEach(function(cell) {
        cell.onclick = function() {
          var overrideKey = cell.getAttribute('data-override-key');
          var cardIdx = cell.getAttribute('data-card-idx');
          var amenityName = cell.getAttribute('data-amenity');
          
          console.log('Cell clicked:', overrideKey, cardIdx, amenityName);
          
          // Toggle the override
          if (amenityOverrides.hasOwnProperty(overrideKey)) {
            // Cycle through: override true -> override false -> no override (auto)
            if (amenityOverrides[overrideKey] === true) {
              amenityOverrides[overrideKey] = false;
            } else {
              delete amenityOverrides[overrideKey];
            }
          } else {
            // Set to opposite of auto-detected
            var isAutoPresent = cell.querySelector('.ac-present') !== null;
            amenityOverrides[overrideKey] = !isAutoPresent;
          }
          
          console.log('amenityOverrides updated:', amenityOverrides);
          
          // Refresh the amenity cart section
          refreshAmenityCartInPreview(compCards);
        };
      });
      
      // Reset button
      var resetBtn = document.getElementById('resetAmenityOverrides');
      if (resetBtn) {
        resetBtn.onclick = function() {
          if (confirm('Reset all manual amenity changes? This will restore auto-detection.')) {
            amenityOverrides = {};
            refreshAmenityCartInPreview(compCards);
            showToast('Manual amenity changes reset');
          }
        };
      }
    }
    
    // ── Refresh amenity cart in preview ──
    function refreshAmenityCartInPreview(compCards) {
      var amenitySection = null;
      var allSections = document.querySelectorAll('.report-preview-section');
      allSections.forEach(function(section) {

    function buildRawAmenityCart(allCards, rawMap, allStd, sc) {

    // ── Render: Rate Comparison standalone view ──
    // ══════════════════════════════════════════════════════════════════════
    // ── Generic Modal helpers (new — this app had no modal system; mirrors mmp_admin.html's
    // .modal-overlay/.modal/... structure for visual consistency). Built dynamically and
    // appended to <body> on open, removed on close — no static HTML skeleton needed. ──
    // ══════════════════════════════════════════════════════════════════════
    function closeModal() {
      var existing = document.getElementById('genericModalOverlay');
      if (existing) existing.remove();
    }
    function openModal(titleHTML, bodyHTML, footerHTML) {
      closeModal();
      var overlay = document.createElement('div');
      overlay.className = 'modal-overlay show';
      overlay.id = 'genericModalOverlay';
      overlay.innerHTML =
        '<div class="modal" role="dialog" aria-modal="true">' +
          '<div class="modal-header"><div>' + titleHTML + '</div><button type="button" class="modal-close" id="genericModalCloseBtn">&times;</button></div>' +
          '<div class="modal-body">' + bodyHTML + '</div>' +
          (footerHTML ? '<div class="modal-footer">' + footerHTML + '</div>' : '') +
        '</div>';
      document.body.appendChild(overlay);
      overlay.addEventListener('mousedown', function(e) { if (e.target === overlay) closeModal(); });
      document.getElementById('genericModalCloseBtn').onclick = closeModal;
      return overlay;
    }

    // ── Rate Compare: property selection modal ──
    // Reuses the SAME compareSelected/getCompareIds() state as the per-card Compare checkboxes
    // (single source of truth — no parallel selection system). Candidates are always `cards`,
    // which is already scoped to currentProperty, so no cross-property competitors can appear.
    function openRateCompareModal() {
      var candidates = cards.filter(function(c) { return c.status !== 'archived'; });
      var existingIds = getCompareIds();
      // Working copy: only pre-seed from ids that still correspond to a real candidate — any
      // stale/deleted id in compareSelected is silently dropped here rather than erroring.
      var working = {};
      existingIds.forEach(function(id) {
        if (candidates.some(function(c) { return c.id === id; })) working[id] = true;
      });

      function selectedCount() { return Object.keys(working).filter(function(k) { return working[k]; }).length; }

      function renderBody() {
        if (candidates.length === 0) {
          return '<p style="color:#9ca3af;padding:12px 0;">No competitor properties are currently assigned to this property.</p>';
        }
        var rows = candidates.map(function(c) {
          var checked = working[c.id] ? ' checked' : '';
          var typeLabel = PROPERTY_TYPE_LABELS[c.propertyType] || c.propertyType || '';
          return '<div class="rcm-item"><label style="display:flex;align-items:center;gap:10px;flex:1;min-width:0;cursor:pointer;">' +
            '<input type="checkbox" data-rcm-id="' + esc(c.id) + '"' + checked + '>' +
            '<span class="rcm-name">' + esc(c.competitorName || 'Untitled') + '</span>' +
          '</label>' +
          (typeLabel ? '<span class="rcm-type">' + esc(typeLabel) + '</span>' : '') +
          '<span class="rcm-rate">' + (c.startingRate ? esc(c.startingRate) : '\u2014') + '</span>' +
        '</div>';
        }).join('');
        return '<div style="display:flex;justify-content:flex-end;gap:8px;margin-bottom:8px;">' +
            '<button type="button" class="btn btn-sm btn-outline" id="rcmSelectAllBtn">Select All</button>' +
            '<button type="button" class="btn btn-sm btn-outline" id="rcmClearAllBtn">Clear All</button>' +
          '</div>' +
          '<div class="rcm-list">' + rows + '</div>';
      }

      function attachBodyHandlers() {
        document.querySelectorAll('[data-rcm-id]').forEach(function(cb) {
          cb.onchange = function() {
            var id = cb.getAttribute('data-rcm-id');
            if (cb.checked) working[id] = true; else delete working[id];
            updateCompareSelectedBtn();
          };
        });
        var selectAllBtn = document.getElementById('rcmSelectAllBtn');
        if (selectAllBtn) selectAllBtn.onclick = function() {
          candidates.forEach(function(c) { working[c.id] = true; });
          refresh();
        };
        var clearAllBtn = document.getElementById('rcmClearAllBtn');
        if (clearAllBtn) clearAllBtn.onclick = function() {
          working = {};
          refresh();
        };
      }

      function updateCompareSelectedBtn() {
        var btn = document.getElementById('rcmCompareBtn');
        if (btn) btn.disabled = selectedCount() === 0;
      }

      function refresh() {
        var bodyEl = overlay.querySelector('.modal-body');
        if (bodyEl) bodyEl.innerHTML = renderBody();
        attachBodyHandlers();
        updateCompareSelectedBtn();
      }

      var titleHTML = '<h3>Select Properties to Compare</h3>' +
        '<div class="modal-subtitle">' + esc(currentProperty) + '</div>' +
        '<div class="modal-helper">Choose the competitor properties you want to include in the rate comparison.</div>';
      var footerHTML =
        '<button type="button" class="btn btn-outline modal-footer-left" id="rcmCancelBtn">Cancel</button>' +
        '<button type="button" class="btn btn-primary" id="rcmCompareBtn"' + (selectedCount() === 0 ? ' disabled' : '') + '>Compare Selected</button>';

      var overlay = openModal(titleHTML, renderBody(), footerHTML);
      attachBodyHandlers();

      document.getElementById('rcmCancelBtn').onclick = closeModal;
      document.getElementById('rcmCompareBtn').onclick = function() {
        if (selectedCount() === 0) return;
        // Commit the working copy back into the SAME compareSelected state used by the
        // per-card Compare checkboxes, scoped only to this property's candidate ids.
        candidates.forEach(function(c) {
          if (working[c.id]) compareSelected[c.id] = true;
          else delete compareSelected[c.id];
        });
        closeModal();
        renderRateComparison();
      };
    }

    // ══════════════════════════════════════════════════════════════════════
    // ── Future / Held Rates (Manage Future Rates + Analyst > Held Future Rates) ──
    // Shared by both views so edit/display/save logic is written once (see item 16).
    // ══════════════════════════════════════════════════════════════════════
    function computeFutureRateRows(card) {
      var fps = (card && card.floorplanDetails) || [];
      var futureMap = (card && card.futureRates) || {};
      return fps.map(function(fp) {
        var fpId = getFloorplanId(fp);
        var bb = splitBedsBaths(fp.bedsBaths);
        var entry = futureMap[fpId];
        var futureRateRaw = entry ? (entry.rate || '') : '';
        var hasFuture = !!(futureRateRaw && String(futureRateRaw).trim());
        var currentNum = safeParseNum(fp.rate);
        var futureNum = safeParseNum(futureRateRaw);
        var dollarChange = null, percentChange = null, status = 'Not Set';
        if (hasFuture) {
          if (currentNum > 0) {
            dollarChange = futureNum - currentNum;
            percentChange = (dollarChange / currentNum) * 100;
            if (!isFinite(percentChange)) percentChange = null;
            status = dollarChange > 0 ? 'Increase' : (dollarChange < 0 ? 'Decrease' : 'No Change');
          } else {
            status = 'No Change';
          }
        }
        return {
          fpId: fpId, name: fp.name || '(Unnamed floorplan)', beds: bb.beds, baths: bb.baths, sqft: fp.sqft || '',
          currentRate: fp.rate || '', futureRateRaw: futureRateRaw, hasFuture: hasFuture,
          dollarChange: dollarChange, percentChange: percentChange, status: status
        };
      });
    }

    function statusPillHTML(status) {
      var map = { 'Increase': 'status-increase', 'Decrease': 'status-decrease', 'No Change': 'status-nochange', 'Not Set': 'status-notset' };
      return '<span class="status-pill ' + (map[status] || 'status-notset') + '">' + esc(status) + '</span>';
    }
    function fmtDollarChangeCell(row) {
      if (!row.hasFuture) return '<span class="fr-not-set">Not Set</span>';
      if (row.dollarChange === null) return '<span class="fr-not-set">--</span>';
      var cls = row.dollarChange > 0 ? 'fr-change-pos' : row.dollarChange < 0 ? 'fr-change-neg' : 'fr-change-zero';
      var sign = row.dollarChange > 0 ? '+' : '';
      return '<span class="' + cls + '">' + sign + fmtMoney(row.dollarChange) + '</span>';
    }
    function fmtPercentChangeCell(row) {
      if (!row.hasFuture) return '<span class="fr-not-set">Not Set</span>';
      if (row.percentChange === null || !isFinite(row.percentChange)) return '<span class="fr-not-set">--</span>';
      var cls = row.percentChange > 0 ? 'fr-change-pos' : row.percentChange < 0 ? 'fr-change-neg' : 'fr-change-zero';
      var sign = row.percentChange > 0 ? '+' : '';
      return '<span class="' + cls + '">' + sign + row.percentChange.toFixed(1) + '%</span>';
    }

    function buildFutureRatesTableHTML(card, opts) {
      opts = opts || {};
      var editable = opts.editable !== false;
      var rows = computeFutureRateRows(card);
      if (rows.length === 0) return '<p style="color:#9ca3af;padding:20px;">No floorplans found. Add Floorplan Details on the Our Property card first.</p>';
      var html = '<div class="future-rates-table-wrap"><table class="future-rates-table"><thead><tr>' +
        '<th>Floorplan</th><th>Beds</th><th>Baths</th><th>SQ FT</th><th>Current Rate</th><th>Future Rate</th><th>$ Change</th><th>% Change</th>' +
        (opts.showStatus ? '<th>Status</th>' : '') +
        (editable ? '<th></th>' : '') +
      '</tr></thead><tbody>';
      rows.forEach(function(r) {
        html += '<tr data-fp-id="' + esc(r.fpId) + '">' +
          '<td>' + esc(r.name) + '</td>' +
          '<td>' + esc(r.beds) + '</td>' +
          '<td>' + esc(r.baths) + '</td>' +
          '<td>' + esc(r.sqft) + '</td>' +
          '<td>' + (r.currentRate ? esc(r.currentRate) : '<span class="rc-empty">--</span>') + '</td>' +
          (editable
            ? '<td><input type="text" data-fr-input="' + esc(r.fpId) + '" value="' + esc(r.futureRateRaw) + '" placeholder="Not Set"></td>'
            : '<td>' + (r.hasFuture ? esc(r.futureRateRaw) : '<span class="fr-not-set">Not Set</span>') + '</td>') +
          '<td class="fr-change-cell">' + fmtDollarChangeCell(r) + '</td>' +
          '<td class="fr-pct-cell">' + fmtPercentChangeCell(r) + '</td>' +
          (opts.showStatus ? '<td class="fr-status-cell">' + statusPillHTML(r.status) + '</td>' : '') +
          (editable ? '<td><button type="button" class="btn btn-sm btn-outline" data-fr-clear="' + esc(r.fpId) + '">Clear</button></td>' : '') +
        '</tr>';
      });
      html += '</tbody></table></div>';
      return html;
    }

    function attachFutureRatesHandlers(containerEl, card, opts, afterChange) {
      if (!containerEl || opts.editable === false) return;
      containerEl.querySelectorAll('[data-fr-input]').forEach(function(input) {
        input.oninput = function() {
          var fpId = input.getAttribute('data-fr-input');
          var val = input.value;
          if (!card.futureRates) card.futureRates = {};
          if (val && val.trim()) {
            card.futureRates[fpId] = { rate: val.trim(), updatedAt: new Date().toISOString() };
          } else {
            delete card.futureRates[fpId];
          }
          var row = computeFutureRateRows(card).filter(function(r) { return r.fpId === fpId; })[0];
          var tr = input.closest('tr');
          if (row && tr) {
            var changeCell = tr.querySelector('.fr-change-cell');
            var pctCell = tr.querySelector('.fr-pct-cell');
            var statusCell = tr.querySelector('.fr-status-cell');
            if (changeCell) changeCell.innerHTML = fmtDollarChangeCell(row);
            if (pctCell) pctCell.innerHTML = fmtPercentChangeCell(row);
            if (statusCell) statusCell.innerHTML = statusPillHTML(row.status);
          }
          if (afterChange) afterChange('edit');
        };
      });
      containerEl.querySelectorAll('[data-fr-clear]').forEach(function(btn) {
        btn.onclick = async function() {
          var fpId = btn.getAttribute('data-fr-clear');
          if (card.futureRates) delete card.futureRates[fpId];
          var ok = await persistFutureRates(card);
          if (ok) showToast('Future rate cleared');
          if (afterChange) afterChange('clear-one');
        };
      });
    }

    async function persistFutureRates(card) {
      try {
        var result = await apiUpdate({ id: card.id, property: card.property || currentProperty, futureRates: card.futureRates || {} });
        card.updatedAt = result.updatedAt;
        // Patch only the futureRates field onto the in-memory subjectCard rather than
        // replacing it wholesale — `card` may be an in-progress editor clone with other
        // unsaved (not yet persisted) field edits that must not leak into app state.
        if (card.cardType === 'subject') {
          if (subjectCard && subjectCard.id === card.id) {
            subjectCard.futureRates = JSON.parse(JSON.stringify(card.futureRates || {}));
            subjectCard.updatedAt = result.updatedAt;
          } else {
            subjectCard = JSON.parse(JSON.stringify(card));
          }
        }
        return true;
      } catch (e) {
        console.error('Error saving future rates:', e);
        showToast('Error saving future rates');
        return false;
      }
    }

    // ── Render: Manage Future Rates (Our Property only) ──
    function renderFutureRates(card) {
      currentView = 'futureRates';
      viewingCard = null;
      currentCard = null;
      ensureFloorplanIds(card);
      if (!card.futureRates) card.futureRates = {};

      els.pageTitle.textContent = 'Manage Future Rates';
      els.pageSubtitle.textContent = 'Planned/held rates for ' + esc(card.competitorName || currentProperty) + ' \u2014 current live rates are never overwritten';
      els.pageSubtitle.style.display = '';

      els.toolbarActions.innerHTML =
        '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back</button>' +
        '<button class="btn btn-outline" id="clearAllFRBtn">Clear All</button>' +
        '<button class="btn btn-success" id="saveAllFRBtn">' + icon('save') + ' Save All</button>';
      document.getElementById('backBtn').onclick = function() { renderGallery(); };
      document.getElementById('saveAllFRBtn').onclick = async function() {
        var ok = await persistFutureRates(card);
        if (ok) showToast('Future rates saved');
      };
      document.getElementById('clearAllFRBtn').onclick = async function() {
        if (!confirm('Clear ALL future rates for this property? This cannot be undone.')) return;
        card.futureRates = {};
        var ok = await persistFutureRates(card);
        if (ok) { showToast('All future rates cleared'); renderFutureRates(card); }
      };

      var bulkBarHTML = '<div class="fr-bulk-bar">' +
        '<strong style="font-size:12px;color:var(--subtext);text-transform:uppercase;letter-spacing:0.5px;">Bulk Edit:</strong>' +
        '<span style="font-size:13px;">Adjust every current rate by</span>' +
        '<input type="text" id="frBulkValue" placeholder="e.g. 25 or 3">' +
        '<select id="frBulkType"><option value="percent">%</option><option value="dollar">$</option></select>' +
        '<button class="btn btn-sm btn-primary" id="frBulkApplyBtn">Apply to All Floorplans</button>' +
        '<span style="font-size:11px;color:var(--subtext);">Sets a Future Rate for every floorplan with a current rate. Click Save All to persist.</span>' +
      '</div>';

      function renderTable() {
        document.getElementById('frTableWrap').innerHTML = buildFutureRatesTableHTML(card, { showStatus: false, editable: true });
        attachFutureRatesHandlers(document.getElementById('frTableWrap'), card, { showStatus: false, editable: true }, function(kind) {
          if (kind === 'clear-one') renderFutureRates(card);
        });
      }

      els.mainContent.innerHTML = bulkBarHTML + '<div id="frTableWrap"></div>';
      renderTable();

      document.getElementById('frBulkApplyBtn').onclick = function() {
        var raw = document.getElementById('frBulkValue').value;
        var type = document.getElementById('frBulkType').value;
        var amount = safeParseNum(raw);
        if (!raw || !amount) { showToast('Enter a valid number'); return; }
        if (!card.futureRates) card.futureRates = {};
        (card.floorplanDetails || []).forEach(function(fp) {
          var currentNum = safeParseNum(fp.rate);
          if (currentNum <= 0) return; // nothing to base a bulk change on
          var newNum = type === 'percent' ? currentNum + (currentNum * amount / 100) : currentNum + amount;
          if (!isFinite(newNum) || newNum < 0) return;
          card.futureRates[getFloorplanId(fp)] = { rate: String(Math.round(newNum)), updatedAt: new Date().toISOString() };
        });
        renderTable();
        showToast('Bulk future rates applied \u2014 click Save All to persist');
      };
    }

    // ── Render: Analyst > Held Future Rates ──
    function renderAnalyst() {
      currentView = 'analyst';
      viewingCard = null;
      currentCard = null;
      if (!subjectCard) { showToast('Set up Our Property first'); renderGallery(); return; }
      ensureFloorplanIds(subjectCard);
      if (!subjectCard.futureRates) subjectCard.futureRates = {};

      els.pageTitle.textContent = 'Analyst \u2014 Held Future Rates';
      els.pageSubtitle.textContent = 'Our Property > Analyst for ' + esc(currentProperty);
      els.pageSubtitle.style.display = '';

      els.toolbarActions.innerHTML =
        '<button class="btn btn-back" id="backBtn">' + icon('arrowLeft') + ' Back</button>' +
        '<button class="btn btn-accent" id="goManageFRBtn">' + icon('tag') + ' Manage Future Rates</button>';
      document.getElementById('backBtn').onclick = function() { renderGallery(); };
      document.getElementById('goManageFRBtn').onclick = function() { renderFutureRates(subjectCard); };

        '<div class="report-preview-section">' +

        '</div>';

      function renderTable() {
