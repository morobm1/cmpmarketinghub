<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Creative Studio &bull; Reslife Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="reslife_creative_studio.css" />
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>
  <div id="csBoot" class="cs-boot"><div class="cs-spinner"></div><div>Loading Creative Studio&hellip;</div></div>

  <div id="csApp" class="cs-app hidden">
    <!-- Top bar -->
    <header class="cs-top">
      <a class="cs-back" href="reslife_hub.html" title="Back to Reslife Hub">&larr; Hub</a>
      <div class="cs-brand">
        <img id="csTopLogo" alt="" />
        <div class="cs-brand-text"><b id="csPropName">Property</b><span>Creative Studio</span></div>
      </div>
      <div class="cs-search">
        <input id="csSearch" type="search" placeholder="Search templates, examples, resources, projects…" autocomplete="off" />
        <div id="csSearchResults" class="cs-search-results hidden"></div>
      </div>
      <div class="cs-top-right">
        <select id="csPropSwitch" class="hidden" title="Portfolio access (admin)"></select>
        <span class="cs-role" id="csRole"></span>
        <button class="cs-btn ghost sm" id="csLogout">Log out</button>
      </div>
    </header>

    <div class="cs-shell">
      <nav class="cs-nav" id="csNav">
        <button data-view="home" class="active"><i>&#8962;</i><span>Home</span></button>
        <button data-view="create"><i>&#10010;</i><span>Create</span></button>
        <button data-view="templates"><i>&#9638;</i><span>Templates</span></button>
        <button data-view="campaigns"><i>&#9733;</i><span>Campaigns</span></button>
        <button data-view="communications"><i>&#9993;</i><span>Communications</span></button>
        <button data-view="examples"><i>&#10003;</i><span>Approved Examples</span></button>
        <button data-view="brand"><i>&#9673;</i><span>Brand Kit</span></button>
        <button data-view="photos"><i>&#9635;</i><span>Photos</span></button>
        <button data-view="projects"><i>&#9776;</i><span>My Projects</span></button>
        <button data-view="library"><i>&#9707;</i><span>Creative Library</span></button>
        <button data-view="resources"><i>&#9883;</i><span>Resources</span></button>
        <div class="cs-nav-foot">
          <a href="reslife_email_builder.html" class="cs-nav-link">Advanced Email Builder &rarr;</a>
        </div>
      </nav>
      <main class="cs-main" id="csMain"></main>
    </div>
  </div>

  <!-- Builder (full-screen editor) -->
  <div id="csBuilder" class="cs-builder hidden"></div>
  <!-- Generic modal -->
  <div id="csModal" class="cs-modal hidden"><div class="cs-modal-box"><button class="cs-modal-x" id="csModalX" aria-label="Close">&times;</button><div id="csModalBody"></div></div></div>
  <div id="csToast" class="cs-toast hidden"></div>
  <!-- Off-screen render target for exports and thumbnails -->
  <div id="csRenderHost" aria-hidden="true"></div>

  <script src="properties/registry.js"></script>
  <script src="creative-studio/cs-core.js"></script>
  <script src="creative-studio/cs-render.js"></script>
  <script src="creative-studio/cs-ai.js"></script>
  <script src="creative-studio/cs-email.js"></script>
  <script src="creative-studio/cs-views.js"></script>
  <script src="creative-studio/cs-builder.js"></script>
  <script src="creative-studio/cs-library.js"></script>
  <script>CS.boot();</script>
</body>
</html>
