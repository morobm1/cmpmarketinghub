<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MPLR &bull; Marketing Hub</title>
    <link rel="preconnect" href="https://use.typekit.net" crossorigin>
    <link rel="preconnect" href="https://p.typekit.net" crossorigin>
    <link rel="stylesheet" href="https://use.typekit.net/hqv8hwr.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/mplr-app/dist/assets/mplr-index.css" />
    <meta name="description" content="MPLR - Master Property Lease Registry" />
    <style>
      :root {
        --brand-primary: #446472;
        --brand-accent: #ffb732;
        --brand-accent-2: #52d5ff;
        --border: #e5e7eb;
        --text: #1f2937;
        --subtext: #6b7280;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { font-family: 'Open Sans', system-ui, -apple-system, sans-serif; background: #f1f5f9; }
      #mplr-root { min-height: 100vh; }
      .auth-loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        color: #64748b;
        font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <!-- Static shared header (styled by standard-nav.js) so the sidebar/content are anchored
         correctly at the very top of the page. The MPLR app itself renders its own secondary
         bar (property switch/Admin/Logout) inside #mplr-root below this, unchanged. -->
    <header>
      <div class="brand">
        <img src="logo-main.svg" class="logo-img" alt="Capstone" />
        <div class="title">Marketing Hub</div>
      </div>
    </header>
    <div id="mplr-root">
      <div class="auth-loading">Loading MPLR...</div>
    </div>
    <script>
      // Auth check — redirect to login if not authenticated. The React app
      // performs its own /me check on mount too, this just fails fast.
      (function() {
        fetch('/.netlify/functions/me', { credentials: 'include' })
          .catch(function() {})
          .then(function(r) {
            if (r && !r.ok) window.location.href = 'index.html';
          });
      })();
    </script>
    <script type="module" src="/mplr-app/dist/assets/mplr.js"></script>
    <script src="standard-nav.js"></script>
  </body>
</html>
